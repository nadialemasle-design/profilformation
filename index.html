<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assistant d'entretien IA métier</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Mise en page compacte, pensée pour tenir sur un écran : en-tête sur une ligne ; profils à gauche ; parcours en colonnes à droite.
   Repères : bleu CCI = structure et navigation ; vert clair = ce qui différencie (pourquoi ce parcours, module propre au parcours, le plus adapté). */
:root{
  --bg:#F5F8FB; --surface:#FFFFFF; --sunk:#EDF2F7; --line:#D3DCE6;
  --fg:#14212B; --muted:#516170;
  --blue:#00519E; --blue-ink:#00427F; --blue-soft:#E4EEF8; --on-blue:#FFFFFF;
  --green:#2E6B1E; --green-mid:#7CC04B; --green-soft:#E8F5DF;
  --absent:#F1F3F5;
  --orange:#C2410C; --orange-soft:#FDEBDD;
  --font-body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1620; --surface:#15202B; --sunk:#1B2834; --line:#2C3B4A; --fg:#E3EAF1; --muted:#9DADBD;
  --blue:#2F7BD0; --blue-ink:#8DBDF0; --blue-soft:#17304A; --on-blue:#FFFFFF;
  --green:#A6DB82; --green-mid:#7CC04B; --green-soft:#1E3318; --absent:#1A242E; --orange:#F59E5B; --orange-soft:#3A2414; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1620; --surface:#15202B; --sunk:#1B2834; --line:#2C3B4A; --fg:#E3EAF1; --muted:#9DADBD;
  --blue:#2F7BD0; --blue-ink:#8DBDF0; --blue-soft:#17304A; --on-blue:#FFFFFF;
  --green:#A6DB82; --green-mid:#7CC04B; --green-soft:#1E3318; --absent:#1A242E; --orange:#F59E5B; --orange-soft:#3A2414; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45;margin:0}
.wrap{max-width:1680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 24px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px;padding-bottom:12px;margin-bottom:12px;border-bottom:3px solid var(--blue)}
.brand{display:flex;flex-direction:column;min-width:0}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-ink)}
h1{font-size:22px;line-height:1.2;margin:0;font-weight:700;text-wrap:balance}
.domains{display:flex;flex-wrap:wrap;gap:6px}
.dom{font:inherit;font-weight:600;font-size:14px;border:1px solid var(--blue);background:var(--surface);color:var(--blue-ink);padding:7px 14px;border-radius:999px;cursor:pointer;min-height:38px}
.dom:hover{background:var(--blue-soft)}
.dom[aria-pressed="true"]{background:var(--blue);color:var(--on-blue)}

.grid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);max-height:calc(100vh - 16px);overflow:auto;padding-right:4px}
@media (max-width:900px){.side{position:static;max-height:none;overflow:visible}}
.searchlab{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.search{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.group-old h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-ink);margin:0 0 5px;font-weight:700;padding-left:8px;border-left:3px solid var(--blue)}
.profiles{display:flex;flex-direction:column;gap:4px}
.prof{font:inherit;font-size:13.5px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:7px;padding:7px 10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:40px}
.prof:hover{border-color:var(--blue)}
.prof[aria-pressed="true"]{border-color:var(--blue);background:var(--blue);color:var(--on-blue)}
.prof span{font-weight:500;line-height:1.3}
.count{flex:none;font-family:var(--font-mono);font-size:11.5px;font-weight:500;color:var(--green);background:var(--green-soft);border-radius:999px;padding:0 7px;font-variant-numeric:tabular-nums}
.prof[aria-pressed="true"] .count{background:var(--green-mid);color:#10260A}
button:focus-visible,.search:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.none{color:var(--muted);font-size:14px}

.result{display:flex;flex-direction:column;gap:7px;min-width:0}
.head{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:var(--r);padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 28px;align-items:flex-start}
.head .who{flex:1 1 300px;min-width:0}
.head .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-ink);font-weight:700}
.head .name{font-size:18px;font-weight:700;line-height:1.25;margin:1px 0 2px;text-wrap:balance}
.facts{flex:1 1 300px;display:flex;flex-direction:column;gap:4px;margin:0;min-width:0;font-size:13.5px}
.facts div{display:grid;grid-template-columns:128px minmax(0,1fr);gap:8px}
@media (max-width:480px){.facts div{grid-template-columns:minmax(0,1fr);gap:0}}
.facts dt{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue-ink);padding-top:2px}
.facts dd{margin:0}
.note{font-size:12.5px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px;border:1px solid var(--line)}
.legend .lg-why{background:var(--green-soft);border-color:var(--green-mid)}
.legend .lg-spec{background:var(--green-soft);border-left:3px solid var(--green-mid)}
.legend .lg-com{background:var(--surface)}
.legend .lg-abs{background:var(--absent)}

.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.cmp{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed}
.cmp col.rowh{width:92px}
.cmp th,.cmp td{text-align:left;vertical-align:top;padding:7px 10px;border-bottom:1px solid var(--line);font-size:13.5px}
.cmp tr:last-child th,.cmp tr:last-child td{border-bottom:none}
.cmp td,.cmp thead th + th{border-left:1px solid var(--line)}
.cmp thead th{background:var(--blue);color:var(--on-blue);vertical-align:top}
.cmp thead th:first-child{background:var(--blue-ink)}
.cmp thead .pname{font-size:14.5px;font-weight:700;line-height:1.25;display:block}
.cmp thead .pint{font-size:11.5px;opacity:.85;font-weight:400;display:block;margin-top:2px;line-height:1.35}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.pill{font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;background:rgba(255,255,255,.18);color:var(--on-blue)}
.pill.best{background:var(--green-mid);color:#10260A}
.cmp tbody th{font-weight:600;font-size:12px;color:var(--blue-ink);background:var(--blue-soft);position:sticky;left:0;z-index:1}
.code{font-family:var(--font-mono);font-size:11.5px;color:var(--on-blue);background:var(--blue);border-radius:5px;padding:1px 6px;white-space:nowrap}
.mt{display:block;font-size:11.5px;color:var(--muted);margin-bottom:2px;line-height:1.3}
.cmp td.why{background:var(--green-soft);font-weight:600;color:var(--fg)}
.cmp td.spec{background:var(--green-soft);box-shadow:inset 3px 0 0 var(--green-mid)}
.cmp td.spec .mt{color:var(--green)}
.cmp td.abs{background:var(--absent);color:var(--muted);font-size:12px;padding-block:4px;vertical-align:middle}
.cmp td.all{text-align:center}
.cmp .mt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp td.all .mt{display:block}
.cmp tr.whyrow th{background:var(--green-soft);color:var(--green)}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-5px;margin-right:6px}
.dom .ic{width:22px;height:22px;vertical-align:-6px;margin-right:8px}
.pill .ic{width:15px;height:15px;vertical-align:-3px;margin-right:4px}
.mt .ic{width:18px;height:18px;vertical-align:-5px;margin-right:5px}
.need{display:flex;gap:4px;align-items:flex-start}.need .ic{width:20px;height:20px;margin-top:0;color:var(--blue-ink)}
.facts dt{white-space:nowrap}.facts dt .ic{width:18px;height:18px;vertical-align:-5px}
.rh{display:flex;flex-direction:column;gap:2px;align-items:flex-start}.rh .ic{width:26px;height:26px}
.cmp td.why::before{content:"";}
.cmp td.abs .ic{width:18px;height:18px;vertical-align:-5px}

.lg{display:inline-flex;align-items:center;font-size:12.5px}
.lg.g .ic{color:var(--green)}.lg.b .ic{color:var(--blue-ink)}
.lg .ic{width:24px;height:24px;padding:2px;border-radius:5px}
.lg.g .ic{background:var(--green-soft)}.lg.b .ic{background:var(--blue-soft)}
/* Repère orange : chaque icône et le titre qui l'accompagne. */
.head .lab,.head .lab .ic,.need .ic,.nlab,.facts dt,.facts dt .ic{color:var(--orange)}
.nlab{font-weight:700;font-size:12.5px}
.cmp tr.whyrow th,.cmp tr.whyrow th .ic{color:var(--orange)}
.mt .ic,.cmp td.abs .ic{color:var(--orange)}
.lg,.lg.g .ic,.lg.b .ic,.lg .ic{color:var(--orange)}
.lg.g .ic,.lg.b .ic,.lg .ic{background:var(--orange-soft)}
.lg{font-weight:600}
.cmp thead th.cnt{text-align:center;vertical-align:middle}
.cnt .num{display:block;font-size:34px;font-weight:700;line-height:1;color:var(--green-mid);font-variant-numeric:tabular-nums}
.cnt .cl{display:block;font-size:13px;font-weight:700;line-height:1.2;margin-top:4px}
details.group{border-radius:8px}
details.group summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:var(--blue-soft);color:var(--blue-ink);font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;min-height:40px;border-left:4px solid var(--blue)}
details.group summary::-webkit-details-marker{display:none}
details.group summary:hover{background:var(--line)}
details.group summary:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
details.group .sum{flex:1;min-width:0;line-height:1.3}
.ccount{flex:none;font-family:var(--font-mono);font-size:11.5px;letter-spacing:0;background:var(--surface);color:var(--blue-ink);border-radius:999px;padding:0 7px}
.chev{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
details.group[open] .chev{transform:rotate(180deg)}
details.group .profiles{padding:6px 0 4px 6px}
/* Modules communs : même vert que les modules propres. */
.cmp td.all{background:var(--green-soft);box-shadow:inset 3px 0 0 var(--green-mid)}
.cmp td.all .mt{color:var(--green)}
/* Toute case de module présent : même vert ; seules les cases « Non inclus » restent grises. */
.cmp tbody td:not(.abs):not(.why){background:var(--green-soft);box-shadow:inset 3px 0 0 var(--green-mid)}
.cmp tbody td:not(.abs):not(.why) .mt{color:var(--green)}
/* Dates, tarifs, positionnement, CPF sous chaque module */
.minfo{display:flex;flex-direction:column;gap:2px;margin-top:6px;padding-top:5px;border-top:1px dashed var(--line);font-size:12px;line-height:1.35;color:var(--muted);text-align:left}
.minfo .ml{display:flex;gap:2px;align-items:flex-start}
.minfo .ic{width:15px;height:15px;margin:1px 4px 0 0;vertical-align:0}
.minfo b{color:var(--fg);font-weight:600}
.minfo .dates{color:var(--fg)}
.minfo .none{font-style:italic}
.minfo .pos,.minfo .pos b{color:var(--orange)}
.minfo a{color:inherit;text-decoration:underline}
.pill.tp{background:var(--green-mid);color:#10260A}
.ccard .minfo{margin-top:3px}
.mextra{grid-column:1/-1;border:1px solid var(--line);border-radius:7px;padding:5px 9px;background:var(--sunk)}
.mextra summary{cursor:pointer;font-size:12.5px;color:var(--blue-ink);font-weight:600}
.mextra .fgrid{margin-top:8px}
.mextra textarea.inp{min-height:70px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ---------- Vues et back office ---------- */
.profgroups{display:flex;flex-direction:column;gap:12px}
.adm-item,.adm-cat,.adm-list>.btn{flex-shrink:0}
.loginbox{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:var(--r);padding:10px 14px;margin-bottom:12px}
.loginbox .field{min-width:220px}
.notice{margin:0 0 10px;padding:8px 12px;border-radius:8px;background:var(--orange-soft);color:var(--fg);font-size:13.5px}
.domsel{font-weight:600;color:var(--blue-ink);border-color:var(--blue)}
.mlink{color:inherit;text-decoration:underline;text-decoration-color:var(--green-mid);text-underline-offset:2px}
.mlink:hover{color:var(--blue-ink)}
.mlink .ic{width:13px;height:13px;margin:0 0 0 3px;vertical-align:-2px;color:var(--orange)}
.compl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 10px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center}
@media (max-width:640px){.compl{grid-template-columns:minmax(0,1fr)}}
.compl h3{margin:0;font-size:11.5px;line-height:1.25;letter-spacing:.06em;text-transform:uppercase;color:var(--orange);display:flex;align-items:center}
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}
.ccard{display:flex;flex-direction:column;gap:1px;border:1px solid var(--line);border-left:3px solid var(--orange);border-radius:7px;padding:4px 9px;font-size:13px;min-width:0;line-height:1.35}
.ccard .cl1{display:flex;flex-wrap:wrap;gap:0 8px;align-items:baseline}
.ccard .cdom{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue-ink)}
.ccard .cmeta{font-size:12px;color:var(--muted)}
.ccard .cmeta .ic{width:13px;height:13px;vertical-align:-2px;margin-right:3px}
.ccard .cwhy{color:var(--fg)}
.cprow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) auto;gap:8px;align-items:center}
@media (max-width:640px){.cprow{grid-template-columns:minmax(0,1fr)}}
.modline{grid-template-columns:110px minmax(0,1fr) auto !important}
.modline .mlien{grid-column:1/-1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:20}
.views{display:flex;gap:4px;background:var(--sunk);border-radius:999px;padding:3px}
.vbtn{font:inherit;font-weight:600;font-size:13.5px;border:none;background:transparent;color:var(--blue-ink);padding:6px 14px;border-radius:999px;cursor:pointer;min-height:34px}
.vbtn[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.topright{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.state{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:24px;color:var(--muted);text-align:center}
.adm-bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:12px}
.adm-bar label{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
select,.inp,textarea.inp{font:inherit;font-size:14px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px}
.inp{width:100%}
textarea.inp{min-height:54px;resize:vertical;line-height:1.4}
.inp:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.subtabs{display:flex;gap:6px}
.stab{font:inherit;font-size:13.5px;font-weight:600;border:1px solid var(--blue);background:var(--surface);color:var(--blue-ink);border-radius:7px;padding:6px 12px;cursor:pointer;min-height:36px}
.stab[aria-pressed="true"]{background:var(--blue);color:var(--on-blue)}
.adm-grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.adm-grid{grid-template-columns:minmax(0,1fr)}}
.adm-list{display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 170px);overflow:auto;padding-right:4px}
.adm-item{font:inherit;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:7px;padding:7px 10px;cursor:pointer;display:flex;flex-direction:column;gap:1px;min-height:40px}
.adm-item small{color:var(--muted);font-size:12px}
.adm-item[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.adm-cat{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--blue-ink);margin:8px 0 2px}
.btn{font:inherit;font-weight:600;font-size:13.5px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 12px;border-radius:7px;cursor:pointer;min-height:36px}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.add{border-color:var(--green-mid);background:var(--green-soft);color:var(--green)}
.btn.danger{color:#B42318;border-color:#E9B1AA}
.btn.small{min-height:30px;padding:3px 9px;font-size:12.5px}
.form{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.form h2{margin:0;font-size:18px}
.fgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 14px}
@media (max-width:640px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
.field.full{grid-column:1/-1}
.fsec{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.fsec h3{margin:0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--orange)}
.fhint{font-size:12.5px;color:var(--muted);margin:-4px 0 0}
.pcrow{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.pchead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pchead .rank{font-family:var(--font-mono);font-size:12px;background:var(--blue);color:var(--on-blue);border-radius:5px;padding:2px 7px}
.pchead select{flex:1 1 240px;min-width:0}
.modrow{display:grid;grid-template-columns:90px minmax(0,1fr);gap:8px;align-items:start}
.modrow .code{justify-self:start;margin-top:8px}
.modline{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:8px;align-items:center}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.msg{font-size:13px;font-weight:600}
.msg.err{color:#B42318}.msg.ok{color:var(--green)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#FDECEA;color:#7A1A12;border-radius:7px;padding:8px 10px;font-size:13.5px}
.ro-note{font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="eyebrow">Aide à l'entretien prospect</div>
      <h1>Quel profil, quelles formations ?</h1>
    </div>
    <div class="topright">
      <button type="button" class="btn small" id="loginBtn" hidden>Connexion</button>
      <div class="views" id="views" hidden>
        <button type="button" class="vbtn" data-view="consult" aria-pressed="true">Consulter</button>
        <button type="button" class="vbtn" data-view="admin" aria-pressed="false">Gestion</button>
      </div>
    </div>
  </header>

  <form class="loginbox" id="loginForm" hidden>
    <label class="field" for="lEmail">E-mail<input class="inp" id="lEmail" type="email" autocomplete="username" required></label>
    <label class="field" for="lPass">Mot de passe<input class="inp" id="lPass" type="password" autocomplete="current-password" required></label>

<script>
/* =====================================================================

   partagée de l'application. Ils se modifient dans l'onglet « Gestion ».
   Collections : domaines, formations (= parcours), profils.

const ICONS = {
  why: '<path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/>',

  commun: '<path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>',

  rs: '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/>',
  ext: '<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
  cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  pos: '<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3h6v1M9 12l2 2 4-4"/>',
  domaine: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>'
};
const ic = n => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ICONS.domaine}</svg>`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const slug = s => norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60) || "x";
const byOrdre = (a,b) => (a.ordre ?? 1e9) - (b.ordre ?? 1e9) || String(a.nom||"").localeCompare(String(b.nom||""), "fr");
const $ = id => document.getElementById(id);

/* ---------- Dates (texte), tarifs, positionnement, CPF ---------- */
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
/* sessions à venir : on masque automatiquement celles dont le dernier jour est passé */
const aVenir = m => (Array.isArray(m && m.sessions) ? m.sessions : []).filter(x => x && x.texte && (!x.fin || x.fin >= today()))
  .sort((a,b) => String(a.debut || a.fin || "").localeCompare(String(b.debut || b.fin || "")));
const eur = n => (n === "" || n == null || isNaN(Number(n))) ? "" : Number(n).toLocaleString("fr-FR") + " €";
function infoHtml(m, opts){
  if(!m) return "";
  const o = opts || {}, out = [], s = aVenir(m), has = Array.isArray(m.sessions) && m.sessions.length;
  if(has) out.push(`<span class="ml">${ic("cal")}<span>${s.length ? `<b>Prochaines dates :</b> <span class="dates">${s.slice(0, o.max || 99).map(x => esc(x.texte)).join(" · ")}${o.max && s.length > o.max ? " …" : ""}</span>` : `<span class="none">Aucune date à venir</span>`}</span></span>`);
  if(m.tarif) out.push(`<span class="ml">${ic("euro")}<span><b>${eur(m.tarif)}</b>${m.tarifParcours ? ` · ${eur(m.tarifParcours)} dans un parcours de 3 jours et plus` : ""}</span></span>`);
  if(m.positionnement || m.positionnementLien){
    const u = safeUrl(m.positionnementLien), n = esc(m.positionnement || "Questionnaire de positionnement");
    out.push(`<span class="ml pos">${ic("pos")}<span><b>Prérequis :</b> ${u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${n}</a>` : n}</span></span>`);
  }
  if(m.cpf) out.push(`<span class="ml">${ic("certif")}<span><b>CPF :</b> ${esc(m.cpf)}</span></span>`);
  return out.length ? `<span class="minfo">${out.join("")}</span>` : "";
}
/* Lit une session écrite en texte (ex. « 18-19 et 25-26 janvier 2027 ») pour retrouver son premier et son dernier jour. */
const MOISN = {jan:1,janv:1,janvier:1,fev:2,fevr:2,fevrier:2,mar:3,mars:3,avr:4,avril:4,mai:5,juin:6,juil:7,juillet:7,aout:8,sep:9,sept:9,septembre:9,oct:10,octobre:10,nov:11,novembre:11,dec:12,decembre:12};
function lireSession(t){
  const s = norm(t).replace(/(\d+)\s*(?:er)?\s*au\s*(\d+)/g, (x, a, b) => { const r = []; for(let i = +a; i <= +b && r.length < 31; i++) r.push(i); return r.join(" "); });
  let an = null, pend = [], jours = [];
  (s.match(/\d+|[a-z]+/g) || []).forEach(k => {
    if(/^\d{4}$/.test(k)) an = +k;
    else if(/^\d{1,2}$/.test(k)) pend.push(+k);
    else if(MOISN[k]){ pend.forEach(j => jours.push([MOISN[k], j])); pend = []; }
  });
  if(!jours.length || !an || jours.some(([m, j]) => j < 1 || j > 31)) return null;
  const iso = ([m, j]) => an + "-" + String(m).padStart(2,"0") + "-" + String(j).padStart(2,"0");
  return { texte: String(t).trim(), debut: iso(jours[0]), fin: iso(jours[jours.length - 1]) };
}
const INFO_KEYS = ["sessions", "tarif", "tarifParcours", "positionnement", "positionnementLien", "cpf"];

/* ---------- Données ---------- */
let db = null, user = null, canAdmin = false;
const RAW = { domaines: null, formations: null, profils: null };
let DOMAINES = [];

function buildModel(){
  DOMAINES = (RAW.domaines || []).slice().sort(byOrdre).map(d => ({
    id: d.id, nom: d.nom || d.id, financement: d.financement || "", certification: d.certification || "",
    ordreModules: Array.isArray(d.ordreModules) ? d.ordreModules : [],
    formations: (RAW.formations || []).filter(f => f.domaine === d.id).sort(byOrdre).map(f => ({
      id: f.id, nom: f.nom || f.id, intitule: f.intitule || "", duree: f.duree || "", certification: f.certification || "",
      modules: Object.fromEntries((Array.isArray(f.modules) ? f.modules : []).map(m => [m.code, m.titre])),
      infos: Object.fromEntries((Array.isArray(f.modules) ? f.modules : []).map(m => [m.code, m])),
      prix: prixParcours(f),
      liens: Object.fromEntries((Array.isArray(f.modules) ? f.modules : []).filter(m => m.lien).map(m => [m.code, m.lien])) })),
    profils: (RAW.profils || []).filter(p => p.domaine === d.id).sort(byOrdre).map(p => ({
      id: p.id, categorie: p.categorie || "Autres profils", nom: p.nom || "", besoin: p.besoin || "", reponses: p.reponses || {},
      parcours: Object.fromEntries((Array.isArray(p.parcours) ? p.parcours : []).map(x => [x.formation, { pourquoi: x.pourquoi || "", reponses: x.reponses || {} }])),
      complements: (Array.isArray(p.complements) ? p.complements : []).filter(c => c && c.formation) }))
  }));
  /* lignes de modules : ordre du domaine, puis modules non listés */
  DOMAINES.forEach(d => d.formations.forEach(f => Object.keys(f.modules).forEach(m => { if(!d.ordreModules.includes(m)) d.ordreModules = d.ordreModules.concat(m); })));
}
/* Tarif préférentiel d'un parcours de 3 jours et plus : somme des tarifs « parcours » de ses modules */
function prixParcours(f){
  const mods = Array.isArray(f.modules) ? f.modules : [];
  if(mods.length < 2 || (parseInt(f.duree, 10) || 0) < 3 || !mods.every(m => Number(m.tarifParcours) > 0)) return null;
  return { parcours: mods.reduce((t, m) => t + Number(m.tarifParcours), 0), separe: mods.every(m => Number(m.tarif) > 0) ? mods.reduce((t, m) => t + Number(m.tarif), 0) : null };
}
const ready = () => RAW.domaines && RAW.formations && RAW.profils;

/* ---------- Consultation ---------- */
let state = { dom: "rs", pid: "rs-006", q: "", view: "consult" };
try{ Object.assign(state, JSON.parse(localStorage.getItem("assistant-profils-v4") || "{}")); }catch(e){}
state.view = "consult";
const save = () => { try{ localStorage.setItem("assistant-profils-v4", JSON.stringify({dom:state.dom,pid:state.pid})); }catch(e){} };
const dom = () => DOMAINES.find(d => d.id === state.dom) || DOMAINES[0];

function renderDomains(){
  $("domSel").innerHTML = DOMAINES.map(d => `<option value="${esc(d.id)}"${state.dom===d.id?" selected":""}>${esc(d.nom)}</option>`).join("");
}

const ouvertes = new Set();
function renderList(){
  const d = dom(); if(!d){ $("groups").innerHTML = ""; return; }
  const q = norm(state.q.trim()), cats = [];
  d.profils.forEach(p => {
    const hay = norm(p.nom + " " + p.besoin + " " + p.categorie + " " + Object.keys(p.parcours).map(id => (d.formations.find(f => f.id === id)||{}).nom).join(" "));
    if(q && !hay.includes(q)) return;
    let c = cats.find(x => x.nom === p.categorie); if(!c){ c = {nom:p.categorie, items:[]}; cats.push(c); }
    c.items.push(p);
  });
  const sel = d.profils.find(p => p.id === state.pid);
  $("groups").innerHTML = cats.length ? cats.map(c => {
    const open = q || ouvertes.has(d.id + "|" + c.nom); /* fermées par défaut ; ouvertes pendant une recherche */
    return `<details class="group" data-cat="${esc(c.nom)}"${open?" open":""}><summary><span class="sum">${esc(c.nom)}</span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary><div class="profiles">${c.items.map(p => {
      const n = Object.keys(p.parcours).length;
      return `<button type="button" class="prof" data-pid="${esc(p.id)}" aria-pressed="${state.pid===p.id}"><span>${esc(p.nom)}</span><span class="count" title="${n} parcours possible${n>1?"s":""}">${n}</span></button>`;
    }).join("")}</div></details>`;
  }).join("") : `<p class="none">${d.profils.length ? `Aucun profil ne correspond à « ${esc(state.q)} ».` : "Aucun profil dans ce domaine pour l'instant."}</p>`;
}

function renderDetail(){
  const el = $("detail");
  if(!db){ el.innerHTML = `<div class="state">Les données ne sont pas disponibles dans cet affichage. Ouvrez l'application depuis son lien Claude, en étant connecté(e).</div>`; return; }
  if(!ready()){ el.innerHTML = `<div class="state">Chargement des profils…</div>`; return; }
  const d = dom();
  if(!d){ el.innerHTML = `<div class="state">Aucun domaine pour l'instant.${canAdmin?" Créez-en un dans l'onglet Gestion.":""}</div>`; return; }
  const p = d.profils.find(x => x.id === state.pid);
  if(!p){ el.innerHTML = `<div class="state">Choisissez un profil dans la liste.</div>`; return; }
  const cols = Object.keys(p.parcours).map(id => d.formations.find(f => f.id === id)).filter(Boolean);
  if(!cols.length){ el.innerHTML = `<div class="state">Ce profil n'est relié à aucun parcours.</div>`; return; }
  const rows = d.ordreModules.filter(m => cols.some(f => f.modules[m]));
  const commun = m => cols.every(f => f.modules[m]);
  const txtOf = (f, m) => ((p.parcours[f.id].reponses||{})[m]) || (p.reponses||{})[m] || "";
  const titre = (f, m, pre) => { const t = (pre||"") + esc(f.modules[m]); const u = safeUrl((f.liens||{})[m]); return u ? `<a class="mlink" href="${esc(u)}" target="_blank" rel="noopener" title="${esc(f.modules[m])} (ouvrir la fiche)">${t}${ic("ext")}</a>` : `<span title="${esc(f.modules[m])}">${t}</span>`; };
  const cell = (f, m) => {
    if(!f.modules[m]) return `<td class="abs">${ic("moins")}Non inclus</td>`;
    const spec = cols.length > 1 && !commun(m);
    return `<td${spec?' class="spec"':""}><span class="mt">${titre(f, m, spec?ic("plus"):"")}</span>${esc(txtOf(f, m))}${infoHtml(f.infos[m])}</td>`;
  };
  el.innerHTML = `
    <div class="head">
      <div class="who"><div class="lab">${ic("profil")}Profil</div><div class="name">${esc(p.nom)}</div><div class="need">${ic("besoin")}<span><span class="nlab">Besoin :</span> ${esc(p.besoin)}</span></div></div>
      <dl class="facts">
        ${d.financement?`<div><dt>${ic("euro")}Financement</dt><dd>${esc(d.financement)}</dd></div>`:""}
        ${d.certification?`<div><dt>${ic("certif")}Certification</dt><dd>${esc(d.certification)}</dd></div>`:""}
      </dl>
    </div>
    <div class="tablebox">
      <table class="cmp" style="min-width:${92 + cols.length*200}px">
        <colgroup><col class="rowh">${cols.map(() => `<col>`).join("")}</colgroup>
        <thead><tr><th scope="col" class="cnt"><span class="num">${cols.length}</span><span class="cl">${cols.every(f => Object.keys(f.modules).length < 2) ? "formation" : "parcours"} possible${cols.length>1?"s":""}</span></th>${cols.map((f,i) =>
          `<th scope="col" title="${esc(f.intitule)}"><span class="pname">${esc(f.nom)}</span>${cols.length<4?`<span class="pint">${esc(f.intitule)}</span>`:""}<span class="tags">${i===0 && cols.length>1?`<span class="pill best">${ic("star")}Le plus adapté</span>`:""}${f.duree?`<span class="pill">${ic("duree")}${esc(f.duree)}</span>`:""}${Object.keys(f.modules).length>1?`<span class="pill">${ic("modules")}${Object.keys(f.modules).length} modules</span>`:""}${f.certification?`<span class="pill">${ic("certif")}${esc(f.certification)}</span>`:""}${f.prix?`<span class="pill tp" title="Tarif préférentiel du parcours${f.prix.separe?` (${eur(f.prix.separe)} si les modules sont pris séparément)`:""}">${ic("euro")}${eur(f.prix.parcours)} le parcours</span>`:""}</span></th>`).join("")}</tr></thead>
        <tbody>
          <tr class="whyrow"><th scope="row"><span class="rh">${ic("why")}Pourquoi</span></th>${cols.map(f => `<td class="why">${esc(p.parcours[f.id].pourquoi)}</td>`).join("")}</tr>
          ${rows.map(m => {
            const txts = cols.map(f => f.modules[m] ? txtOf(f, m) : null);
            const same = cols.length > 1 && commun(m) && txts.every(t => t === txts[0]) && cols.every(f => f.modules[m] === cols[0].modules[m]);
            return `<tr><th scope="row"><span class="code">${esc(m)}</span></th>${same
              ? `<td class="all" colspan="${cols.length}"><span class="mt">${titre(cols[0], m, ic("commun"))} · commun à tous les parcours</span>${esc(txts[0])}${infoHtml(cols[0].infos[m])}</td>`
              : cols.map(f => cell(f, m)).join("")}</tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>${complementsHtml(p, d)}`;
}
function complementsHtml(p, d){
  const items = (p.complements || []).map(c => ({ c, f: (RAW.formations || []).find(f => f.id === c.formation) })).filter(x => x.f);
  if(!items.length) return "";
  return `<section class="compl" aria-label="Formations complémentaires"><h3>${ic("plus")}<span>Formations<br>complémentaires</span></h3><div class="ccards">${items.map(({c, f}) => {
    const dom = (RAW.domaines || []).find(x => x.id === f.domaine), m = (Array.isArray(f.modules) ? f.modules : [])[0] || {}, u = safeUrl(m.lien);
    const nom = u ? `<a class="mlink" href="${esc(u)}" target="_blank" rel="noopener">${esc(f.nom)}${ic("ext")}</a>` : esc(f.nom);
    return `<div class="ccard"><span class="cl1"><b>${nom}</b><span class="cmeta">${f.duree?`${ic("duree")}${esc(f.duree)}`:""}${f.certification?` · ${esc(f.certification)}`:""} · ${esc(dom ? dom.nom : "")}</span></span><span class="cwhy">${esc(c.pourquoi || "")}</span>${infoHtml(m, { max: 2 })}</div>`;
  }).join("")}</div></section>`;
}
function safeUrl(u){ try{ const x = new URL(String(u || "")); return /^https?:$/.test(x.protocol) ? x.href : ""; }catch(e){ return ""; } }

function fixSelection(){

$("domSel").addEventListener("change", e => {

});

/* =====================================================================
   GESTION (back office) — réservé aux personnes qui peuvent modifier l'application

const adm = { dom: "", tab: "profils", sel: null, q: "" };

const rawP = id => (RAW.profils || []).find(x => x.id === id);

function renderAdmin(resetForm){
  if(!DOMAINES.some(d => d.id === adm.dom)) adm.dom = DOMAINES[0] ? DOMAINES[0].id : "";
  $("admDom").innerHTML = DOMAINES.map(d => `<option value="${esc(d.id)}"${d.id===adm.dom?" selected":""}>${esc(d.nom)}</option>`).join("");
  document.querySelectorAll(".stab").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.tab === adm.tab)));
  renderAdmList();
  if(resetForm) renderAdmForm();
}

function renderAdmList(){
  const d = admDom(), el = $("admList");
  if(!d){ el.innerHTML = `<p class="none">Aucun domaine. Créez-en un avec « + Nouveau domaine ».</p>`; return; }
  if(adm.tab === "domaine"){ el.innerHTML = `<button type="button" class="adm-item" aria-pressed="true"><b>${esc(d.nom)}</b><small>${d.formations.length} parcours · ${d.profils.length} profils</small></button>`; return; }
  if(adm.tab === "formations"){
    el.innerHTML = `<button type="button" class="btn add" data-new="1">+ Nouvelle formation ou parcours</button>` + d.formations.map(f => {
      const n = d.profils.filter(p => p.parcours[f.id]).length;
      return `<button type="button" class="adm-item" data-sel="${esc(f.id)}" aria-pressed="${adm.sel===f.id}"><b>${esc(f.nom)}</b><small>${esc(f.duree)} · ${Object.keys(f.modules).length} modules · ${n} profils</small></button>`;
    }).join("");
    return;
  }
  let html = `<button type="button" class="btn add" data-new="1">+ Nouveau profil</button>`, last = null;
  d.profils.forEach(p => {
    if(p.categorie !== last){ html += `<div class="adm-cat">${esc(p.categorie)}</div>`; last = p.categorie; }
    html += `<button type="button" class="adm-item" data-sel="${esc(p.id)}" aria-pressed="${adm.sel===p.id}"><b>${esc(p.nom)}</b><small>${Object.keys(p.parcours).length} parcours</small></button>`;
  });
  el.innerHTML = html;
}

$("admDom").addEventListener("change", e => { adm.dom = e.target.value; adm.sel = null; renderAdmin(true); });
$("admTabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if(!b) return; adm.tab = b.dataset.tab; adm.sel = adm.tab === "domaine" ? adm.dom : null; renderAdmin(true); });
$("admNewDom").addEventListener("click", () => { adm.tab = "domaine"; adm.sel = "new"; renderAdmin(false); renderAdmForm(); });
$("admList").addEventListener("click", e => {
  const n = e.target.closest("[data-new]"); if(n){ adm.sel = "new"; renderAdmList(); renderAdmForm(); return; }
  const b = e.target.closest("[data-sel]"); if(!b) return; adm.sel = b.dataset.sel; renderAdmList(); renderAdmForm();
});

const field = (label, html, full) => `<label class="field${full?" full":""}">${label}${html}</label>`;
const inp = (id, val, ph) => `<input class="inp" id="${id}" value="${esc(val)}"${ph?` placeholder="${esc(ph)}"`:""}>`;
const ta = (id, val, ph, cls) => `<textarea class="inp${cls?" "+cls:""}" id="${id}"${ph?` placeholder="${esc(ph)}"`:""}>${esc(val)}</textarea>`;
const formActions = (canDelete) => `<div class="actions"><button type="button" class="btn primary" data-act="save">Enregistrer</button><button type="button" class="btn" data-act="cancel">Annuler</button>${canDelete?`<button type="button" class="btn danger" data-act="del">Supprimer</button>`:""}<span class="msg" id="fmsg" role="status"></span></div><div id="fconfirm"></div>`;
const setMsg = (t, ok) => { const m = $("fmsg"); if(m){ m.textContent = t; m.className = "msg " + (ok ? "ok" : "err"); } };

function renderAdmForm(){
  const el = $("admForm"), d = admDom();
  if(adm.tab === "domaine" || adm.sel === "new" && adm.tab === "domaine"){ return formDomaine(el); }
  if(!d){ el.innerHTML = ""; return; }
  if(!adm.sel){ el.innerHTML = `<div class="state">Choisissez un élément dans la liste, ou créez-en un nouveau.</div>`; return; }
  if(adm.tab === "formations") return formFormation(el, d);
  return formProfil(el, d);
}

/* ----- Formulaire domaine ----- */
function formDomaine(el){
  const isNew = adm.sel === "new", r = isNew ? {} : (rawD(adm.dom) || {});
  el.innerHTML = `<div class="form"><h2>${isNew ? "Nouveau domaine" : "Domaine : " + esc(r.nom || adm.dom)}</h2>
    <div class="fgrid">
      ${field("Nom du domaine *", inp("fNom", r.nom || "", "ex. Bureautique"))}
      ${field("Ordre d'affichage", inp("fOrdre", r.ordre ?? "", "1, 2, 3…"))}
      ${field("Financement", ta("fFin", r.financement || "", "ex. Financement possible à partir de 2 jours de formation."), true)}
      ${field("Certification", ta("fCert", r.certification || "", "ex. RS7643 : épreuve de 90 min à distance."), true)}
      ${field("Ordre des lignes de modules (séparés par des virgules)", inp("fMods", (r.ordreModules || []).join(", "), "ex. M1, M2, M3"), true)}
    </div>
    ${formActions(!isNew)}</div>`;
  el.querySelector(".actions").addEventListener("click", async e => {
    const a = e.target.closest("[data-act]")?.dataset.act; if(!a) return;
    if(a === "cancel"){ if(isNew){ adm.tab = "profils"; adm.sel = null; } renderAdmin(true); return; }
    if(a === "del"){
      const d = admDom();
      if(d && (d.formations.length || d.profils.length)){ setMsg("Supprimez d'abord les formations, parcours et profils de ce domaine."); return; }
      return askConfirm(`Supprimer le domaine « ${r.nom} » ?`, async () => { await db.doc("domaines/" + adm.dom).delete(); adm.dom = ""; adm.tab = "profils"; adm.sel = null; toast("Domaine supprimé"); });
    }
    const nom = $("fNom").value.trim(); if(!nom) return setMsg("Le nom du domaine est obligatoire.");
    const id = isNew ? slug(nom) : adm.dom;
    if(isNew && rawD(id)) return setMsg("Un domaine porte déjà ce nom.");
    const ordre = Number($("fOrdre").value) || (isNew ? (RAW.domaines.length + 1) : (r.ordre ?? 99));
    const data = { nom, financement: $("fFin").value.trim(), certification: $("fCert").value.trim(),
      ordreModules: $("fMods").value.split(",").map(s => s.trim()).filter(Boolean), ordre };
    await write(() => db.doc("domaines/" + id).set(data), "Domaine enregistré", () => { adm.dom = id; adm.sel = id; adm.tab = "domaine"; });
  });
}

/* ----- Formulaire formation ou parcours ----- */
function formFormation(el, d){
  const isNew = adm.sel === "new", r = isNew ? { modules: [] } : (rawF(adm.sel) || { modules: [] });
  const mods = Array.isArray(r.modules) && r.modules.length ? r.modules : [{ code: "Formation", titre: "" }];
  const used = isNew ? [] : d.profils.filter(p => p.parcours[adm.sel]);
  const domCur = r.domaine || d.id;
  const quoi = isNew ? "Nouvelle formation ou parcours" : (mods.length > 1 ? "Parcours : " : "Formation : ") + esc(r.nom);
  el.innerHTML = `<div class="form"><h2>${quoi}</h2>
    <div class="fgrid">
      ${field("Nom de la formation ou du parcours *", inp("fNom", r.nom || "", "ex. Photoshop initiation"))}
      ${field("Domaine de rattachement *", `<select class="inp" id="fDomF">${DOMAINES.map(x => `<option value="${esc(x.id)}"${x.id===domCur?" selected":""}>${esc(x.nom)}</option>`).join("")}</select>`)}
      ${field("Intitulé (sous-titre)", inp("fInt", r.intitule || ""), true)}
      ${field("Durée", inp("fDuree", r.duree || "", "ex. 2 jours"))}
      ${field("Certification (facultatif)", inp("fCertF", r.certification || "", "ex. Tosa, ICDL"))}
      ${field("Référence interne (facultatif)", inp("fRef", r.reference || "", "ex. PAO-1.2 Photo Init"))}
      ${field("Ordre d'affichage", inp("fOrdre", r.ordre ?? ""))}
    </div>
    <div class="fsec"><h3>Modules</h3><p class="fhint">Formation seule : un seul module, avec le code « Formation ». Parcours : un module par code (M1, M2, M2.3…). Ouvrez « Dates, tarifs, positionnement, CPF » sous chaque module pour les compléter. Ces informations sont reportées automatiquement dans les autres parcours qui contiennent le même module (même titre).</p>
      <div id="modLines">${mods.map(modLine).join("")}</div>
      <div><button type="button" class="btn add small" id="addMod">+ Ajouter un module</button></div></div>
    ${!isNew ? `<p class="ro-note">Proposé dans ${used.length} profil${used.length>1?"s":""}.</p>` : ""}
    ${formActions(!isNew)}</div>`;
  $("addMod").onclick = () => $("modLines").insertAdjacentHTML("beforeend", modLine({ code: "", titre: "" }));
  $("modLines").addEventListener("click", e => { if(e.target.closest("[data-rm]")) e.target.closest(".modline").remove(); });
  el.querySelector(".actions").addEventListener("click", async e => {
    const a = e.target.closest("[data-act]")?.dataset.act; if(!a) return;
    if(a === "cancel"){ adm.sel = null; renderAdmin(true); return; }
    if(a === "del") return askConfirm(`Supprimer « ${r.nom} » ?${used.length ? ` Elle sera retirée de ${used.length} profil${used.length>1?"s":""}.` : ""}`, async () => {
      for(const p of used){ const rp = rawP(p.id); await db.doc("profils/" + p.id).update({ parcours: (rp.parcours || []).filter(x => x.formation !== adm.sel) }); }
      for(const rp of (RAW.profils || []).filter(x => (x.complements || []).some(c => c.formation === adm.sel))){ await db.doc("profils/" + rp.id).update({ complements: rp.complements.filter(c => c.formation !== adm.sel) }); }
      await db.doc("formations/" + adm.sel).delete(); adm.sel = null; toast("Supprimé");
    });
    const nom = $("fNom").value.trim(); if(!nom) return setMsg("Le nom est obligatoire.");
    const cible = $("fDomF").value, dc = DOMAINES.find(x => x.id === cible);
    if(!dc) return setMsg("Choisissez le domaine de rattachement.");
    const erreurs = [];
    const modules = [...document.querySelectorAll("#modLines .modline")].map(l => {
      const q = c => l.querySelector(c), m = { code: q(".mc").value.trim(), titre: q(".mtit").value.trim() };
      const u = q(".mlien").value.trim(); if(u) m.lien = u;
      const sessions = q(".mses").value.split("\n").map(t => t.trim()).filter(Boolean).map(t => { const x = lireSession(t); if(!x) erreurs.push(`« ${t} » (${m.code || "module"})`); return x; }).filter(Boolean);
      if(sessions.length) m.sessions = sessions;
      const tarif = Number(q(".mtar").value.replace(/[^\d.,]/g, "").replace(",", ".")), tp = Number(q(".mtp").value.replace(/[^\d.,]/g, "").replace(",", "."));
      if(tarif > 0) m.tarif = tarif;
      if(tp > 0) m.tarifParcours = tp;
      [["positionnement", ".mpos"], ["positionnementLien", ".mposl"], ["cpf", ".mcpf"]].forEach(([k, c]) => { const v = q(c).value.trim(); if(v) m[k] = v; });
      return m;
    }).filter(m => m.code);
    if(erreurs.length) return setMsg("Date illisible : " + erreurs.slice(0, 2).join(" ; ") + ". Écrivez le jour, le mois et l'année, ex. « 18-19 et 25-26 janvier 2027 ».");
    if(!modules.length) return setMsg("Ajoutez au moins un module.");
    if(new Set(modules.map(m => m.code)).size !== modules.length) return setMsg("Deux modules ont le même code.");
    const bad = modules.find(m => m.tarif && m.tarifParcours && m.tarifParcours >= m.tarif);
    if(bad) return setMsg(`Module ${bad.code} : le tarif parcours doit être inférieur au tarif normal.`);
    const id = isNew ? cible + "-" + slug(nom) : adm.sel;
    if(isNew && rawF(id)) return setMsg("Une formation porte déjà ce nom dans ce domaine.");
    const change = !isNew && cible !== (r.domaine || d.id);
    const data = { domaine: cible, nom, intitule: $("fInt").value.trim(), duree: $("fDuree").value.trim(), certification: $("fCertF").value.trim(), modules,
      ordre: Number($("fOrdre").value) || (isNew || change ? dc.formations.length + 1 : (r.ordre ?? 99)) };
    const ref = $("fRef").value.trim(); if(ref) data.reference = ref;
    let reportes = 0, ok = false;
    await write(async () => {
      await db.doc("formations/" + id).set(data);
      const rd = rawD(cible), om = (rd && rd.ordreModules) || [], add = modules.map(m => m.code).filter(c => !om.includes(c));
      if(add.length) await db.doc("domaines/" + cible).update({ ordreModules: om.concat(add) });
      /* changement de domaine : un parcours de profil doit rester dans le domaine du profil */
      if(change) for(const p of used){ const rp = rawP(p.id); await db.doc("profils/" + p.id).update({ parcours: (rp.parcours || []).filter(x => x.formation !== id) }); }
      /* report des dates, tarifs, positionnement et CPF dans les autres parcours contenant le même module */
      for(const o of (RAW.formations || []).filter(x => x.id !== id && Array.isArray(x.modules))){
        let touche = false;
        const mm = o.modules.map(om => {
          const src = modules.find(m => m.titre && norm(m.titre) === norm(om.titre || ""));
          if(!src) return om;
          const n = Object.assign({}, om); INFO_KEYS.forEach(k => { if(src[k] !== undefined) n[k] = src[k]; else delete n[k]; });
          if(JSON.stringify(n) !== JSON.stringify(om)){ touche = true; return n; }
          return om;
        });
        if(touche){ await db.doc("formations/" + o.id).update({ modules: mm }); reportes++; }
      }
    }, "Enregistré", () => { ok = true; adm.sel = id; if(change){ adm.dom = cible; } });
    if(ok && reportes) toast(`Enregistré · reporté dans ${reportes} autre${reportes>1?"s":""} parcours`);
    if(ok && change && used.length) toast(`Enregistré · retiré de ${used.length} profil${used.length>1?"s":""} de l'ancien domaine`);
  });
}
const modLine = m => `<div class="modline"><input class="inp mc" value="${esc(m.code)}" placeholder="Code" aria-label="Code du module"><input class="inp mtit" value="${esc(m.titre)}" placeholder="Titre du module" aria-label="Titre du module"><button type="button" class="btn small danger" data-rm="1">Retirer</button><input class="inp mlien" value="${esc(m.lien || "")}" placeholder="Lien vers la fiche (https://…)" aria-label="Lien vers la fiche du module">
  <details class="mextra"><summary>Dates, tarifs, positionnement, CPF${(m.sessions||[]).length ? ` · ${aVenir(m).length} date${aVenir(m).length>1?"s":""} à venir` : ""}</summary><div class="fgrid">
    ${field("Dates (une session par ligne, avec l'année)", `<textarea class="inp mses" placeholder="ex. 18-19 et 25-26 janvier 2027&#10;15 avril 2027">${esc((m.sessions || []).map(x => x.texte).join("\n"))}</textarea>`, true)}
    ${field("Tarif (€)", `<input class="inp mtar" inputmode="decimal" value="${esc(m.tarif ?? "")}" placeholder="ex. 780">`)}
    ${field("Tarif préférentiel en parcours de 3 jours et plus (€)", `<input class="inp mtp" inputmode="decimal" value="${esc(m.tarifParcours ?? "")}" placeholder="ex. 700">`)}
    ${field("Positionnement prérequis (nom du questionnaire)", `<input class="inp mpos" value="${esc(m.positionnement || "")}" placeholder="Laisser vide si aucun">`)}
    ${field("Lien du questionnaire de positionnement", `<input class="inp mposl" value="${esc(m.positionnementLien || "")}" placeholder="https://forms…">`)}
    ${field("Éligibilité CPF", `<input class="inp mcpf" value="${esc(m.cpf || "")}" placeholder="ex. Oui (certification Tosa) ; Non ; Oui, dans un parcours de 4 jours minimum">`, true)}
  </div></details></div>`;

/* ----- Formulaire profil ----- */
function formProfil(el, d){
  const isNew = adm.sel === "new";
  const r = isNew ? { categorie: "", nom: "", besoin: "", reponses: {}, parcours: [] } : (rawP(adm.sel) || {});
  const cats = [...new Set(d.profils.map(p => p.categorie))];
  const pc = Array.isArray(r.parcours) ? r.parcours : [];
  el.innerHTML = `<div class="form"><h2>${isNew ? "Nouveau profil" : "Profil : " + esc(r.nom)}</h2>
    <div class="fgrid">
      ${field("Nom du profil *", inp("fNom", r.nom || "", "ex. Fleuriste"))}
      ${field("Catégorie *", inp("fCat", r.categorie || "", "Choisir ou saisir une catégorie").replace("<input", '<input list="catList"') + `<datalist id="catList">${cats.map(c => `<option value="${esc(c)}">`).join("")}</datalist>`)}
      ${field("Besoin", ta("fBesoin", r.besoin || ""), true)}
      ${field("Ordre d'affichage", inp("fOrdre", r.ordre ?? ""))}
    </div>
    <div class="fsec"><h3>Arguments communs à tous ses parcours</h3>
      <p class="fhint">Utilisés dans chaque parcours qui contient le module, sauf si un argument propre est saisi plus bas. Laissez vide si l'argument change selon le parcours.</p>
      ${d.ordreModules.map(m => `<div class="modrow"><span class="code">${esc(m)}</span><textarea class="inp com" data-m="${esc(m)}" aria-label="Argument commun ${esc(m)}">${esc((r.reponses||{})[m] || "")}</textarea></div>`).join("")}
    </div>
    <div class="fsec"><h3>Parcours possibles</h3>
      <p class="fhint">Du plus adapté au moins adapté. Pour chaque parcours : pourquoi le proposer, et l'argument des modules propres.</p>
      <div id="pcRows">${pc.map((x,i) => pcRow(d, x, i)).join("")}</div>
      <div><button type="button" class="btn add small" id="addPc">+ Ajouter un parcours</button></div>
    </div>
    <div class="fsec"><h3>Formations complémentaires</h3>
      <p class="fhint">Formations d'autres domaines à suggérer en plus, avec une phrase pour dire pourquoi.</p>
      <div id="cpRows">${(Array.isArray(r.complements) ? r.complements : []).map(c => cpRow(d, c)).join("")}</div>
      <div><button type="button" class="btn add small" id="addCp">+ Ajouter une formation complémentaire</button></div>
    </div>
    ${formActions(!isNew)}</div>`;
  $("addCp").onclick = () => $("cpRows").insertAdjacentHTML("beforeend", cpRow(d, { formation: "", pourquoi: "" }));
  $("cpRows").addEventListener("click", e => { if(e.target.closest("[data-rm]")) e.target.closest(".cprow").remove(); });
  const renum = () => [...document.querySelectorAll("#pcRows .pcrow")].forEach((row, i) => row.querySelector(".rank").textContent = "#" + (i + 1));
  $("addPc").onclick = () => { const free = d.formations.find(f => ![...document.querySelectorAll("#pcRows select")].some(s => s.value === f.id)); $("pcRows").insertAdjacentHTML("beforeend", pcRow(d, { formation: free ? free.id : (d.formations[0]||{}).id, pourquoi: "", reponses: {} }, 0)); renum(); };
  $("pcRows").addEventListener("click", e => {
    const row = e.target.closest(".pcrow"); if(!row) return;
    if(e.target.closest("[data-rm]")){ row.remove(); renum(); }
    if(e.target.closest("[data-up]") && row.previousElementSibling){ row.parentNode.insertBefore(row, row.previousElementSibling); renum(); }
    if(e.target.closest("[data-down]") && row.nextElementSibling){ row.parentNode.insertBefore(row.nextElementSibling, row); renum(); }
  });
  $("pcRows").addEventListener("change", e => {
    if(!e.target.matches("select.pcf")) return;
    const row = e.target.closest(".pcrow"), kept = readRow(row);
    row.outerHTML = pcRow(d, { formation: e.target.value, pourquoi: kept.pourquoi, reponses: kept.reponses }, 0); renum();
  });
  el.querySelector(".actions").addEventListener("click", async e => {
    const a = e.target.closest("[data-act]")?.dataset.act; if(!a) return;
    if(a === "cancel"){ adm.sel = null; renderAdmin(true); return; }
    if(a === "del") return askConfirm(`Supprimer le profil « ${r.nom} » ?`, async () => { await db.doc("profils/" + adm.sel).delete(); adm.sel = null; toast("Profil supprimé"); });
    const nom = $("fNom").value.trim(), categorie = $("fCat").value.trim();
    if(!nom || !categorie) return setMsg("Le nom et la catégorie sont obligatoires.");
    const reponses = {};
    document.querySelectorAll("textarea.com").forEach(t => { if(t.value.trim()) reponses[t.dataset.m] = t.value.trim(); });
    const parcours = [...document.querySelectorAll("#pcRows .pcrow")].map(readRow);
    if(!parcours.length) return setMsg("Ajoutez au moins un parcours.");
    if(new Set(parcours.map(x => x.formation)).size !== parcours.length) return setMsg("Le même parcours apparaît deux fois.");
    const manque = [];
    parcours.forEach(x => { const f = d.formations.find(f => f.id === x.formation); if(!f) return;
      if(!x.pourquoi) manque.push(`« Pourquoi » pour ${f.nom}`);
      Object.keys(f.modules).forEach(m => { if(!x.reponses[m] && !reponses[m]) manque.push(`${m} pour ${f.nom}`); }); });
    if(manque.length) return setMsg("À compléter : " + manque.slice(0, 4).join(" ; ") + (manque.length > 4 ? "…" : ""));
    const complements = [...document.querySelectorAll("#cpRows .cprow")].map(row => ({ formation: row.querySelector("select").value, pourquoi: row.querySelector("input").value.trim() })).filter(c => c.formation);
    const id = isNew ? d.id + "-" + slug(nom) : adm.sel;
    if(isNew && rawP(id)) return setMsg("Un profil porte déjà ce nom dans ce domaine.");
    const maxOrdre = Math.max(0, ...d.profils.map(p => (rawP(p.id) || {}).ordre || 0));
    const data = { domaine: d.id, categorie, nom, besoin: $("fBesoin").value.trim(), reponses, parcours, complements,
      ordre: Number($("fOrdre").value) || (isNew ? maxOrdre + 1 : (r.ordre ?? 99)) };
    await write(() => db.doc("profils/" + id).set(data), "Profil enregistré", () => { adm.sel = id; });
  });
}
function pcRow(d, x, i){
  const f = d.formations.find(f => f.id === x.formation);
  return `<div class="pcrow"><div class="pchead"><span class="rank">#${i+1}</span>
      <select class="pcf" aria-label="Parcours">${d.formations.map(o => `<option value="${esc(o.id)}"${o.id===x.formation?" selected":""}>${esc(o.nom)}</option>`).join("")}</select>
      <button type="button" class="btn small" data-up="1">Monter</button><button type="button" class="btn small" data-down="1">Descendre</button><button type="button" class="btn small danger" data-rm="1">Retirer</button></div>
    <div class="modrow"><span class="rh" style="color:var(--orange);font-size:12px;font-weight:700;margin-top:6px">Pourquoi</span><input class="inp pcw" value="${esc(x.pourquoi || "")}" placeholder="ex. Si sa clientèle est locale."></div>
    ${f ? Object.keys(f.modules).map(m => `<div class="modrow"><span class="code">${esc(m)}</span><textarea class="inp pcm" data-m="${esc(m)}" placeholder="Laisser vide pour utiliser l'argument commun">${esc((x.reponses||{})[m] || "")}</textarea></div>`).join("") : ""}
  </div>`;
}
function cpRow(d, c){
  const autres = DOMAINES.filter(x => x.id !== d.id);
  return `<div class="cprow"><select aria-label="Formation complémentaire"><option value="">Choisir une formation…</option>${autres.map(x => `<optgroup label="${esc(x.nom)}">${x.formations.map(f => `<option value="${esc(f.id)}"${f.id===c.formation?" selected":""}>${esc(f.nom)}</option>`).join("")}</optgroup>`).join("")}</select><input class="inp" value="${esc(c.pourquoi || "")}" placeholder="Pourquoi la proposer" aria-label="Pourquoi la proposer"><button type="button" class="btn small danger" data-rm="1">Retirer</button></div>`;
}
function readRow(row){
  const reponses = {};
  row.querySelectorAll("textarea.pcm").forEach(t => { if(t.value.trim()) reponses[t.dataset.m] = t.value.trim(); });
  return { formation: row.querySelector("select.pcf").value, pourquoi: row.querySelector(".pcw").value.trim(), reponses };
}

function askConfirm(text, run){
  $("fconfirm").innerHTML = `<div class="confirm"><span>${esc(text)}</span><button type="button" class="btn danger" id="cYes">Confirmer la suppression</button><button type="button" class="btn" id="cNo">Annuler</button></div>`;
  $("cNo").onclick = () => $("fconfirm").innerHTML = "";
  $("cYes").onclick = () => write(run, null, () => {}).then(() => renderAdmin(true));
}
async function write(fn, okText, after){
  const btns = document.querySelectorAll("#admForm button"); btns.forEach(b => b.disabled = true);
  try{ await fn(); if(after) after(); if(okText){ toast(okText); renderAdmin(true); setMsg(okText, true); } }
  catch(err){
    btns.forEach(b => b.disabled = false);
    const c = err && err.code;
    setMsg(c === "invalid_argument" ? "Enregistrement refusé : vous n'avez pas les droits de modification." :
           c === "quota_exceeded" ? "La base est pleine : supprimez des éléments inutiles." :
           "Enregistrement impossible pour le moment. Réessayez dans un instant.");
  }
}

/* ---------- Démarrage ---------- */
function onData(){
  if(!ready()) return;
  buildModel();
  if(state.view === "consult") renderConsult(); else { renderAdmin(false); }
}
function useStatic(){ /* contenu lu dans contenu.js, pas de back office */
  canAdmin = false; $("views").hidden = true; $("admin").hidden = true;
  db = "statique"; RAW.domaines = CONTENU.domaines || []; RAW.formations = CONTENU.formations || []; RAW.profils = CONTENU.profils || []; onData();
}

/* ---------- Supabase : lecture publique, écriture pour les éditeurs connectés ---------- */
let SB = null;
async function bootSupabase(cfg){
  if(!window.supabase || !window.supabase.createClient) throw new Error("bibliothèque Supabase indisponible");
  SB = window.supabase.createClient(cfg.url, cfg.key);
  const load = async c => {
    const { data, error } = await SB.from(c).select("id,data").limit(5000);
    if(error) throw error;
    RAW[c] = (data || []).map(r => Object.assign({ id: r.id }, r.data || {}));
  };
  await Promise.all(["domaines", "formations", "profils"].map(load));
  const reload = async c => { await load(c); onData(); };
  const fail = () => { throw { code: "invalid_argument" }; };
  db = { doc: path => { const [c, id] = path.split("/"); return {
    set: async d => { const { error } = await SB.from(c).upsert({ id, data: d, updated_at: new Date().toISOString() }); if(error) fail(); await reload(c); },
    update: async d => { const cur = (RAW[c] || []).find(x => x.id === id); if(!cur) fail(); const base = Object.assign({}, cur); delete base.id;
      const { error } = await SB.from(c).upsert({ id, data: Object.assign(base, d), updated_at: new Date().toISOString() }); if(error) fail(); await reload(c); },
    delete: async () => { const { error } = await SB.from(c).delete().eq("id", id); if(error) fail(); await reload(c); }
  }; } };
  onData();
  $("loginBtn").hidden = false;
  await refreshAuth();
  SB.auth.onAuthStateChange(() => { setTimeout(refreshAuth, 0); });
}
async function refreshAuth(){
  const { data } = await SB.auth.getSession();
  const session = data && data.session;
  let ok = false;
  if(session){ const r = await SB.from("editeurs").select("email").limit(1); ok = !r.error && r.data && r.data.length > 0; }
  canAdmin = ok;
  $("loginBtn").textContent = session ? "Déconnexion" : "Connexion";
  $("views").hidden = !ok;
  if(session && !ok){ $("notice").textContent = "Ce compte n'a pas le droit de modifier le contenu."; $("notice").hidden = false; }
  else if($("notice").textContent.startsWith("Ce compte")) $("notice").hidden = true;
  if(!ok && state.view === "admin") document.querySelector('.vbtn[data-view="consult"]').click();
}
$("loginBtn").addEventListener("click", async () => {
  if(!SB) return;
  const { data } = await SB.auth.getSession();
  if(data && data.session){ await SB.auth.signOut(); toast("Déconnectée"); return; }
  $("loginForm").hidden = false; $("lEmail").focus();
});
$("lCancel").addEventListener("click", () => { $("loginForm").hidden = true; $("lMsg").textContent = ""; });
$("loginForm").addEventListener("submit", async e => {
  e.preventDefault(); if(!SB) return;
  $("lMsg").textContent = "Connexion…"; $("lMsg").className = "msg";
  const { error } = await SB.auth.signInWithPassword({ email: $("lEmail").value.trim(), password: $("lPass").value });
  if(error){ $("lMsg").textContent = "E-mail ou mot de passe incorrect."; $("lMsg").className = "msg err"; return; }
  $("lPass").value = ""; $("loginForm").hidden = true; $("lMsg").textContent = ""; toast("Connectée");
});

(async () => {
  if(window.SUPABASE_CONFIG){ /* version GitHub reliée à Supabase */
    try{ await bootSupabase(window.SUPABASE_CONFIG); return; }
    catch(e){
      if(window.CONTENU){ $("notice").textContent = "La base en ligne ne répond pas : affichage de la copie de secours du contenu. La gestion est indisponible pour le moment."; $("notice").hidden = false; useStatic(); return; }
      db = null; renderDetail(); return;
    }
  }
  if(window.CONTENU){ useStatic(); return; }
  try{ db = (typeof claude !== "undefined" && claude.use) ? await claude.use("db") : null; }catch(e){ db = null; }
  try{ user = (typeof claude !== "undefined" && claude.use) ? await claude.use("user") : null; }catch(e){ user = null; }
  if(!db){ renderDetail(); return; }
  ["domaines","formations","profils"].forEach(c => {
    db.collection(c).limit(1000).onSnapshot(snap => {
      RAW[c] = snap.docs.filter(x => x.exists).map(x => Object.assign({ id: x.id }, x.data()));
      onData();
    }, () => { if(!RAW[c]) RAW[c] = []; onData(); });
  });
  canAdmin = user ? await user.canEdit() : false;
  $("views").hidden = !canAdmin;
})();
renderDetail();
</script>
