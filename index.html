<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boussole Formations</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Mise en page compacte, pensée pour tenir sur un écran : en-tête sur une ligne ; profils à gauche ; parcours en colonnes à droite.
   Repères : bleu CCI = structure et navigation ; vert clair = ce qui différencie (pourquoi ce parcours, module propre au parcours, le plus adapté). */
:root{
  --bg:#F5F8FB; --surface:#FFFFFF; --sunk:#EDF2F7; --line:#D3DCE6;
  --fg:#14212B; --muted:#516170;
  --blue:#00519E; --blue-ink:#00427F; --blue-soft:#E4EEF8; --on-blue:#FFFFFF;
  --green:#2E6B1E; --green-mid:#7CC04B; --green-soft:#E8F5DF;
  --absent:#F1F3F5;
  --orange:#C2410C; --orange-soft:#FDEBDD;
  --font-body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1620; --surface:#15202B; --sunk:#1B2834; --line:#2C3B4A; --fg:#E3EAF1; --muted:#9DADBD;
  --blue:#2F7BD0; --blue-ink:#8DBDF0; --blue-soft:#17304A; --on-blue:#FFFFFF;
  --green:#A6DB82; --green-mid:#7CC04B; --green-soft:#1E3318; --absent:#1A242E; --orange:#F59E5B; --orange-soft:#3A2414; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1620; --surface:#15202B; --sunk:#1B2834; --line:#2C3B4A; --fg:#E3EAF1; --muted:#9DADBD;
  --blue:#2F7BD0; --blue-ink:#8DBDF0; --blue-soft:#17304A; --on-blue:#FFFFFF;
  --green:#A6DB82; --green-mid:#7CC04B; --green-soft:#1E3318; --absent:#1A242E; --orange:#F59E5B; --orange-soft:#3A2414; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45;margin:0}
.wrap{max-width:1680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 24px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px;padding-bottom:12px;margin-bottom:12px;border-bottom:3px solid var(--blue)}
.brand{display:flex;flex-direction:column;min-width:0}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-ink)}
h1{font-size:22px;line-height:1.2;margin:0;font-weight:700;text-wrap:balance}
.domains{display:flex;flex-wrap:wrap;gap:6px}
.dom{font:inherit;font-weight:600;font-size:14px;border:1px solid var(--blue);background:var(--surface);color:var(--blue-ink);padding:7px 14px;border-radius:999px;cursor:pointer;min-height:38px}
.dom:hover{background:var(--blue-soft)}
.dom[aria-pressed="true"]{background:var(--blue);color:var(--on-blue)}

.grid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);max-height:calc(100vh - 16px - var(--barh,0px));overflow:auto;padding-right:4px}
@media (max-width:900px){.side{position:static;max-height:none;overflow:visible}}
.searchlab{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.search{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.group-old h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-ink);margin:0 0 5px;font-weight:700;padding-left:8px;border-left:3px solid var(--blue)}
.profiles{display:flex;flex-direction:column;gap:4px}
.prof{font:inherit;font-size:13.5px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:7px;padding:7px 10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:40px}
.prof:hover{border-color:var(--blue)}
.prof[aria-pressed="true"]{border-color:var(--blue);background:var(--blue);color:var(--on-blue)}
.prof span{font-weight:500;line-height:1.3}
.count{flex:none;font-family:var(--font-mono);font-size:11.5px;font-weight:500;color:var(--green);background:var(--green-soft);border-radius:999px;padding:0 7px;font-variant-numeric:tabular-nums}
.prof[aria-pressed="true"] .count{background:var(--green-mid);color:#10260A}
button:focus-visible,.search:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.none{color:var(--muted);font-size:14px}

.result{display:flex;flex-direction:column;gap:7px;min-width:0}
.head{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:var(--r);padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 28px;align-items:flex-start}
.head .who{flex:1 1 300px;min-width:0}
.head .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-ink);font-weight:700}
.head .name{font-size:18px;font-weight:700;line-height:1.25;margin:1px 0 2px;text-wrap:balance}
.facts{flex:1 1 300px;display:flex;flex-direction:column;gap:4px;margin:0;min-width:0;font-size:13.5px}
.facts div{display:grid;grid-template-columns:128px minmax(0,1fr);gap:8px}
@media (max-width:480px){.facts div{grid-template-columns:minmax(0,1fr);gap:0}}
.facts dt{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue-ink);padding-top:2px}
.facts dd{margin:0}
.note{font-size:12.5px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px;border:1px solid var(--line)}
.legend .lg-why{background:var(--green-soft);border-color:var(--green-mid)}
.legend .lg-spec{background:var(--green-soft);border-left:3px solid var(--green-mid)}
.legend .lg-com{background:var(--surface)}
.legend .lg-abs{background:var(--absent)}

.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.cmp{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed}
.cmp col.rowh{width:92px}
.cmp th,.cmp td{text-align:left;vertical-align:top;padding:7px 10px;border-bottom:1px solid var(--line);font-size:13.5px}
.cmp tr:last-child th,.cmp tr:last-child td{border-bottom:none}
.cmp td,.cmp thead th + th{border-left:1px solid var(--line)}
.cmp thead th{background:var(--blue);color:var(--on-blue);vertical-align:top}
.cmp thead th:first-child{background:var(--blue-ink)}
.cmp thead .pname{font-size:14.5px;font-weight:700;line-height:1.25;display:block}
.cmp thead .pint{font-size:11.5px;opacity:.85;font-weight:400;display:block;margin-top:2px;line-height:1.35}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.pill{font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;background:rgba(255,255,255,.18);color:var(--on-blue)}
.pill.best{background:var(--green-mid);color:#10260A}
.cmp tbody th{font-weight:600;font-size:12px;color:var(--blue-ink);background:var(--blue-soft);position:sticky;left:0;z-index:1}
.code{font-family:var(--font-mono);font-size:11.5px;color:var(--on-blue);background:var(--blue);border-radius:5px;padding:1px 6px;white-space:nowrap}
.mt{display:block;font-size:11.5px;color:var(--muted);margin-bottom:2px;line-height:1.3}
.cmp td.why{background:var(--green-soft);font-weight:600;color:var(--fg)}
.cmp td.spec{background:var(--green-soft);box-shadow:inset 3px 0 0 var(--green-mid)}
.cmp td.spec .mt{color:var(--green)}
.cmp td.abs{background:var(--absent);color:var(--muted);font-size:12px;padding-block:4px;vertical-align:middle}
.cmp td.all{text-align:center}
.cmp .mt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp td.all .mt{display:block}
.cmp tr.whyrow th{background:var(--green-soft);color:var(--green)}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-5px;margin-right:6px}
.dom .ic{width:22px;height:22px;vertical-align:-6px;margin-right:8px}
.pill .ic{width:15px;height:15px;vertical-align:-3px;margin-right:4px}
.mt .ic{width:18px;height:18px;vertical-align:-5px;margin-right:5px}
.need{display:flex;gap:4px;align-items:flex-start}.need .ic{width:20px;height:20px;margin-top:0;color:var(--blue-ink)}
.facts dt{white-space:nowrap}.facts dt .ic{width:18px;height:18px;vertical-align:-5px}
.rh{display:flex;flex-direction:column;gap:2px;align-items:flex-start}.rh .ic{width:26px;height:26px}
.cmp td.why::before{content:"";}
.cmp td.abs .ic{width:18px;height:18px;vertical-align:-5px}

.lg{display:inline-flex;align-items:center;font-size:12.5px}
.lg.g .ic{color:var(--green)}.lg.b .ic{color:var(--blue-ink)}
.lg .ic{width:24px;height:24px;padding:2px;border-radius:5px}
.lg.g .ic{background:var(--green-soft)}.lg.b .ic{background:var(--blue-soft)}
/* Repère orange : chaque icône et le titre qui l'accompagne. */
.head .lab,.head .lab .ic,.need .ic,.nlab,.facts dt,.facts dt .ic{color:var(--orange)}
.nlab{font-weight:700;font-size:12.5px}
.cmp tr.whyrow th,.cmp tr.whyrow th .ic{color:var(--orange)}
.mt .ic,.cmp td.abs .ic{color:var(--orange)}
.lg,.lg.g .ic,.lg.b .ic,.lg .ic{color:var(--orange)}
.lg.g .ic,.lg.b .ic,.lg .ic{background:var(--orange-soft)}
.lg{font-weight:600}
.cmp thead th.cnt{text-align:center;vertical-align:middle}
.cnt .num{display:block;font-size:34px;font-weight:700;line-height:1;color:var(--green-mid);font-variant-numeric:tabular-nums}
.cnt .cl{display:block;font-size:13px;font-weight:700;line-height:1.2;margin-top:4px}
details.group{border-radius:8px}
details.group summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:var(--blue-soft);color:var(--blue-ink);font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;min-height:40px;border-left:4px solid var(--blue)}
details.group summary::-webkit-details-marker{display:none}
details.group summary:hover{background:var(--line)}
details.group summary:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
details.group .sum{flex:1;min-width:0;line-height:1.3}
.ccount{flex:none;font-family:var(--font-mono);font-size:11.5px;letter-spacing:0;background:var(--surface);color:var(--blue-ink);border-radius:999px;padding:0 7px}
.chev{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
details.group[open] .chev{transform:rotate(180deg)}
details.group .profiles{padding:6px 0 4px 6px}
/* Modules communs : même vert que les modules propres. */
.cmp td.all{background:var(--green-soft);box-shadow:inset 3px 0 0 var(--green-mid)}
.cmp td.all .mt{color:var(--green)}
/* Toute case de module présent : même vert ; seules les cases « Non inclus » restent grises. */
.cmp tbody td:not(.abs):not(.why){background:var(--green-soft);box-shadow:inset 3px 0 0 var(--green-mid)}
.cmp tbody td:not(.abs):not(.why) .mt{color:var(--green)}
/* Dates, tarifs, positionnement, CPF sous chaque module */
.minfo{display:flex;flex-direction:column;gap:2px;margin-top:6px;padding-top:5px;border-top:1px dashed var(--line);font-size:12px;line-height:1.35;color:var(--muted);text-align:left}
.minfo .ml{display:flex;gap:2px;align-items:flex-start}
.minfo .ic{width:15px;height:15px;margin:1px 4px 0 0;vertical-align:0}
.minfo b{color:var(--fg);font-weight:600}
.minfo .dates{color:var(--fg)}
.minfo .none{font-style:italic}
.minfo .pos,.minfo .pos b{color:var(--orange)}
.minfo a{color:inherit;text-decoration:underline}
.pill.tp{background:var(--green-mid);color:#10260A}
.ccard .minfo{margin-top:3px}
.mextra{grid-column:1/-1;border:1px solid var(--line);border-radius:7px;padding:5px 9px;background:var(--sunk)}
.mextra summary{cursor:pointer;font-size:12.5px;color:var(--blue-ink);font-weight:600}
.mextra .fgrid{margin-top:8px}
.qbox{border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:8px}
.qchk{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--fg)}
.qbox{grid-column:1/-1}
.qetat{font-weight:600;color:var(--green-dark,#2e6b3a)}.qetat.qwarn{color:var(--orange)}
.qdrop{display:flex;flex-direction:column;gap:8px;align-items:flex-start;border:2px dashed var(--line);border-radius:10px;padding:14px;background:var(--sunk)}
.qdrop.over{border-color:var(--blue);background:var(--blue-soft)}
.qaide{margin-top:12px;border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px;background:var(--sunk)}.qaide ol{margin:6px 0 0 18px;padding:0}.qaide li{margin:3px 0}
.linkbtn{background:none;border:0;color:var(--blue-ink);text-decoration:underline;padding:0 4px}.qgrid .full{grid-column:1/-1}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.qgrid[hidden]{display:none}.qgrid .fwide{grid-column:1/-1}
.qfile{display:flex;flex-direction:column;gap:6px}.qcur{font-size:13px;display:flex;align-items:center;gap:8px}
.qbtn{display:inline-flex;align-items:center;gap:3px;font:inherit;font-size:12.5px;font-weight:600;color:var(--blue-ink);background:none;border:1px solid var(--line);border-radius:6px;padding:1px 7px;cursor:pointer;text-decoration:none;margin-left:4px}
.qbtn .ic{width:13px;height:13px;margin:0}.qhint{color:var(--muted)}
.mextra textarea.inp{min-height:70px}
/* ===== Front office (trame) : en-tête en 3 zones, colonnes de parcours, modules alignés ===== */
:root{--teal:#3F8F7D;--teal-soft:#E6F3EF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--teal:#6FBFAE;--teal-soft:#16302B}}
:root[data-theme="dark"]{--teal:#6FBFAE;--teal-soft:#16302B}
.fo-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,1fr);gap:10px}
.fo-head.nofacts{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}
.fo-box{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1.5px solid var(--orange);border-radius:14px;padding:10px 14px;min-width:0;line-height:1.4}
.fo-box > span:last-child{min-width:0}
.fo-hic{flex:none;padding-right:10px;border-right:1.5px solid var(--orange);color:var(--orange);align-self:stretch;display:flex;align-items:center}
.fo-hic .ic{width:24px;height:24px;margin:0}
.fo-lab{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--orange)}
.fo-name{display:block;font-size:17px;line-height:1.25;text-wrap:balance}
.fo-edit{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font:inherit;font-size:12px;font-weight:600;color:var(--blue-ink);background:none;border:1px solid var(--line);border-radius:6px;padding:2px 8px;cursor:pointer}
.fo-edit .ic{width:13px;height:13px}
.fo-edit:hover{border-color:var(--blue-ink)}
.fo-box small{display:block;color:var(--muted);font-size:12px}
.fo-facts{flex-direction:column;gap:6px;font-size:13px}
.fo-fl{display:flex;gap:8px;align-items:flex-start}.fo-fl .ic{color:var(--orange);margin:2px 0 0}
.fo-count{flex-wrap:wrap;margin:14px 0 8px;font-size:15px;font-weight:700;color:var(--blue-ink);display:flex;align-items:baseline;gap:6px}
.fo-count .num{font-size:26px;line-height:1;color:var(--green-mid);background:var(--blue);border-radius:8px;padding:2px 10px}
.fo-count small{font-weight:500;color:var(--muted);font-size:13px}
.fo-grid{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:14px 12px;align-items:stretch}
.fo-card{position:relative;border-radius:14px;min-width:0}
/* pointillés reliant les zones d'un même parcours */
.fo-card:not(.fo-parc)::before{content:"";position:absolute;left:50%;top:-14px;height:14px;border-left:2px dashed var(--blue);opacity:.55}
.fo-parc{background:var(--blue);color:var(--on-blue);padding:12px 14px;display:flex;flex-direction:column;gap:8px;justify-content:space-between}
.fo-parc h3{margin:0;font-size:16px;line-height:1.25}
.fo-parc p{margin:3px 0 0;font-size:12.5px;opacity:.9;line-height:1.35}
.fo-best{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;background:var(--green-mid);color:#10260A;border-radius:999px;padding:1px 9px;margin-bottom:5px}
.fo-best .ic{width:14px;height:14px;margin-right:4px}
.fo-tags{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:12px;font-weight:600}
.fo-tags .ic{width:15px;height:15px;vertical-align:-3px;margin-right:4px}
.fo-tarifs{align-self:flex-end;background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 14px;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 6px;font-size:12px}
.fo-tarifs b{font-size:15px;color:var(--blue-ink)}
.fo-tarifs small{color:var(--muted)}
.fo-cpf{flex-basis:100%;text-align:right;font-weight:700;color:var(--green)}
.fo-why{background:var(--blue-soft);border:1.5px solid var(--blue);display:flex;gap:10px;padding:10px 14px;font-weight:600}
.fo-why .fo-ic{flex:none;color:var(--orange);padding-right:10px;border-right:1.5px solid var(--blue);display:flex;align-items:center}
.fo-why .fo-ic .ic{margin:0}
.fo-why .fo-lab{color:var(--blue-ink)}
.ff-res{margin-bottom:6px}.ff-item .ic{width:16px;height:16px;color:var(--blue);vertical-align:-3px}
.prof[aria-pressed="true"] .pdom{color:rgba(255,255,255,.85)}.ff-item[aria-pressed="true"] .ic{color:#fff}
.ff{display:flex;flex-direction:column;gap:12px}.ff-top{display:flex}
.ff-mods{display:flex;flex-direction:column;gap:8px}
.ff-mod{display:flex;gap:0;border:1.5px solid var(--green-mid,#5aa86a);border-radius:12px;overflow:hidden;background:var(--surface)}
.ff-mod .code{flex:none;width:64px;display:flex;align-items:center;justify-content:center;background:var(--green-mid,#5aa86a);color:#fff;font-weight:700;font-size:13px}
.ff-mbody{flex:1;min-width:0;padding:8px 12px;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.ff-who{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface)}.ff-who h3{margin:0 0 6px;font-size:15px;color:var(--blue-ink)}
.ff-sub{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:8px 0 4px}
.ff-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px}
.fo-more{margin-top:4px;font-weight:400}
.fo-more summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--blue-ink);list-style:none;display:inline-flex;align-items:center;gap:3px}
.fo-more summary::-webkit-details-marker{display:none}
.fo-more summary::after{content:"▾";font-size:11px}.fo-more[open] summary::after{content:"▴"}
.fo-sda{display:flex;flex-direction:column;gap:3px;margin-top:4px;font-size:13px;line-height:1.4}
.fo-sda b{color:var(--orange)}
.fo-moretxt{display:block;margin-top:4px;line-height:1.45}
.fo-parc .fo-more summary{color:#fff;opacity:.9}
.fo-mod{display:grid;grid-template-columns:76px minmax(0,1fr);border:1.5px solid var(--teal);background:var(--surface)}
.fo-mod > .fo-tab{border-radius:10px 0 0 10px}
.fo-tab{background:var(--teal);display:flex;align-items:center;justify-content:center;padding:8px 4px}
.fo-tab .code{background:transparent;color:#fff;font-size:12.5px;white-space:normal;text-align:center;padding:0}
.fo-mbody{padding:9px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.fo-mlab{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--teal)}
.fo-mlab .ic{width:15px;height:15px;vertical-align:-3px;margin-right:4px}

.rp-btns{display:flex;gap:8px;flex-wrap:wrap}
.rp-open{border-color:#27CCAD !important;background:#EAF7F4 !important}
.rp{border:2px solid #27CCAD;border-radius:14px;background:#fff;margin:12px 0;box-shadow:0 8px 24px rgba(15,47,63,.12);overflow:hidden}

.rp-tg.c{background:#12313F;color:#fff}.rp-tg.q{background:#FFF8E1;color:#8a6500;border:1px solid #F2B705}
.rp-f{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#f7fafb;flex-wrap:wrap}.rp-n{font-size:12.5px;color:#4a6370;flex:1;min-width:260px}

.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.msg{font-size:13px;font-weight:600}

.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#FDECEA;color:#7A1A12;border-radius:7px;padding:8px 10px;font-size:13.5px}
.ro-note{font-size:12.5px;color:var(--muted)}

/* ===== Thème « Boussole » : marine, bleu clair, cartes grises arrondies (sans rouge) ===== */
:root{--bg:#FFFFFF;--surface:#FFFFFF;--sunk:#F4F5F6;--line:#E3E6EA;--fg:#12343F;--muted:#5D6B74;--blue:#12343F;--blue-ink:#12343F;--blue-soft:#E6F2FB;--on-blue:#FFFFFF;
 --teal:#9CCBEA;--teal-soft:#EEF6FC;--orange:#2A6F97;--orange-soft:#E6F2FB;--accent:#2A6F97;--gris:#F4F5F6;--bleu-clair:#E6F2FB;--bleu-clair2:#CFE6F7;--bleu-clair3:#9CCBEA;--r:14px}
@media (prefers-color-scheme:dark){:root{--bg:#FFFFFF;--surface:#FFFFFF;--fg:#12343F;--muted:#5D6B74;--line:#E3E6EA;color-scheme:light}}
body{background:#fff}
header.top{border-bottom:1px solid var(--line)}
.eyebrow{color:var(--accent)}h1{font-size:24px;font-weight:800;color:#12343F}
.vbtn{border:1px solid #12343F;border-radius:10px;background:#fff;color:#12343F}.vbtn[aria-pressed="true"]{background:#12343F;color:#fff}
.views{gap:6px;background:transparent;border:none;padding:0}
.side{background:#fff;border-radius:18px;box-shadow:0 2px 14px rgba(18,52,63,.08);padding:14px 12px}
.sidebox{border:none;border-bottom:1px solid var(--line);border-radius:0;padding:0 2px 12px}
.prof{border:none;border-radius:10px;background:var(--gris)}.prof:hover{background:var(--bleu-clair)}
.prof[aria-pressed="true"]{background:var(--bleu-clair);color:#12343F;box-shadow:inset 4px 0 0 var(--accent)}.prof[aria-pressed="true"] .pdom{color:var(--muted)}
.prof .count,.prof[aria-pressed="true"] .count{background:#fff;color:#12343F}
details.group summary{background:transparent;border-radius:0;border-bottom:1px solid var(--line);padding:11px 4px;font-size:14px;font-weight:600;letter-spacing:0;text-transform:none;color:#12343F}
details.group summary:hover{background:var(--gris)}details.group[open] summary{color:var(--accent)}
details.group .profiles{padding:6px 0 8px;display:flex;flex-direction:column;gap:4px}
.domtit{color:#12343F}
.fo-box{border:none;background:var(--gris);border-radius:16px}.fo-box .fo-lab,.fo-hic{color:var(--accent)}
.btn{border-radius:10px}.btn.primary{background:#12343F;border-color:#12343F}
#propBar{border-top:3px solid #12343F}
.cpfb.ok{background:#12343F}
.fo-compl{border:none;background:var(--gris);border-radius:18px}.fo-compl h3{color:var(--accent)}
.fo-ccard{border:none;background:#fff;border-radius:14px;box-shadow:0 1px 8px rgba(18,52,63,.06)}
.ff-mod{border:1px solid var(--line);border-radius:16px}.ff-mod .code{background:var(--bleu-clair2);color:#12343F}
/* liste des propositions (accordéon) */
.ac-list{display:flex;flex-direction:column;gap:14px;margin-bottom:16px}
.ac-card{border-radius:18px;border:1px solid var(--line);background:#fff;box-shadow:0 1px 8px rgba(18,52,63,.05)}
.ac-card.solo{padding:16px 18px}
.ac-card.parc{background:var(--gris);overflow:hidden}.ac-card.parc[open]{background:#fff;border-color:var(--bleu-clair3);box-shadow:0 2px 14px rgba(18,52,63,.08)}
.ac-card.parc > summary{list-style:none;cursor:pointer;padding:16px 18px 12px}.ac-card.parc > summary::-webkit-details-marker{display:none}
.ac-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.ac-ttl{min-width:0}.ac-ttl h3{margin:2px 0;font-size:18px;font-weight:800;color:#12343F}.ac-ttl p{margin:0;color:var(--muted);font-size:13px}
.ac-kind{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin-right:8px}
.ac-card .fo-best{background:var(--bleu-clair2);color:#12343F;margin-right:8px}
.ac-card .fo-tags{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;font-weight:600;margin-top:6px;color:#12343F}.ac-card .fo-tags span{display:inline-flex;align-items:center;gap:4px}
.ac-card .fo-tarifs{flex:none;align-self:flex-start;background:#fff;border-radius:14px;box-shadow:0 1px 6px rgba(18,52,63,.1);padding:8px 14px;text-align:right}
.ac-card .fo-tarifs .fo-cpf{color:#1f6f5c}
.ac-why{display:flex;gap:8px;align-items:flex-start;background:var(--bleu-clair);border-radius:10px;padding:8px 10px;margin-top:10px;font-size:13px;color:#12343F}
.ac-why .ic{flex:none;color:var(--accent);margin-top:1px}.ac-why .fo-more summary{color:var(--accent)}
.ac-toggle{display:inline-flex;gap:6px;align-items:center;margin-top:10px;font-weight:700;color:var(--accent);font-size:13px}
.ac-toggle i{font-style:normal;transition:transform .2s}.ac-card[open] .ac-toggle i{transform:rotate(180deg)}.ac-card[open] .ac-toggle .o,.ac-card:not([open]) .ac-toggle .c{display:none}
.ac-mods{position:relative;padding:2px 18px 18px 46px}.ac-mods::before{content:"";position:absolute;left:45px;top:4px;bottom:34px;border-left:2px solid var(--bleu-clair3)}
.ac-mod{display:grid;grid-template-columns:54px minmax(0,1fr);gap:12px;margin-top:10px;position:relative}
.ac-mod.solo{display:block;margin-top:12px}
.ac-step{z-index:1;background:var(--bleu-clair2);color:#12343F;font-weight:800;font-size:12.5px;border-radius:12px;display:flex;align-items:center;justify-content:center;min-height:44px;margin-left:-28px;width:56px;text-align:center;line-height:1.1;padding:2px}
.ac-mb{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0;display:flex;flex-direction:column;gap:4px}
.ac-mod.solo .ac-mb{border:none;padding:0;background:transparent}
.ac-mb .fo-mlab{color:var(--accent)}.ac-mb .mlink{color:#12343F;font-weight:600}
.ac-mb .fo-prop{background:var(--gris);border-radius:10px}
@media (max-width:700px){.ac-head{flex-direction:column}.ac-card .fo-tarifs{align-self:stretch;text-align:left}.ac-mods{padding-left:30px}.ac-mods::before{left:29px}}

.ac-step{align-self:start;min-height:0;height:44px}
details.group summary{border-left:none !important;box-shadow:none !important}details.group{border:none !important;box-shadow:none !important}
.fo-count .num{background:#12343F;color:#fff}
.btn.danger{color:#12343F;border-color:#9CCBEA;background:#fff}.btn.danger:hover{background:#E6F2FB;border-color:#2A6F97}
#propReset.danger{background:#12343F;color:#fff;border-color:#12343F}
.ff-mod{display:grid !important;grid-template-columns:56px minmax(0,1fr) !important;gap:12px !important;border:none !important;background:transparent !important;padding:0 !important;margin-top:10px;box-shadow:none !important}
.ff-mod>.code{align-self:start;height:44px;min-height:0;width:56px;border-radius:12px;background:var(--bleu-clair2);color:#12343F;font-weight:800;font-size:12.5px;display:flex;align-items:center;justify-content:center;font-family:inherit;padding:0}
.ff-mod>.ff-mbody{background:#fff;border:1px solid #DCE6EC;border-radius:14px;padding:12px 14px;min-width:0}
.ff-mod>.ff-mbody:only-child{grid-column:1/-1}
@media (max-width:700px){.ac-mod{grid-template-columns:40px minmax(0,1fr);gap:8px}.ac-step{width:40px;margin-left:-20px;font-size:11.5px}.ac-mods{padding:2px 10px 14px 22px}.ac-mods::before{left:21px}
.ff-mod{grid-template-columns:40px minmax(0,1fr) !important;gap:8px !important}.ff-mod>.code{width:40px}}
/* accents #27CCAD */
:root{--teal:#27CCAD;--teal-clair:#DDF6F1}
.side .sidebox>h2,.side .sidebox .stit,.side .domtit{position:relative}
.side .domtit::before,.side .sidetit::before{content:"";display:inline-block;width:14px;height:3px;border-radius:2px;background:var(--teal);vertical-align:middle;margin-right:8px}
.prof[aria-pressed="true"]{background:var(--teal-clair) !important;box-shadow:inset 4px 0 0 var(--teal) !important}
.prof[aria-pressed="true"] .count{background:var(--teal) !important;color:#12343F !important}
.prof:hover{background:#EEF9F6}
details.group[open] summary{color:#12343F !important;border-bottom:2px solid var(--teal) !important}
details.group[open] summary .chev{stroke:var(--teal)}
.side .inp:focus,.side select:focus,#q:focus{border-color:var(--teal) !important;box-shadow:0 0 0 3px rgba(39,204,173,.22) !important;outline:none}
.pend{display:inline-flex;align-items:center;gap:6px;flex:none}

.ac-kind.parc{display:inline-flex;align-items:center;gap:6px;color:#12343F}

.fo-best,.ac-card .fo-best{background:var(--teal) !important;color:#12343F !important}
.fo-best svg{stroke:#12343F;fill:#12343F}
.side .sidetit,.side .domtit{display:block;background:var(--teal);color:#12343F !important;font-weight:800;border-radius:8px;padding:7px 10px;letter-spacing:.07em}
.side .domtit::before,.side .sidetit::before{display:none !important}
.ac-ttl{flex:1 1 auto}.ac-head>.fo-tarifs{flex:0 0 auto;max-width:330px}
.ac-head .fo-tarifs .fo-cpf{white-space:normal}
.pt-min{display:block;font-size:10.5px;font-weight:600;color:#2A6F97;white-space:nowrap}
.ac-fermer{display:inline-flex;align-items:center;gap:6px;margin:14px 0 0 -2px;padding:7px 14px;border-radius:999px;border:1px solid var(--bleu-clair3);background:#fff;color:#12343F;font:inherit;font-size:13px;font-weight:700;cursor:pointer;position:relative;z-index:1}

.ia-btn{display:none;align-items:center;gap:4px;border:1px solid var(--teal);background:var(--teal-clair);color:#12343F;font:inherit;font-size:12.5px;font-weight:700;border-radius:999px;padding:5px 12px;cursor:pointer;margin-left:auto}
body.ia-on .ia-btn{display:inline-flex}.ia-btn:hover{background:var(--teal)}.ia-btn:disabled{opacity:.7;cursor:wait}

/* ===== Gestion : repères de couleur (mêmes codes que la fiche conseiller) ===== */
.form{--c-id:#12313F;--t-id:#EEF3F5;--c-bes:#13866F;--t-bes:#EAF7F4;--c-com:#6A4FD8;--t-com:#F3F0FF;--c-pc:#2A6F97;--t-pc:#EEF5FB;--c-pq:#B07D00;--t-pq:#FFF8E1;--b-pq:#F2B705;--c-cp:#C2611F;--t-cp:#FFF3EA;--c-q:#B07D00;--t-q:#FFF8E1;--c-rat:#13866F;--t-rat:#EAF7F4}

<script>

<script>
/* =====================================================================
   Les contenus (domaines, parcours, profils) sont dans la base de données

   Collections : domaines, formations (= parcours), profils.
   ===================================================================== */
const ICONS = {

  commun: '<path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>',

  ia: '<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
  rs: '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/>',
  ext: '<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
  cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  pos: '<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3h6v1M9 12l2 2 4-4"/>',
  domaine: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>'
};
const ic = n => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ICONS.domaine}</svg>`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const slug = s => norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60) || "x";
const byOrdre = (a,b) => (a.ordre ?? 1e9) - (b.ordre ?? 1e9) || String(a.nom||"").localeCompare(String(b.nom||""), "fr");
const $ = id => document.getElementById(id);

/* ---------- Dates (texte), tarifs, positionnement, CPF ---------- */
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
/* sessions à venir : on masque automatiquement celles dont le dernier jour est passé */
const aVenir = m => (Array.isArray(m && m.sessions) ? m.sessions : []).filter(x => x && x.texte && (!x.fin || x.fin >= today()))
  .sort((a,b) => String(a.debut || a.fin || "").localeCompare(String(b.debut || b.fin || "")));
const eur = n => (n === "" || n == null || isNaN(Number(n))) ? "" : Number(n).toLocaleString("fr-FR") + " €";
/* opts.parcours : le module fait partie d'un parcours (plusieurs modules) ; opts.avecM1 : ce parcours contient un module de niveau 1 */
function infoHtml(m, opts){
  if(!m) return "";
  const o = opts || {}, out = [], s = aVenir(m), has = Array.isArray(m.sessions) && m.sessions.length;
  if(has) out.push(`<span class="ml">${ic("cal")}<span>${s.length ? `<b>Prochaines dates :</b> <span class="dates">${s.slice(0, o.max || 99).map(x => esc(x.texte)).join(" · ")}${o.max && s.length > o.max ? " …" : ""}</span>` : `<span class="none">Aucune date à venir</span>`}</span></span>`);
  if(m.tarif && !o.sansTarif) out.push(`<span class="ml">${ic("euro")}<span><b>${eur(m.tarif)}</b>${o.parcours && m.tarifParcours ? ` · ${eur(m.tarifParcours)} dans ce parcours` : ""}</span></span>`);
  if(o.cert) out.push(`<span class="ml">${ic("certif")}<span><b>Certification ${esc(o.cert.nom)} :</b> ${eur(o.cert.prix)}${o.cert.total ? ` · <b>Total CPF ${eur(o.cert.total)}</b>` : ""}</span></span>`);
  /* le positionnement n'est demandé que si la personne fait le niveau 2 sans le niveau 1 */
  /* dans un parcours qui contient un M1 : le questionnaire n'est à faire que si la personne ne suit pas le M1 */
  if(aQuestionnaire(m)) out.push(`<span class="ml pos">${ic("pos")}<span><b>${o.avecM1 ? "Positionnement si le M1 n'est pas suivi" : o.parcours ? "Positionnement si pas de niveau 1" : "Positionnement"} :</b> ${qLigne(m, o.fid)}</span></span>`);
  if(m.cpf) out.push(`<span class="ml">${ic("certif")}<span><b>CPF :</b> ${esc(m.cpf)}${o && o.fid && Number((rawF(o.fid) || {}).cpfMinJours) > 0 ? ` · à partir de ${Number(rawF(o.fid).cpfMinJours)} jours de formation` : ""}</span></span>`);
  return out.length ? `<span class="minfo">${out.join("")}</span>` : "";
}
const aQuestionnaire = m => !!(m && (m.questionnaire || m.positionnement || m.positionnementLien));
/* nom, type et accès au questionnaire ; le lien n'est montré qu'aux personnes autorisées */
function qLigne(m, fid){
  const nom = esc(m.positionnement || "Questionnaire de positionnement"), type = m.questionnaireType ? ` <small>(${esc(m.questionnaireType)})</small>` : "";
  const d = fid ? qDoc(fid, m.code) : null, u = d && safeUrl(d.lien), fic = d && d.fichier;
  let acces;
  if(!canRead) acces = `<small class="qhint">· lien visible après connexion</small>`;
  else if(fic) acces = `<button type="button" class="qbtn" data-qf="${esc(d.id)}">${ic("ext")}Télécharger</button>${u ? ` <a class="qbtn" href="${esc(u)}" target="_blank" rel="noopener">${ic("ext")}Ouvrir le lien</a>` : ""}`;
  else if(u) acces = `<a class="qbtn" href="${esc(u)}" target="_blank" rel="noopener">${ic("ext")}Ouvrir</a>`;
  else acces = `<small class="qhint">· à demander au service formation</small>`;
  return `${nom}${type} ${acces}`;
}
/* ouvrir un questionnaire déposé dans la base */
async function ouvrirFichierQ(id){
  const d = (RAW.questionnaires || []).find(x => x.id === id), f = d && d.fichier; if(!f) return;
  try{
    if(f.chemin && SB){ const { data, error } = await SB.storage.from("questionnaires").createSignedUrl(f.chemin, 300, { download: f.nom || true }); if(error) throw error; location.href = data.signedUrl; return; }
    if(f.contenu){ const a = document.createElement("a"); a.href = f.contenu; a.download = f.nom || "questionnaire"; document.body.appendChild(a); a.click(); a.remove(); return; }
    throw 0;
  }catch(e){ toast("Téléchargement impossible pour le moment"); }
}
document.addEventListener("click", e => { const b = e.target.closest("[data-qf]"); if(b){ e.preventDefault(); ouvrirFichierQ(b.dataset.qf); } });
/* Lit une session écrite en texte (ex. « 18-19 et 25-26 janvier 2027 ») pour retrouver son premier et son dernier jour. */
const MOISN = {jan:1,janv:1,janvier:1,fev:2,fevr:2,fevrier:2,mar:3,mars:3,avr:4,avril:4,mai:5,juin:6,juil:7,juillet:7,aout:8,sep:9,sept:9,septembre:9,oct:10,octobre:10,nov:11,novembre:11,dec:12,decembre:12};
/* dates saisies en chiffres (12/04/2027, 12.04.27, 12/04) → « 12 avril 2027 » ; année absente → prochaine occurrence */
const MOIS_NOMS = ["", "janvier", "fevrier", "mars", "avril", "mai", "juin", "juillet", "aout", "septembre", "octobre", "novembre", "decembre"];
function prepDate(t){
  let s = String(t || "").replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, (x, y, m, d) => `${+d} ${MOIS_NOMS[+m] || m} ${y}`)
    .replace(/\b(\d{1,2})[\/.](\d{1,2})(?:[\/.](\d{2,4}))?\b/g, (x, d, m, y) => `${+d} ${MOIS_NOMS[+m] || m}${y ? " " + (y.length === 2 ? "20" + y : y) : ""}`);
  if(!/\b(19|20)\d{2}\b/.test(s)){ const n = norm(s), mm = (n.match(/[a-z]+/g) || []).map(k => MOISN[k]).find(Boolean);
    if(mm){ const now = new Date(), y = mm < now.getMonth() + 1 ? now.getFullYear() + 1 : now.getFullYear(); s += " " + y; } }
  return s;
}
function lireSession(t){
  const s = norm(prepDate(t)).replace(/(\d+)\s*(?:er)?\s*au\s*(\d+)/g, (x, a, b) => { const r = []; for(let i = +a; i <= +b && r.length < 31; i++) r.push(i); return r.join(" "); });
  let an = null, pend = [], jours = [];
  (s.match(/\d+|[a-z]+/g) || []).forEach(k => {
    if(/^\d{4}$/.test(k)) an = +k;
    else if(/^\d{1,2}$/.test(k)) pend.push(+k);
    else if(MOISN[k]){ pend.forEach(j => jours.push([MOISN[k], j])); pend = []; }
  });
  if(!jours.length || !an || jours.some(([m, j]) => j < 1 || j > 31)) return null;
  const iso = ([m, j]) => an + "-" + String(m).padStart(2,"0") + "-" + String(j).padStart(2,"0");
  return { texte: String(t).trim(), debut: iso(jours[0]), fin: iso(jours[jours.length - 1]) };
}
const ctxF = f => { const codes = Object.keys(f.modules || {}); return { fid: f.id, parcours: codes.length > 1, avecM1: codes.length > 1 && codes.some(c => /^M1\b/i.test(c)) }; };
const INFO_KEYS = ["sessions", "tarif", "tarifParcours", "questionnaire", "questionnaireType", "positionnement", "cpf"];

/* ---------- Données ---------- */
let db = null, user = null, canAdmin = false; /* canRead : voir les liens des questionnaires */
const RAW = { domaines: null, formations: null, profils: null, questionnaires: [], pilotage: [] };
/* liens des questionnaires de positionnement : rangés à part, lisibles seulement par les personnes autorisées */
let canRead = false;
const qKey = (fid, code) => fid + "__" + String(code || "").replace(/[^\w-]/g, "_");
const qDoc = (fid, code) => (RAW.questionnaires || []).find(x => x.id === qKey(fid, code)) || null;
let DOMAINES = [];

/* session saisie directement dans la base avec seulement « debut » / « fin » : on fabrique son texte (ex. « 12 avril 2027 », « 12 au 14 avril 2027 ») */
function texteDeDates(s){
  if(!s || s.texte || !/^\d{4}-\d{2}-\d{2}$/.test(String(s.debut || ""))) return s;
  const [y1, m1, d1] = s.debut.split("-").map(Number), f = /^\d{4}-\d{2}-\d{2}$/.test(String(s.fin || "")) ? s.fin : s.debut, [y2, m2, d2] = f.split("-").map(Number);
  const M = ["", "janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
  s.texte = f === s.debut ? `${d1} ${M[m1]} ${y1}` : (m1 === m2 && y1 === y2 ? `${d1} au ${d2} ${M[m2]} ${y2}` : `${d1} ${M[m1]}${y1 !== y2 ? " " + y1 : ""} au ${d2} ${M[m2]} ${y2}`);
  return s;
}
const completerSessions = formations => (formations || []).forEach(f => (f.modules || []).forEach(m => { if(Array.isArray(m.sessions)) m.sessions.forEach(texteDeDates); }));
function buildModel(){
  completerSessions(RAW.formations);
  MAILCFG = (RAW.domaines || []).find(d => d.id === MAIL_ID) || null;
  { const mc = (MAILCFG && MAILCFG.mentions) || {}; PLAFOND_CPF = Number(mc.plafond) > 0 ? Number(mc.plafond) : 1500; PARTICIPATION_CPF = Number(mc.participation) >= 0 && mc.participation !== "" && mc.participation != null ? Number(mc.participation) : 150; }
  DOMAINES = (RAW.domaines || []).filter(d => d.id !== MAIL_ID).slice().sort(byOrdre).map(d => ({
    id: d.id, nom: d.nom || d.id, financement: d.financement || "", certification: d.certification || "",
    ordreModules: Array.isArray(d.ordreModules) ? d.ordreModules : [],
    formations: (RAW.formations || []).filter(f => f.domaine === d.id).sort(byOrdre).map(f => ({
      id: f.id, nom: f.nom || f.id, intitule: f.intitule || "", duree: f.duree || "", certification: f.certification || "",
      modules: Object.fromEntries((Array.isArray(f.modules) ? f.modules : []).map(m => [m.code, m.titre])),
      infos: Object.fromEntries((Array.isArray(f.modules) ? f.modules : []).map(m => [m.code, m])),
      prix: prixParcours(f), certs: certsDe(f), tarifCertification: f.tarifCertification,
      liens: Object.fromEntries((Array.isArray(f.modules) ? f.modules : []).filter(m => m.lien).map(m => [m.code, m.lien])) })),
    profils: (RAW.profils || []).filter(p => p.domaine === d.id).sort(byOrdre).map(p => ({
      id: p.id, categorie: profCats(p)[0], categories: profCats(p), motsCles: p.motsCles || "", nom: p.nom || "", besoin: p.besoin || "", besoinDetail: p.besoinDetail || null, reponses: p.reponses || {},
      parcours: Object.fromEntries((Array.isArray(p.parcours) ? p.parcours : []).map(x => [x.formation, { pourquoi: x.pourquoi || "", argumentaire: x.argumentaire || "", reponses: x.reponses || {} }])),
      complements: (Array.isArray(p.complements) ? p.complements : []).filter(c => c && c.formation) }))
  }));
  /* lignes de modules : ordre du domaine, puis modules non listés */
  DOMAINES.forEach(d => d.formations.forEach(f => Object.keys(f.modules).forEach(m => { if(!d.ordreModules.includes(m)) d.ordreModules = d.ordreModules.concat(m); })));
}
/* Tarif préférentiel d'un parcours de 3 jours et plus : somme des tarifs « parcours » de ses modules */
const nomCert = c => String(c || "").replace(/\s*\(.*\)\s*$/, "");
/* toutes les certifications d'une formation ou d'un parcours (celle du parcours + celles des modules certifiables seuls) */
function certsDe(f){
  const l = f.certification ? [nomCert(f.certification)] : [];
  (Array.isArray(f.modules) ? f.modules : []).forEach(m => { if(cpfOk(m.cpf)) return; const a = cpfAlt(m.titre); if(a){ const n = nomCertAlt(m.titre, a); if(!l.includes(n)) l.push(n); } });
  return l;
}
function prixParcours(f){
  const mods = Array.isArray(f.modules) ? f.modules : [];
  if(mods.length < 2 || (parseInt(f.duree, 10) || 0) < 3 || !mods.every(m => Number(m.tarifParcours) > 0)) return null;
  const parcours = mods.reduce((t, m) => t + Number(m.tarifParcours), 0), cert = Number(f.tarifCertification) || 0;
  /* parcours dont seuls certains modules passent en CPF (ex. PAO : le module certifiant) : les autres sont « Non » */
  const oui = m => /^oui/i.test(String(m.cpf || "")), non = m => /^non/i.test(String(m.cpf || ""));
  const partiel = mods.some(oui) && mods.some(non), base = partiel ? mods.filter(oui).reduce((t, m) => t + Number(m.tarifParcours), 0) : parcours;
  /* modules « Non » dans ce parcours mais certifiables seuls (ex. Photoshop) : leur propre certification, dans un dossier CPF à part */
  const autres = mods.filter(m => !oui(m)).map(m => { const a = cpfAlt(m.titre); return a ? { nom: nomCertAlt(m.titre, a), prix: Number(a.f.tarifCertification) || 0, cpf: Number(m.tarifParcours) + (Number(a.f.tarifCertification) || 0) } : null; }).filter(Boolean);
  return { parcours, cert, partiel, autres, cpf: cert ? base + cert : null, separe: mods.every(m => Number(m.tarif) > 0) ? mods.reduce((t, m) => t + Number(m.tarif), 0) : null };
}

function metiersDe(q){
  const t = norm(q.trim()); if(t.length < 3) return [];
  const out = []; METIERS_IDX.forEach((fams, k) => { if(k === t || (t.length >= 4 && (k.startsWith(t) || t.split(" ").every(w => w.length >= 3 && k.split(" ").some(x => x.startsWith(w)))))) out.push([k, fams]); });
  return out.sort((a, b) => (a[0] === t ? -1 : 0) - (b[0] === t ? -1 : 0) || a[0].length - b[0].length).slice(0, 4);
}

const ouvertes = new Set(); /* catégories que la conseillère a dépliées */
/* texte dans lequel on cherche : nom, besoin, catégories et leurs mots-clés, mots-clés du sous-profil, parcours et modules proposés */
/* recherche par métier : utilisée seulement quand aucun sous-profil ne correspond directement (ex. « boulanger » → famille Commerce, artisanat, tourisme) */
let MM_CLE = null, MM_VAL = false, MM_CALC = false;
function modeMetier(){
  if(MM_CALC) return false; const q = norm((state.q || "").trim()); if(q.length < 3) return false;
  if(MM_CLE === q) return MM_VAL; MM_CALC = true;
  try{ MM_VAL = !DOMAINES.some(d => d.profils.some(p => matchQ(hayOf(p, d), q))) && metiersDe(q).length > 0; } finally{ MM_CALC = false; }
  MM_CLE = q; return MM_VAL;
}
function hayOf(p, d){
  const rd = (RAW.domaines || []).find(x => x.id === d.id) || {}, mc = rd.motsClesCategories || {};
  const fs = Object.keys(p.parcours).map(id => d.formations.find(f => f.id === id)).filter(Boolean);
  return norm([p.nom, p.besoin, ...Object.values(p.besoinDetail || {}), p.motsCles, METIERS_PROFILS[p.id] || "", d.nom, ...p.categories, ...p.categories.map(c => mc[c] || ""), ...(modeMetier() ? p.categories.map(metierMots) : []),
    ...fs.map(f => f.nom + " " + f.intitule + " " + Object.values(f.modules).join(" "))].join(" "));
}
const matchQ = (hay, q) => q.split(/[\s,;]+/).filter(Boolean).every(w => hay.includes(w));
/* ordre commun des familles de métiers (vue « Tous les domaines ») ; une famille ajoutée en Gestion vient à la fin */
const FAMILLES = ["Administratif et commercial", "Accueil et relation client", "Ressources humaines", "Comptabilité", "Gestion et management", "Communication et marketing", "Création et contenus", "Formation", "Santé et social", "Technique", "Dirigeants et indépendants", "Commerce, artisanat, tourisme", "Emploi et transition"];
const rangF = c => { const i = FAMILLES.indexOf(c); return i < 0 ? 99 : i; };
function renderCatSel(){
  const d = dom(), el = $("catSel"); if(!d || !el) return;
  const l = state.tous ? [...new Set(DOMAINES.flatMap(domCats))].sort((x, y) => rangF(x) - rangF(y)) : domCats(d); if(state.cat && !l.includes(state.cat)) state.cat = "";
  el.innerHTML = `<option value="">Toutes les familles</option>` + l.map(c => `<option${c===state.cat?" selected":""}>${esc(c)}</option>`).join("");

/* le sous-profil ouvert reste visible dans le menu (défilement seulement s'il est caché) */
function voirActif(){ requestAnimationFrame(() => { const side = document.querySelector("#consult .side"), b = side && side.querySelector('.prof[aria-pressed="true"]'); if(!b) return;
  const top = side.querySelector(".sidetop"), h = top ? top.offsetHeight : 0, rs = side.getBoundingClientRect(), rb = b.getBoundingClientRect();
  if(rb.top < rs.top + h || rb.bottom > rs.bottom) side.scrollTop += rb.top - rs.top - h - 40; }); }
function renderList(){
  const d = dom(); if(!d){ $("groups").innerHTML = ""; return; }
  renderCatSel(); voirActif();
  if(state.tous) return renderListTous();
  queueMicrotask(() => { const h = metierHint(); if(h && !$("groups").querySelector(".metier-hint")) $("groups").insertAdjacentHTML("afterbegin", h); });
  const q = norm(state.q.trim()), cats = [];
  d.profils.forEach(p => {
    if(state.cat && !p.categories.includes(state.cat)) return;
    if(q && !matchQ(hayOf(p, d), q)) return;
    p.categories.filter(nom => !state.cat || nom === state.cat).forEach(nom => { let c = cats.find(x => x.nom === nom); if(!c){ c = {nom, items:[]}; cats.push(c); } c.items.push(p); });
  });
  const ordre = domCats(d); cats.sort((a, b) => ordre.indexOf(a.nom) - ordre.indexOf(b.nom));
  const sel = d.profils.find(p => p.id === state.pid);
  $("groups").innerHTML = cats.length ? cats.map(c => {
    const open = q || ouvertes.has(d.id + "|" + c.nom); /* toutes visibles, repliées par défaut ; dépliées pendant une recherche */
    return `<details class="group" data-cat="${esc(c.nom)}"${open?" open":""}><summary><span class="sum">${esc(c.nom)}</span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary><div class="profiles">${c.items.map(p => {
      const n = Object.keys(p.parcours).length;
      return `<button type="button" class="prof" data-pid="${esc(p.id)}" aria-pressed="${state.pid===p.id}"><span>${esc(p.nom)}</span><span class="pend">${pkIc(p)}<span class="count" title="${n} proposition${n>1?"s":""} de formation${pkIc(p) ? " (dont au moins un parcours)" : ""}">${n}</span></span></button>`;
    }).join("")}</div></details>`;
  }).join("") : `<p class="none">${!d.profils.length ? "Aucun profil dans ce domaine pour l'instant." : q ? `Rien dans ce domaine pour « ${esc(state.q)} »${state.cat ? ` (famille « ${esc(state.cat)} »)` : ""}.` : "Aucun sous-profil dans cette famille."}</p>`;
  if(q) $("groups").insertAdjacentHTML("afterbegin", formationsHtml(q));
  /* recherche dans tous les domaines : les résultats des autres domaines viennent ensuite */

    const autres = [];
    DOMAINES.filter(x => x.id !== d.id).forEach(x => x.profils.forEach(p => { if(matchQ(hayOf(p, x), q)) autres.push({ p, x }); }));

      `<button type="button" class="prof" data-pid="${esc(p.id)}" data-dom="${esc(x.id)}"><span>${esc(p.nom)}<small class="pdom">${esc(x.nom)} · ${esc(p.categories[0])}</small></span><span class="pend">${pkIc(p)}<span class="count">${Object.keys(p.parcours).length}</span></span></button>`).join("")}</div>`);
    else if(!cats.length) $("groups").insertAdjacentHTML("beforeend", `<p class="none">Rien non plus dans les autres domaines. Essayez un autre mot.</p>`);
  }
}

/* liste « Tous les domaines » : chaque domaine, puis ses catégories, repliées par défaut */
/* recherche par formation : section en tête des résultats */
function formationsTrouvees(q){
  if(!q) return [];

/* bandeau « métier reconnu » en tête des résultats */

function renderListTous(){

/* page d'accueil : schéma en 4 étapes */

document.addEventListener("click", e => { if(e.target.closest("[data-accq]")){ const q = $("q"); if(q){ q.focus(); q.scrollIntoView({ block: "center", behavior: "smooth" }); } } });
function majEffacer(){ const rb = $("resetBtn"); if(rb && rb.dataset.ok !== "1") rb.hidden = !(state.q.trim() || !state.tous || state.cat || state.pid || state.fid); }
function renderDetail(){

      : `<b>Aucun résultat dans « ${esc(d.nom)} »${quoi ? ` pour ${quoi}` : ""}${state.cat ? ` (famille « ${esc(state.cat)} »)` : ""}.</b><br>${nAut

        : qq ? ((state.scope || "tous") === "tous" && !state.cat ? "Rien non plus dans les autres domaines. Essayez un autre mot, ou ajoutez-le en mot-clé dans Gestion." : "Essayez « Tous les domaines », ou un autre mot.") : "Choisissez une autre famille."}`}</div>`;
    return;
  }
  const cols = Object.keys(p.parcours).map(id => d.formations.find(f => f.id === id)).filter(Boolean);
  if(!cols.length){ el.innerHTML = `<div class="state">Ce profil n'est relié à aucun parcours.</div>`; return; }
  const n = cols.length, seul = cols.every(f => Object.keys(f.modules).length < 2);
  const rows = d.ordreModules.filter(m => cols.some(f => f.modules[m]));
  const txtOf = (f, m) => ((p.parcours[f.id].reponses||{})[m]) || (p.reponses||{})[m] || "";
  const titre = (f, m) => { const t = esc(f.modules[m]); const u = safeUrl((f.liens||{})[m]); return u ? `<a class="mlink" href="${esc(u)}" target="_blank" rel="noopener" title="Ouvrir la fiche">${t}${ic("ext")}</a>` : t; };
  /* placement : chaque élément connaît sa ligne et sa colonne ; sur téléphone, on empile parcours par parcours pour l'en-tête et le pourquoi */
  const at = (r, c, span) => `style="grid-row:${r};grid-column:${c}${span?" / span "+span:""};--o:${r < 2 ? c*10 + r : 100 + r*10 + c}"`;
  const tarifs = f => {

  };
  const cards = [];

        <span class="fo-tags">${f.duree ? `<span>${ic("duree")}${esc(f.duree)}</span>` : ""}${nm > 1 ? `<span>${ic("modules")}${nm} modules</span>` : ""}${(f.certs || []).map(c => `<span>${ic("certif")}${esc(c)}</span>`).join("")}</span></div>
      <div class="fo-pfoot">${p.parcours[f.id].pourquoi ? `<span class="fo-why">${ic("why")}<span><b>Pourquoi :</b> ${esc(p.parcours[f.id].pourquoi)}${p.parcours[f.id].argumentaire ? `<details class="fo-more"><summary>Argumentaire détaillé</summary><span class="fo-moretxt">${esc(p.parcours[f.id].argumentaire)}</span></details>` : ""}</span></span>` : "<span></span>"}${tarifs(f)}</div></div>`);
  });
  rows.forEach((m, k) => {
    const r = k + 2, has = cols.map(f => !!f.modules[m]);
    const txts = cols.map(f => f.modules[m] ? txtOf(f, m) : null);
    const commun = n > 1 && has.every(Boolean) && txts.every(t => t === txts[0]) && cols.every(f => f.modules[m] === cols[0].modules[m]);

    /* module commun à tous les parcours : affiché dans chaque parcours (case à cocher propre à chacun) */
    cols.forEach((f, i) => {
      if(!f.modules[m]){ cards.push(`<div class="fo-gap" ${at(r, i+1)} aria-hidden="true"></div>`); return; }
      const single = Object.keys(f.modules).length < 2;
      cards.push(`<div class="fo-card fo-mod${commun ? " fo-partage" : ""}" ${at(r, i+1)}>${mod(f, single ? { sansTarif: true } : {}, commun ? `${ic("commun")}Commun à tous les parcours` : "")}</div>`); /* pas de nom du parcours au-dessus du module : la colonne et la flèche suffisent */
    });
  });
  /* ---------- Nouvelle présentation : une carte par proposition ; un parcours se déplie (accordéon) pour montrer ses modules ---------- */
  if(state.accPid !== p.id){ state.accPid = p.id; state.accOuvert = ""; } /* nouvelle fiche : tout fermé */
  const partage = m => n > 1 && cols.filter(f => f.modules[m]).length === n && cols.every(f => f.modules[m] === cols[0].modules[m]);
  const nbParc = cols.filter(f => Object.keys(f.modules).length > 1).length;
  const modBloc = (f, m, avecStep) => `<div class="ac-mod${avecStep ? "" : " solo"}">${avecStep ? `<span class="ac-step">${esc(m)}</span>` : ""}<div class="ac-mb">

      <span class="fo-mt">${titre(f, m)}${cpfBadge(cpfTexte(f.modules[m], (f.infos[m] || {}).cpf))}</span>
      ${txtOf(f, m) ? `<span class="fo-arg why-m">${ic("why")}<span><b>Pourquoi :</b> ${esc(txtOf(f, m))}</span></span>` : ""}
      ${pied(f.infos[m], Object.assign(ctxF(f), avecStep ? {} : { sansTarif: true }))}${propCtl(f.id, m)}</div></div>`;

/* coût de certification d'une formation seule ; total CPF si la formation est éligible */
function certInfo(f, m){
  const prix = Number(f.tarifCertification) || 0; if(!prix) return null;
  const ok = /^oui/i.test(String((m && m.cpf) || "")) && Number(m && m.tarif) > 0;
  return { nom: String(f.certification || "").replace(/\s*\(.*\)\s*$/, ""), prix, total: ok ? Number(m.tarif) + prix : null };
}
/* pied de module : la prochaine session, le reste (toutes les dates, tarif, CPF, positionnement) dans « Détails » */
function pied(m, o){
  if(!m) return "";
  const s = aVenir(m), has = Array.isArray(m.sessions) && m.sessions.length, det = infoHtml(m, o);
  const next = has ? (s.length ? `<span class="fo-next">${ic("cal")}<span><b>Prochaine session :</b> ${esc(s[0].texte)}${s.length > 1 ? ` <small>· ${s.length - 1} autre${s.length > 2 ? "s" : ""}</small>` : ""}</span></span>` : `<span class="fo-next none">${ic("cal")}Aucune date à venir</span>`) : "<span></span>";
  return `<div class="fo-foot">${next}${det ? `<details class="fo-det"><summary>Détails</summary>${det}</details>` : ""}</div>`;
}

/* pastille CPF à côté du titre d'un module */
const cpfOk = c => /^oui/i.test(String(c || ""));
/* Module hors dossier CPF d'un parcours (ex. Photoshop dans le parcours InDesign) mais certifiable seul :
   on retrouve la formation seule éligible qui porte le même module (sa certification sert alors pour le CPF). */
/* nom précis de la certification d'un module certifiable seul : repris d'un parcours où il est le module certifiant (ex. « Tosa Photoshop RS6959 »), sinon « Tosa » + nom de la formation */
function nomCertAlt(titre, a){
  const k = norm(titre || "");
  for(const f of (RAW.formations || [])) for(const m of (f.modules || [])){
    if(norm(m.titre || "") !== k) continue; const x = /certification\s+([^)]+)\)/i.exec(String(m.cpf || ""));
    if(x && x[1].trim().length > nomCert(a.f.certification).length) return x[1].trim(); }
  return nomCert(a.f.certification) + " " + a.f.nom;
}
function cpfAlt(titre){
  const k = norm(titre || "");
  for(const f of (RAW.formations || [])){ const mods = f.modules || [];
    if(mods.length === 1 && norm(mods[0].titre || "") === k && cpfOk(mods[0].cpf) && f.certification && !/venir/i.test(f.certification)) return { f, m: mods[0] }; }
  return null;
}
const cpfTexte = (titre, c) => cpfOk(c) ? c : (cpfAlt(titre) ? cpfAlt(titre).m.cpf : c);
function cpfBadge(c){
  const t = String(c || "");
  if(cpfOk(t)){ const pm = t.match(/parcours[^0-9]*(\d+)\s*jours?/i);
    return `<span class="cpfb ok" title="${esc(t)}">€ CPF${pm ? ` <small>en parcours ${pm[1]} j min.</small>` : ""}</span>`; }
  if(/venir/i.test(t)) return `<span class="cpfb soon" title="${esc(t)}">CPF à venir</span>`;
  return "";
}
function complementsHtml(p, d){
  const items = (p.complements || []).map(c => ({ c, f: (RAW.formations || []).find(f => f.id === c.formation) })).filter(x => x.f);
  if(!items.length) return "";
  return `<section class="fo-compl" aria-label="Formations complémentaires"><h3>${ic("plus")}<span>Formations<br>complémentaires</span></h3><div class="fo-ccards">${items.map(({c, f}) => {
    const dom = (RAW.domaines || []).find(x => x.id === f.domaine), m = (Array.isArray(f.modules) ? f.modules : [])[0] || {}, u = safeUrl(m.lien);
    const nom = u ? `<a class="mlink" href="${esc(u)}" target="_blank" rel="noopener">${esc(f.nom)}${ic("ext")}</a>` : esc(f.nom);
    return `<div class="fo-ccard"><b>${nom}${cpfBadge(m.cpf)}</b><span class="cmeta">${f.duree?`${ic("duree")}${esc(f.duree)}`:""}${f.certification?` · ${esc(f.certification)}`:""} · ${esc(dom ? dom.nom : "")}</span><span class="cwhy">${esc(c.pourquoi || "")}</span>${(f.modules || []).length > 1 ? prixCarte(f) : pied(m, { fid: f.id, cert: certInfo(f, m) })}${(f.modules || []).length === 1 ? propCtl(f.id, m.code) : ""}</div>`;
  }).join("")}</div></section>`;
}
function prixCarte(f){
  const x = prixParcours(f), n = (f.modules || []).length;
  return `<span class="minfo"><span class="ml">${ic("modules")}<span>Parcours de ${n} modules${x ? ` · <b>${eur(x.parcours)}</b>${x.cpf ? ` · ${x.partiel ? "Dossier CPF" : "Total CPF"}${x.autres.length ? " " + esc(nomCert(f.certification)) : ""} ${eur(x.cpf)}` : ""}${(x.autres || []).map(a => ` · Dossier CPF ${esc(a.nom)} ${eur(a.cpf)}`).join("")}` : ""}</span></span></span>`;
}
function safeUrl(u){ try{ const x = new URL(String(u || "")); return /^https?:$/.test(x.protocol) ? x.href : ""; }catch(e){ return ""; } }

  });

/* chaque onglet garde l'élément choisi : en revenant sur « Sous-profils », on retrouve la fiche ouverte */
const selParOnglet = {};
$("admTabs").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]"); if(!b || b.dataset.tab === adm.tab) return;
  if(adm.sel && adm.sel !== "new") selParOnglet[adm.tab] = { dom: adm.dom, sel: adm.sel };
  const ctx = qContexte();
  adm.tab = b.dataset.tab;
  const m = selParOnglet[adm.tab], global = adm.tab === "questionnaires" || adm.tab === "comptes" || adm.tab === "modeles";
  adm.sel = adm.tab === "domaine" ? adm.dom : (m && (global || m.dom === adm.dom) ? m.sel : null);
  /* depuis une formation ou un sous-profil ouvert : l'onglet Questionnaires ouvre directement le bon questionnaire */
  if(adm.tab === "questionnaires" && ctx.length){
    const l = qModules(), hit = ctx.map(fid => l.find(x => x.f.id === fid)).find(Boolean);
    if(hit) adm.sel = hit.k; else { adm.sel = "new"; adm.qPre = ctx[0]; }
  }
  if(adm.tab === "comptes") chargerComptes();
  renderAdmin(true);
});
$("admNewDom").addEventListener("click", () => { adm.tab = "domaine"; adm.sel = "new"; renderAdmin(false); renderAdmForm(); });
$("admList").addEventListener("click", e => {
  const n = e.target.closest("[data-new]"); if(n){ adm.sel = "new"; renderAdmList(); renderAdmForm(); return; }
  const b = e.target.closest("[data-sel]"); if(!b) return; adm.sel = b.dataset.sel; renderAdmList(); renderAdmForm();
});

const field = (label, html, full) => `<label class="field${full?" full":""}">${label}${html}</label>`;
const inp = (id, val, ph) => `<input class="inp" id="${id}" value="${esc(val)}"${ph?` placeholder="${esc(ph)}"`:""}>`;
const ta = (id, val, ph, cls) => `<textarea class="inp${cls?" "+cls:""}" id="${id}"${ph?` placeholder="${esc(ph)}"`:""}>${esc(val)}</textarea>`;
const formActions = (canDelete) => `<div class="actions"><button type="button" class="btn primary" data-act="save">Enregistrer</button><button type="button" class="btn" data-act="cancel">Annuler</button>${canDelete?`<button type="button" class="btn danger" data-act="del">Supprimer</button>`:""}<span class="msg" id="fmsg" role="status"></span></div><div id="fconfirm"></div>`;
const setMsg = (t, ok) => { const m = $("fmsg"); if(m){ m.textContent = t; m.className = "msg " + (ok ? "ok" : "err"); } };

function renderAdmForm(){
  const el = $("admForm"), d = admDom();
  el.onclick = null; el.onchange = null; el.oninput = null; el.dataset.dirty = "";
  if(adm.tab === "questionnaires") return formQuestionnaire(el);
  if(adm.tab === "comptes") return formCompte(el);
  if(adm.tab === "modeles") return formModeles(el);
  if(adm.tab === "domaine" || adm.sel === "new" && adm.tab === "domaine"){ return formDomaine(el); }
  if(!d){ el.innerHTML = ""; return; }
  if(!adm.sel){ el.innerHTML = `<div class="state">Choisissez un élément dans la liste, ou créez-en un nouveau.</div>`; return; }
  if(adm.tab === "formations") return formFormation(el, d);
  if(adm.tab === "categories") return formCategorie(el, d);
  return formProfil(el, d);
}

/* ----- Questionnaires de positionnement : espace de dépôt, tous domaines ----- */
function qModules(){
  const l = [];
  DOMAINES.forEach(d => (RAW.formations || []).filter(f => f.domaine === d.id).sort((a, b) => (a.ordre ?? 99) - (b.ordre ?? 99)).forEach(f =>
    (f.modules || []).forEach(m => { if(aQuestionnaire(m)) l.push({ d, f, m, k: qKey(f.id, m.code) }); })));
  return l;
}
function qEtat(k){ const x = (RAW.questionnaires || []).find(q => q.id === k); return x && x.fichier ? "Document déposé" : x && x.lien ? "Lien" : "À compléter"; }
function listQuestionnaires(el){
  let html = `<button type="button" class="btn add" data-new="1">+ Ajouter un questionnaire</button>`, dom = "";
  qModules().forEach(({ d, f, m, k }) => {
    if(d.id !== dom){ dom = d.id; html += `<div class="adm-cat">${esc(d.nom)}</div>`; }
    const e = qEtat(k);
    html += `<button type="button" class="adm-item" data-sel="${esc(k)}" aria-pressed="${adm.sel===k}"><b>${esc(f.nom)}${(f.modules || []).length > 1 ? ` · ${esc(m.code)}` : ""}</b><small>${esc(m.questionnaireType || "Type à préciser")} · <span class="qetat${e === "À compléter" ? " qwarn" : ""}">${e}</span></small></button>`;
  });
  el.innerHTML = html;
}
function formQuestionnaire(el){
  if(!adm.sel){ el.innerHTML = `<div class="state">Choisissez un questionnaire dans la liste pour y déposer le document ou le lien, ou ajoutez-en un.</div>`; return; }
  if(adm.sel === "new"){
    const opts = DOMAINES.map(d => `<optgroup label="${esc(d.nom)}">${(RAW.formations || []).filter(f => f.domaine === d.id).flatMap(f => (f.modules || []).filter(m => !aQuestionnaire(m)).map(m => `<option value="${esc(f.id + "|" + m.code)}"${adm.qPre === f.id ? " selected" : ""}>${esc(f.nom)}${(f.modules || []).length > 1 ? " · " + esc(m.code) : ""}</option>`)).join("")}</optgroup>`).join("");
    el.innerHTML = `<div class="form"><h2>Ajouter un questionnaire de positionnement</h2><div class="fgrid">
      ${field("Formation ou module *", `<select class="inp" id="qfm"><option value="">Choisir…</option>${opts}</select>`, true)}</div>
      <p class="fhint">${adm.qPre ? "Cette formation n'a pas encore de questionnaire : enregistrez pour l'ajouter, puis déposez le document." : "Ensuite, vous pourrez déposer le document ou indiquer le lien."}</p>${formActions(false)}</div>`;
    adm.qPre = "";
    el.querySelector(".actions").addEventListener("click", async e => {
      const a = e.target.closest("[data-act]")?.dataset.act; if(!a) return;
      if(a === "cancel"){ adm.sel = null; renderAdmin(true); return; }
      const v = $("qfm").value; if(!v) return setMsg("Choisissez une formation ou un module.");
      const [fid, code] = [v.slice(0, v.indexOf("|")), v.slice(v.indexOf("|") + 1)], rf = rawF(fid);
      const modules = rf.modules.map(m => m.code === code ? Object.assign({}, m, { questionnaire: true, positionnement: m.positionnement || "Questionnaire de positionnement " + rf.nom }) : m);
      await write(() => db.doc("formations/" + fid).update({ modules }), "Questionnaire ajouté", () => { adm.sel = qKey(fid, code); });
    });
    return;
  }
  const it = qModules().find(x => x.k === adm.sel);
  if(!it){ el.innerHTML = `<div class="state" data-qwait="1">Chargement…</div>`; return; }
  const { f, m, k } = it, cur = (RAW.questionnaires || []).find(q => q.id === k) || {};
  const autres = (RAW.formations || []).filter(o => o.id !== f.id).flatMap(o => (o.modules || []).filter(x => x.titre && norm(x.titre) === norm(m.titre || "")).map(x => o.nom + (o.modules.length > 1 ? " · " + x.code : "")));
  el.innerHTML = `<div class="form"><h2>${esc(f.nom)}${(f.modules || []).length > 1 ? " · " + esc(m.code) : ""}</h2>
    <p class="fhint">${esc(m.titre || "")}</p>
    <div class="fgrid">
      ${field("Nom du questionnaire", inp("qNom", m.positionnement || "", "ex. Questionnaire de positionnement AutoCAD"))}
      ${field("Type de document", `<input class="inp" id="qType" list="qTypes" value="${esc(m.questionnaireType || "")}" placeholder="ex. Formulaire PDF">`)}
      <div class="field full"><span>Document déposé <small class="fhint">— PDF, Excel ou Word ; visible seulement par les personnes connectées</small></span>
        <div class="qdrop" id="qDrop">${cur.fichier ? `<span class="qcur"><b>${esc(cur.fichier.nom || "document")}</b> <button type="button" class="btn small" data-qf="${esc(k)}">Télécharger</button> <button type="button" class="btn small danger" id="qRm">Retirer</button></span>` : `<span class="fhint">Aucun document pour l'instant.</span>`}
          <label class="btn small" for="qFile">${cur.fichier ? "Remplacer le document" : "Choisir un document…"}</label><input type="file" id="qFile" accept=".pdf,.xlsx,.xls,.xlsm,.docx,.doc" hidden><span id="qFileNom" class="fhint"></span>
          <span class="fhint">ou glissez-déposez le fichier ici.</span></div></div>
      ${field("Ou lien (URL) — SharePoint, Teams, Forms…", inp("qLien", cur.lien || "", "https://…"), true)}
    </div>
    ${autres.length ? `<p class="fhint">Même module dans : ${esc(autres.join(" ; "))}. Le document et le lien y seront reportés.</p>` : ""}
    ${formActions(true).replace(">Supprimer<", ">Retirer le questionnaire<")}</div>`;
  let fichier = null, retire = false;
  el.dataset.dirty = ""; el.oninput = el.onchange = () => { el.dataset.dirty = "1"; };
  const pick = file => { if(!file) return; fichier = file; el.dataset.dirty = "1"; $("qFileNom").textContent = "Nouveau : " + file.name; };
  $("qFile").onchange = e => pick(e.target.files[0]);
  const drop = $("qDrop");
  drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); pick(e.dataTransfer.files[0]); });
  if($("qRm")) $("qRm").onclick = () => { retire = true; $("qRm").closest(".qcur").hidden = true; $("qFileNom").textContent = "Le document sera retiré à l'enregistrement."; };
  el.querySelector(".actions").addEventListener("click", async e => {
    const a = e.target.closest("[data-act]")?.dataset.act; if(!a) return;
    if(a === "cancel"){ adm.sel = null; renderAdmin(true); return; }
    const rf = rawF(f.id);
    if(a === "del") return askConfirm(`Retirer le questionnaire de « ${f.nom}${(f.modules || []).length > 1 ? " · " + m.code : ""} » (document et lien compris) ?`, async () => {
      await qEnregistrer(f.id, [{ code: m.code, off: true }]);
      await db.doc("formations/" + f.id).update({ modules: rf.modules.map(x => { if(x.code !== m.code) return x; const n = Object.assign({}, x); ["questionnaire", "questionnaireType", "positionnement", "positionnementLien"].forEach(c => delete n[c]); return n; }) });
      adm.sel = null; toast("Questionnaire retiré");
    }, "Retirer", null);
    const lien = $("qLien").value.trim();
    if(lien && !safeUrl(lien)) return setMsg("Le lien doit commencer par https://");
    if(fichier && fichier.size > (SB ? 10e6 : 600e3)) return setMsg(`Document trop lourd (${SB ? "10 Mo" : "600 Ko"} au maximum). Utilisez plutôt un lien.`);
    const nom = $("qNom").value.trim(), type = $("qType").value.trim();
    await write(async () => {
      await db.doc("formations/" + f.id).update({ modules: rf.modules.map(x => { if(x.code !== m.code) return x; const n = Object.assign({}, x, { questionnaire: true }); if(nom) n.positionnement = nom; else delete n.positionnement; if(type) n.questionnaireType = type; else delete n.questionnaireType; return n; }) });
      await qEnregistrer(f.id, [{ code: m.code, lien, fichier, retire }]);
      for(const o of (RAW.formations || []).filter(o => o.id !== f.id)) for(const x of (o.modules || [])) if(x.titre && norm(x.titre) === norm(m.titre || "")) await qCopier(f.id, m.code, o.id, x.code);
    }, "Enregistré", () => { el.dataset.dirty = ""; });
  });
}

    const gros = qSaisie.find(x => x.fichier && x.fichier.size > (SB ? 10e6 : 600e3));

      const rd = rawD(cible), om = (rd && rd.ordreModules) || [], add = modules.map(m => m.code).filter(c => !om.includes(c));

      /* report des dates, tarifs, positionnement et CPF dans les autres parcours contenant le même module */
      for(const o of (RAW.formations || []).filter(x => x.id !== id && Array.isArray(x.modules))){
        let touche = false;
        const mm = o.modules.map(om => {
          const src = modules.find(m => m.titre && norm(m.titre) === norm(om.titre || ""));
          if(!src) return om;
          const n = Object.assign({}, om); INFO_KEYS.forEach(k => { if(src[k] !== undefined) n[k] = src[k]; else delete n[k]; });
          if(JSON.stringify(n) !== JSON.stringify(om)){ touche = true; return n; }

        for(const om of o.modules){ const src = modules.find(m => m.titre && norm(m.titre) === norm(om.titre || "")); if(src) await qPoser(o.id, om.code, qFin[src.code] || null); }

    if(ok && reportes) toast(`Enregistré · reporté dans ${reportes} autre${reportes>1?"s":""} parcours`);
    if(ok && pilRep) toast(`Enregistré · saisies du Pilotage reportées sur ${pilRep} nouvelle${pilRep > 1 ? "s" : ""} date${pilRep > 1 ? "s" : ""}`);
    if(ok && change && used.length) toast(`Enregistré · retiré de ${used.length} profil${used.length>1?"s":""} de l'ancien domaine`);
  });
}

/* enregistre le lien et le document de chaque module (collection « questionnaires ») */
async function qEnregistrer(fid, saisies){
  const fin = {};
  for(const x of saisies){
    const k = qKey(fid, x.code), cur = (RAW.questionnaires || []).find(d => d.id === k);
    fin[x.code] = null;
    if(x.off){ if(cur) await db.doc("questionnaires/" + k).delete(); continue; }
    let fichier = cur && cur.fichier && !x.retire ? cur.fichier : (x.repris || null);
    if(cur && cur.fichier && x.retire && cur.fichier.chemin && SB) await SB.storage.from("questionnaires").remove([cur.fichier.chemin]);
    if(x.fichier){
      if(SB){
        const chemin = k + "/" + x.fichier.name.replace(/[^\w.-]/g, "_");
        const { error } = await SB.storage.from("questionnaires").upload(chemin, x.fichier, { upsert: true, contentType: x.fichier.type || undefined });
        if(error) throw { code: "invalid_argument" };
        fichier = { nom: x.fichier.name, chemin };
      } else {
        const contenu = await new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = ko; r.readAsDataURL(x.fichier); });
        fichier = { nom: x.fichier.name, contenu };
      }
    }
    const data = {}; if(x.lien) data.lien = x.lien; if(fichier) data.fichier = fichier;
    if(!Object.keys(data).length){ if(cur) await db.doc("questionnaires/" + k).delete(); continue; }
    fin[x.code] = data;
    if(JSON.stringify(data) !== JSON.stringify(cur ? { lien: cur.lien, fichier: cur.fichier } : null)) await db.doc("questionnaires/" + k).set(data);
  }
  return fin;
}
/* pose dans un autre parcours le lien et le document qui viennent d'être enregistrés (sans relire une base pas encore à jour) */
async function qPoser(fid2, code2, data){
  const b = qDoc(fid2, code2), k = qKey(fid2, code2);
  const db_ = b ? Object.assign({}, b) : null; if(db_) delete db_.id;
  if(JSON.stringify(data || null) === JSON.stringify(db_)) return;
  if(data) await db.doc("questionnaires/" + k).set(data); else if(b) await db.doc("questionnaires/" + k).delete();
}
/* même module dans un autre parcours : même lien, même document */
async function qCopier(fid, code, fid2, code2){
  const a = qDoc(fid, code), b = qDoc(fid2, code2), k = qKey(fid2, code2);
  const da = a ? Object.assign({}, a) : null; if(da) delete da.id;
  const db_ = b ? Object.assign({}, b) : null; if(db_) delete db_.id;
  if(JSON.stringify(da) === JSON.stringify(db_)) return;
  if(da) await db.doc("questionnaires/" + k).set(da); else await db.doc("questionnaires/" + k).delete();
}
