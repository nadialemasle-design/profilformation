<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assistant d'entretien IA métier</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Mise en page compacte, pensée pour tenir sur un écran : en-tête sur une ligne ; profils à gauche ; parcours en colonnes à droite.
   Repères : bleu CCI = structure et navigation ; vert clair = ce qui différencie (pourquoi ce parcours, module propre au parcours, le plus adapté). */
:root{
  --bg:#F5F8FB; --surface:#FFFFFF; --sunk:#EDF2F7; --line:#D3DCE6;
  --fg:#14212B; --muted:#516170;
  --blue:#00519E; --blue-ink:#00427F; --blue-soft:#E4EEF8; --on-blue:#FFFFFF;
  --green:#2E6B1E; --green-mid:#7CC04B; --green-soft:#E8F5DF;
  --absent:#F1F3F5;
  --orange:#C2410C; --orange-soft:#FDEBDD;
  --font-body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1620; --surface:#15202B; --sunk:#1B2834; --line:#2C3B4A; --fg:#E3EAF1; --muted:#9DADBD;
  --blue:#2F7BD0; --blue-ink:#8DBDF0; --blue-soft:#17304A; --on-blue:#FFFFFF;
  --green:#A6DB82; --green-mid:#7CC04B; --green-soft:#1E3318; --absent:#1A242E; --orange:#F59E5B; --orange-soft:#3A2414; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1620; --surface:#15202B; --sunk:#1B2834; --line:#2C3B4A; --fg:#E3EAF1; --muted:#9DADBD;
  --blue:#2F7BD0; --blue-ink:#8DBDF0; --blue-soft:#17304A; --on-blue:#FFFFFF;
  --green:#A6DB82; --green-mid:#7CC04B; --green-soft:#1E3318; --absent:#1A242E; --orange:#F59E5B; --orange-soft:#3A2414; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45;margin:0}
.wrap{max-width:1680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 24px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px;padding-bottom:12px;margin-bottom:12px;border-bottom:3px solid var(--blue)}
.brand{display:flex;flex-direction:column;min-width:0}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-ink)}
h1{font-size:22px;line-height:1.2;margin:0;font-weight:700;text-wrap:balance}
.domains{display:flex;flex-wrap:wrap;gap:6px}
.dom{font:inherit;font-weight:600;font-size:14px;border:1px solid var(--blue);background:var(--surface);color:var(--blue-ink);padding:7px 14px;border-radius:999px;cursor:pointer;min-height:38px}
.dom:hover{background:var(--blue-soft)}
.dom[aria-pressed="true"]{background:var(--blue);color:var(--on-blue)}

.grid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);max-height:calc(100vh - 16px);overflow:auto;padding-right:4px}
@media (max-width:900px){.side{position:static;max-height:none;overflow:visible}}
.searchlab{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.search{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.group-old h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-ink);margin:0 0 5px;font-weight:700;padding-left:8px;border-left:3px solid var(--blue)}
.profiles{display:flex;flex-direction:column;gap:4px}
.prof{font:inherit;font-size:13.5px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:7px;padding:7px 10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:40px}
.prof:hover{border-color:var(--blue)}
.prof[aria-pressed="true"]{border-color:var(--blue);background:var(--blue);color:var(--on-blue)}
.prof span{font-weight:500;line-height:1.3}
.count{flex:none;font-family:var(--font-mono);font-size:11.5px;font-weight:500;color:var(--green);background:var(--green-soft);border-radius:999px;padding:0 7px;font-variant-numeric:tabular-nums}
.prof[aria-pressed="true"] .count{background:var(--green-mid);color:#10260A}
button:focus-visible,.search:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.none{color:var(--muted);font-size:14px}

.result{display:flex;flex-direction:column;gap:7px;min-width:0}
.head{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:var(--r);padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 28px;align-items:flex-start}
.head .who{flex:1 1 300px;min-width:0}
.head .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-ink);font-weight:700}
.head .name{font-size:18px;font-weight:700;line-height:1.25;margin:1px 0 2px;text-wrap:balance}
.facts{flex:1 1 300px;display:flex;flex-direction:column;gap:4px;margin:0;min-width:0;font-size:13.5px}
.facts div{display:grid;grid-template-columns:128px minmax(0,1fr);gap:8px}
@media (max-width:480px){.facts div{grid-template-columns:minmax(0,1fr);gap:0}}
.facts dt{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue-ink);padding-top:2px}
.facts dd{margin:0}
.note{font-size:12.5px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px;border:1px solid var(--line)}
.legend .lg-why{background:var(--green-soft);border-color:var(--green-mid)}
.legend .lg-spec{background:var(--green-soft);border-left:3px solid var(--green-mid)}
.legend .lg-com{background:var(--surface)}
.legend .lg-abs{background:var(--absent)}

.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.cmp{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed}
.cmp col.rowh{width:92px}
.cmp th,.cmp td{text-align:left;vertical-align:top;padding:7px 10px;border-bottom:1px solid var(--line);font-size:13.5px}
.cmp tr:last-child th,.cmp tr:last-child td{border-bottom:none}
.cmp td,.cmp thead th + th{border-left:1px solid var(--line)}
.cmp thead th{background:var(--blue);color:var(--on-blue);vertical-align:top}
.cmp thead th:first-child{background:var(--blue-ink)}
.cmp thead .pname{font-size:14.5px;font-weight:700;line-height:1.25;display:block}
.cmp thead .pint{font-size:11.5px;opacity:.85;font-weight:400;display:block;margin-top:2px;line-height:1.35}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.pill{font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;background:rgba(255,255,255,.18);color:var(--on-blue)}
.pill.best{background:var(--green-mid);color:#10260A}
.cmp tbody th{font-weight:600;font-size:12px;color:var(--blue-ink);background:var(--blue-soft);position:sticky;left:0;z-index:1}
.code{font-family:var(--font-mono);font-size:11.5px;color:var(--on-blue);background:var(--blue);border-radius:5px;padding:1px 6px;white-space:nowrap}
.mt{display:block;font-size:11.5px;color:var(--muted);margin-bottom:2px;line-height:1.3}
.cmp td.why{background:var(--green-soft);font-weight:600;color:var(--fg)}
.cmp td.spec{background:var(--green-soft);box-shadow:inset 3px 0 0 var(--green-mid)}
.cmp td.spec .mt{color:var(--green)}
.cmp td.abs{background:var(--absent);color:var(--muted);font-size:12px;padding-block:4px;vertical-align:middle}
.cmp td.all{text-align:center}
.cmp .mt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp td.all .mt{display:block}
.cmp tr.whyrow th{background:var(--green-soft);color:var(--green)}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-5px;margin-right:6px}
.dom .ic{width:22px;height:22px;vertical-align:-6px;margin-right:8px}
.pill .ic{width:15px;height:15px;vertical-align:-3px;margin-right:4px}
.mt .ic{width:18px;height:18px;vertical-align:-5px;margin-right:5px}
.need{display:flex;gap:4px;align-items:flex-start}.need .ic{width:20px;height:20px;margin-top:0;color:var(--blue-ink)}
.facts dt{white-space:nowrap}.facts dt .ic{width:18px;height:18px;vertical-align:-5px}
.rh{display:flex;flex-direction:column;gap:2px;align-items:flex-start}.rh .ic{width:26px;height:26px}
.cmp td.why::before{content:"";}
.cmp td.abs .ic{width:18px;height:18px;vertical-align:-5px}

.lg{display:inline-flex;align-items:center;font-size:12.5px}
.lg.g .ic{color:var(--green)}.lg.b .ic{color:var(--blue-ink)}
.lg .ic{width:24px;height:24px;padding:2px;border-radius:5px}
.lg.g .ic{background:var(--green-soft)}.lg.b .ic{background:var(--blue-soft)}
/* Repère orange : chaque icône et le titre qui l'accompagne. */
.head .lab,.head .lab .ic,.need .ic,.nlab,.facts dt,.facts dt .ic{color:var(--orange)}
.nlab{font-weight:700;font-size:12.5px}
.cmp tr.whyrow th,.cmp tr.whyrow th .ic{color:var(--orange)}
.mt .ic,.cmp td.abs .ic{color:var(--orange)}
.lg,.lg.g .ic,.lg.b .ic,.lg .ic{color:var(--orange)}
.lg.g .ic,.lg.b .ic,.lg .ic{background:var(--orange-soft)}
.lg{font-weight:600}
.cmp thead th.cnt{text-align:center;vertical-align:middle}
.cnt .num{display:block;font-size:34px;font-weight:700;line-height:1;color:var(--green-mid);font-variant-numeric:tabular-nums}
.cnt .cl{display:block;font-size:13px;font-weight:700;line-height:1.2;margin-top:4px}
details.group{border-radius:8px}
details.group summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:var(--blue-soft);color:var(--blue-ink);font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;min-height:40px;border-left:4px solid var(--blue)}
details.group summary::-webkit-details-marker{display:none}
details.group summary:hover{background:var(--line)}
details.group summary:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
details.group .sum{flex:1;min-width:0;line-height:1.3}
.ccount{flex:none;font-family:var(--font-mono);font-size:11.5px;letter-spacing:0;background:var(--surface);color:var(--blue-ink);border-radius:999px;padding:0 7px}
.chev{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
details.group[open] .chev{transform:rotate(180deg)}
details.group .profiles{padding:6px 0 4px 6px}
/* Modules communs : même vert que les modules propres. */
.cmp td.all{background:var(--green-soft);box-shadow:inset 3px 0 0 var(--green-mid)}
.cmp td.all .mt{color:var(--green)}
/* Toute case de module présent : même vert ; seules les cases « Non inclus » restent grises. */
.cmp tbody td:not(.abs):not(.why){background:var(--green-soft);box-shadow:inset 3px 0 0 var(--green-mid)}
.cmp tbody td:not(.abs):not(.why) .mt{color:var(--green)}
/* Dates, tarifs, positionnement, CPF sous chaque module */
.minfo{display:flex;flex-direction:column;gap:2px;margin-top:6px;padding-top:5px;border-top:1px dashed var(--line);font-size:12px;line-height:1.35;color:var(--muted);text-align:left}
.minfo .ml{display:flex;gap:2px;align-items:flex-start}
.minfo .ic{width:15px;height:15px;margin:1px 4px 0 0;vertical-align:0}
.minfo b{color:var(--fg);font-weight:600}
.minfo .dates{color:var(--fg)}
.minfo .none{font-style:italic}
.minfo .pos,.minfo .pos b{color:var(--orange)}
.minfo a{color:inherit;text-decoration:underline}
.pill.tp{background:var(--green-mid);color:#10260A}
.ccard .minfo{margin-top:3px}
.mextra{grid-column:1/-1;border:1px solid var(--line);border-radius:7px;padding:5px 9px;background:var(--sunk)}
.mextra summary{cursor:pointer;font-size:12.5px;color:var(--blue-ink);font-weight:600}
.mextra .fgrid{margin-top:8px}
.mextra textarea.inp{min-height:70px}
/* ===== Front office (trame) : en-tête en 3 zones, colonnes de parcours, modules alignés ===== */
:root{--teal:#3F8F7D;--teal-soft:#E6F3EF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--teal:#6FBFAE;--teal-soft:#16302B}}
:root[data-theme="dark"]{--teal:#6FBFAE;--teal-soft:#16302B}
.fo-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,1fr);gap:10px}
.fo-head.nofacts{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}
.fo-box{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1.5px solid var(--orange);border-radius:14px;padding:10px 14px;min-width:0;line-height:1.4}
.fo-box > span:last-child{min-width:0}
.fo-hic{flex:none;padding-right:10px;border-right:1.5px solid var(--orange);color:var(--orange);align-self:stretch;display:flex;align-items:center}
.fo-hic .ic{width:24px;height:24px;margin:0}
.fo-lab{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--orange)}
.fo-name{display:block;font-size:17px;line-height:1.25;text-wrap:balance}
.fo-box small{display:block;color:var(--muted);font-size:12px}
.fo-facts{flex-direction:column;gap:6px;font-size:13px}
.fo-fl{display:flex;gap:8px;align-items:flex-start}.fo-fl .ic{color:var(--orange);margin:2px 0 0}
.fo-count{flex-wrap:wrap;margin:14px 0 8px;font-size:15px;font-weight:700;color:var(--blue-ink);display:flex;align-items:baseline;gap:6px}
.fo-count .num{font-size:26px;line-height:1;color:var(--green-mid);background:var(--blue);border-radius:8px;padding:2px 10px}
.fo-count small{font-weight:500;color:var(--muted);font-size:13px}
.fo-grid{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:14px 12px;align-items:stretch}
.fo-card{position:relative;border-radius:14px;min-width:0}
/* pointillés reliant les zones d'un même parcours */
.fo-card:not(.fo-parc)::before{content:"";position:absolute;left:50%;top:-14px;height:14px;border-left:2px dashed var(--blue);opacity:.55}
.fo-parc{background:var(--blue);color:var(--on-blue);padding:12px 14px;display:flex;flex-direction:column;gap:8px;justify-content:space-between}
.fo-parc h3{margin:0;font-size:16px;line-height:1.25}
.fo-parc p{margin:3px 0 0;font-size:12.5px;opacity:.9;line-height:1.35}
.fo-best{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;background:var(--green-mid);color:#10260A;border-radius:999px;padding:1px 9px;margin-bottom:5px}
.fo-best .ic{width:14px;height:14px;margin-right:4px}
.fo-tags{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:12px;font-weight:600}
.fo-tags .ic{width:15px;height:15px;vertical-align:-3px;margin-right:4px}
.fo-tarifs{align-self:flex-end;background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 14px;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 6px;font-size:12px}
.fo-tarifs b{font-size:15px;color:var(--blue-ink)}
.fo-tarifs small{color:var(--muted)}
.fo-cpf{flex-basis:100%;text-align:right;font-weight:700;color:var(--green)}
.fo-why{background:var(--blue-soft);border:1.5px solid var(--blue);display:flex;gap:10px;padding:10px 14px;font-weight:600}
.fo-why .fo-ic{flex:none;color:var(--orange);padding-right:10px;border-right:1.5px solid var(--blue);display:flex;align-items:center}
.fo-why .fo-ic .ic{margin:0}
.fo-why .fo-lab{color:var(--blue-ink)}
.fo-mod{display:grid;grid-template-columns:76px minmax(0,1fr);border:1.5px solid var(--teal);background:var(--surface);overflow:hidden}
.fo-tab{background:var(--teal);display:flex;align-items:center;justify-content:center;padding:8px 4px}
.fo-tab .code{background:transparent;color:#fff;font-size:12.5px;white-space:normal;text-align:center;padding:0}
.fo-mbody{padding:9px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.fo-mlab{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--teal)}
.fo-mlab .ic{width:15px;height:15px;vertical-align:-3px;margin-right:4px}
.fo-mt{font-size:12.5px;color:var(--teal);font-weight:600;line-height:1.35}
.fo-mt .mlink{color:inherit}
.fo-arg{font-size:14px}
.fo-commun{background:var(--teal-soft)}
.fo-abs{border:1.5px dashed var(--line);background:var(--absent);color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:8px;padding:8px 12px}
.fo-abs .code{background:var(--muted)}
.fo-compl{margin-top:16px;border:1.5px solid var(--orange);border-radius:14px;background:var(--surface);padding:10px 14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.fo-compl h3{margin:0;font-size:11.5px;line-height:1.3;letter-spacing:.06em;text-transform:uppercase;color:var(--orange);display:flex;align-items:center}
.fo-ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.fo-ccard{border:1.5px solid var(--orange);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;gap:2px;font-size:13px;min-width:0}
.fo-ccard .cmeta{font-size:12px;color:var(--muted)}
.fo-ccard .cmeta .ic{width:13px;height:13px;vertical-align:-2px;margin-right:3px}
.fo-ccard .minfo{margin-top:4px}
@media (max-width:900px){
  .fo-head,.fo-head.nofacts{grid-template-columns:minmax(0,1fr)}
  .fo-grid{display:flex;flex-direction:column}
  .fo-grid > .fo-card{order:var(--o)}
  .fo-compl{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:900px){.fo-card:not(.fo-parc)::before{display:none}}
.fo-abs{align-self:start}
.fo-grid[style*="--n:3"] .fo-mod,.fo-grid[style*="--n:4"] .fo-mod{grid-template-columns:56px minmax(0,1fr)}
.fo-grid[style*="--n:3"] .fo-commun,.fo-grid[style*="--n:4"] .fo-commun{grid-template-columns:76px minmax(0,1fr)}
@media (max-width:900px){.fo-abs{display:none}.fo-mod,.fo-grid .fo-mod{grid-template-columns:52px minmax(0,1fr)}}

/* --- version compacte --- */
.fo-head{gap:8px}
.fo-box{padding:6px 12px;border-radius:12px;gap:8px;font-size:13px;line-height:1.35}
.fo-hic{padding-right:8px}.fo-hic .ic{width:20px;height:20px}
.fo-name{font-size:15.5px;display:inline}
.fo-box small{display:inline;margin-left:6px}
.fo-box .fo-lab{font-size:10.5px}
.fo-facts{gap:2px;font-size:12px}
.fo-facts .fo-lab{display:inline;margin-right:4px}
.fo-count{margin:10px 0 6px;font-size:14px}.fo-count .num{font-size:20px;padding:1px 8px}
.fo-grid{gap:10px}
.fo-card:not(.fo-parc)::before{top:-10px;height:10px}
.fo-parc{padding:9px 12px;gap:6px;border-radius:12px}
.fo-parc h3{font-size:15px}
.fo-parc p{font-size:12px;margin-top:1px}
.fo-tags{margin-top:4px}
.fo-pfoot{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.fo-parc .fo-why{display:flex;gap:6px;align-items:flex-start;background:rgba(255,255,255,.14);border:0;border-radius:8px;padding:5px 8px;font-size:12.5px;font-weight:500;line-height:1.35}
.fo-parc .fo-why .ic{width:16px;height:16px;margin:1px 0 0;color:var(--green-mid);flex:none}
.fo-parc .fo-why b{font-weight:700}
.fo-tarifs{flex:none;padding:4px 12px}
.fo-mod{border-radius:12px}
.fo-mbody{padding:7px 12px;gap:2px}
.fo-arg{font-size:13.5px;line-height:1.4}

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="eyebrow">Aide à l'entretien prospect</div>
      <h1>Quel profil, quelles formations ?</h1>
    </div>
    <div class="topright">
      <button type="button" class="btn small" id="loginBtn" hidden>Connexion</button>
      <div class="views" id="views" hidden>
        <button type="button" class="vbtn" data-view="consult" aria-pressed="true">Consulter</button>
        <button type="button" class="vbtn" data-view="admin" aria-pressed="false">Gestion</button>
      </div>
    </div>
  </header>

  <form class="loginbox" id="loginForm" hidden>
    <label class="field" for="lEmail">E-mail<input class="inp" id="lEmail" type="email" autocomplete="username" required></label>
    <label class="field" for="lPass">Mot de passe<input class="inp" id="lPass" type="password" autocomplete="current-password" required></label>
    <button type="submit" class="btn primary">Se connecter</button>
    <button type="button" class="btn" id="lCancel">Annuler</button>
    <span class="msg" id="lMsg" role="status"></span>
  </form>
  <p class="notice" id="notice" hidden></p>
  <div id="consult">
    <div class="grid">
      <div class="side">
        <div class="sidebox">
          <span class="sidetit">Parcourir</span>
          <label class="searchlab" for="domSel">Domaine de formation
            <select class="search domsel" id="domSel"></select>
          </label>
          <label class="searchlab" for="catSel">Catégorie de profils
            <select class="search" id="catSel"><option value="">Toutes les catégories</option></select>
          </label>
        </div>
        <div class="sidebox">
          <span class="sidetit">Rechercher</span>
          <label class="searchlab" for="q">Un métier, un besoin, un mot-clé
            <input class="search" id="q" type="search" placeholder="ex. auto-entrepreneur, restaurateur, recrutement">
          </label>
          <div class="scope" id="scope" role="group" aria-label="Où chercher">
            <span class="scopelab">Chercher dans</span>
            <button type="button" class="scbtn" data-scope="tous" aria-pressed="true">Tous les domaines</button>
            <button type="button" class="scbtn" data-scope="domaine" aria-pressed="false">Le domaine choisi</button>
          </div>
        </div>
        <div id="groups" class="profgroups"></div>
      </div>
      <section class="result" id="detail" aria-live="polite"><div class="state">Chargement des profils…</div></section>
    </div>
  </div>

  <section id="admin" hidden>
    <div class="adm-bar">
      <label for="admDom">Domaine <select id="admDom"></select></label>
      <div class="subtabs" id="admTabs">
        <button type="button" class="stab" data-tab="profils" aria-pressed="true">Sous-profils</button>
        <button type="button" class="stab" data-tab="categories" aria-pressed="false">Catégories de profils</button>
        <button type="button" class="stab" data-tab="formations" aria-pressed="false">Formations &amp; parcours</button>
        <button type="button" class="stab" data-tab="domaine" aria-pressed="false">Domaine</button>
      </div>
      <button type="button" class="btn add" id="admNewDom">+ Nouveau domaine</button>
    </div>
    <div class="adm-grid">
      <div class="adm-list" id="admList"></div>
      <div id="admForm"></div>
    </div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
/* Base en ligne Supabase : adresse du projet et clé PUBLIQUE (faite pour être visible). Ne jamais mettre ici une clé secrète. */
window.SUPABASE_CONFIG = { url: "https://epwghwvqdeirtnigyajj.supabase.co", key: "sb_publishable_uDtOb7vtKPo5DZbT7LB9GQ_Ld7v-FCZ" };
</script>
<!-- Copie de secours du contenu, utilisée seulement si la base ne répond pas -->
<script src="contenu.js"></script>
<script>
/* =====================================================================
   Les contenus (domaines, parcours, profils) sont dans la base de données
   partagée de l'application. Ils se modifient dans l'onglet « Gestion ».
   Collections : domaines, formations (= parcours), profils.
   ===================================================================== */
const ICONS = {
  why: '<path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/>',
  besoin: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  profil: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  euro: '<path d="M18 7a7 7 0 1 0 0 10"/><path d="M4 10h9M4 14h9"/>',
  certif: '<circle cx="12" cy="8" r="6"/><path d="M8.5 13.5 7 22l5-3 5 3-1.5-8.5"/>',
  star: '<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9z"/>',
  commun: '<path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>',
  plus: '<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
  moins: '<circle cx="12" cy="12" r="9"/><path d="M8 12h8"/>',
  duree: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  modules: '<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>',
  ia: '<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
  rs: '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/>',
  ext: '<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
  cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  pos: '<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3h6v1M9 12l2 2 4-4"/>',
  domaine: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>'
};
const ic = n => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ICONS.domaine}</svg>`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const slug = s => norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60) || "x";
const byOrdre = (a,b) => (a.ordre ?? 1e9) - (b.ordre ?? 1e9) || String(a.nom||"").localeCompare(String(b.nom||""), "fr");
const $ = id => document.getElementById(id);

/* ---------- Dates (texte), tarifs, positionnement, CPF ---------- */
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
/* sessions à venir : on masque automatiquement celles dont le dernier jour est passé */
const aVenir = m => (Array.isArray(m && m.sessions) ? m.sessions : []).filter(x => x && x.texte && (!x.fin || x.fin >= today()))
  .sort((a,b) => String(a.debut || a.fin || "").localeCompare(String(b.debut || b.fin || "")));
const eur = n => (n === "" || n == null || isNaN(Number(n))) ? "" : Number(n).toLocaleString("fr-FR") + " €";
/* opts.parcours : le module fait partie d'un parcours (plusieurs modules) ; opts.avecM1 : ce parcours contient un module de niveau 1 */
function infoHtml(m, opts){
  if(!m) return "";
  const o = opts || {}, out = [], s = aVenir(m), has = Array.isArray(m.sessions) && m.sessions.length;
  if(has) out.push(`<span class="ml">${ic("cal")}<span>${s.length ? `<b>Prochaines dates :</b> <span class="dates">${s.slice(0, o.max || 99).map(x => esc(x.texte)).join(" · ")}${o.max && s.length > o.max ? " …" : ""}</span>` : `<span class="none">Aucune date à venir</span>`}</span></span>`);

/* Lit une session écrite en texte (ex. « 18-19 et 25-26 janvier 2027 ») pour retrouver son premier et son dernier jour. */
const MOISN = {jan:1,janv:1,janvier:1,fev:2,fevr:2,fevrier:2,mar:3,mars:3,avr:4,avril:4,mai:5,juin:6,juil:7,juillet:7,aout:8,sep:9,sept:9,septembre:9,oct:10,octobre:10,nov:11,novembre:11,dec:12,decembre:12};
function lireSession(t){
  const s = norm(t).replace(/(\d+)\s*(?:er)?\s*au\s*(\d+)/g, (x, a, b) => { const r = []; for(let i = +a; i <= +b && r.length < 31; i++) r.push(i); return r.join(" "); });
  let an = null, pend = [], jours = [];
  (s.match(/\d+|[a-z]+/g) || []).forEach(k => {
    if(/^\d{4}$/.test(k)) an = +k;
    else if(/^\d{1,2}$/.test(k)) pend.push(+k);
    else if(MOISN[k]){ pend.forEach(j => jours.push([MOISN[k], j])); pend = []; }
  });
  if(!jours.length || !an || jours.some(([m, j]) => j < 1 || j > 31)) return null;
  const iso = ([m, j]) => an + "-" + String(m).padStart(2,"0") + "-" + String(j).padStart(2,"0");
  return { texte: String(t).trim(), debut: iso(jours[0]), fin: iso(jours[jours.length - 1]) };
}
const ctxF = f => { const codes = Object.keys(f.modules || {}); return { parcours: codes.length > 1, avecM1: codes.length > 1 && codes.some(c => /^M1\b/i.test(c)) }; };

      id: f.id, nom: f.nom || f.id, intitule: f.intitule || "", duree: f.duree || "", certification: f.certification || "",
      modules: Object.fromEntries((Array.isArray(f.modules) ? f.modules : []).map(m => [m.code, m.titre])),

/* Tarif préférentiel d'un parcours de 3 jours et plus : somme des tarifs « parcours » de ses modules */
function prixParcours(f){
  const mods = Array.isArray(f.modules) ? f.modules : [];
  if(mods.length < 2 || (parseInt(f.duree, 10) || 0) < 3 || !mods.every(m => Number(m.tarifParcours) > 0)) return null;

}

/* coût de certification d'une formation seule ; total CPF si la formation est éligible */

/* pied de module : la prochaine session, le reste (toutes les dates, tarif, CPF, positionnement) dans « Détails » */

  state.pid = b.dataset.pid; save(); renderList(); renderDetail();
  document.querySelector(`.prof[data-pid="${CSS.escape(state.pid)}"]`)?.focus();
  if(window.matchMedia("(max-width:900px)").matches) $("detail").scrollIntoView({behavior:"smooth", block:"start"});
});
$("groups").addEventListener("toggle", e => {
  const el = e.target; if(!el.matches || !el.matches("details.group") || state.q.trim()) return;

}, true);
$("q").addEventListener("input", e => { state.q = e.target.value; renderList(); renderDetail(); });
$("catSel").addEventListener("change", e => { state.cat = e.target.value; renderList(); renderDetail(); });
$("scope").addEventListener("click", e => { const b = e.target.closest("[data-scope]"); if(!b) return; state.scope = b.dataset.scope; renderList(); renderDetail(); });

function toast(msg){ const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2400); }

/* =====================================================================
   GESTION (back office) — réservé aux personnes qui peuvent modifier l'application

const adm = { dom: "", tab: "profils", sel: null, q: "" };
const admDom = () => DOMAINES.find(d => d.id === adm.dom);
const rawP = id => (RAW.profils || []).find(x => x.id === id);
const rawF = id => (RAW.formations || []).find(x => x.id === id);
const rawD = id => (RAW.domaines || []).find(x => x.id === id);

function renderAdmin(resetForm){
  if(!DOMAINES.some(d => d.id === adm.dom)) adm.dom = DOMAINES[0] ? DOMAINES[0].id : "";
  $("admDom").innerHTML = DOMAINES.map(d => `<option value="${esc(d.id)}"${d.id===adm.dom?" selected":""}>${esc(d.nom)}</option>`).join("");
  document.querySelectorAll(".stab").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.tab === adm.tab)));
  renderAdmList();
  if(resetForm) renderAdmForm();
}

function renderAdmList(){
  const d = admDom(), el = $("admList");
  if(!d){ el.innerHTML = `<p class="none">Aucun domaine. Créez-en un avec « + Nouveau domaine ».</p>`; return; }
  if(adm.tab === "domaine"){ el.innerHTML = `<button type="button" class="adm-item" aria-pressed="true"><b>${esc(d.nom)}</b><small>${d.formations.length} parcours · ${d.profils.length} profils</small></button>`; return; }
  if(adm.tab === "categories"){
    el.innerHTML = `<button type="button" class="btn add" data-new="1">+ Nouvelle catégorie</button>` + domCats(d).map(c => {
      const n = d.profils.filter(p => p.categories.includes(c)).length;
      return `<button type="button" class="adm-item" data-sel="${esc(c)}" aria-pressed="${adm.sel===c}"><b>${esc(c)}</b><small>${n} sous-profil${n>1?"s":""}</small></button>`;
    }).join("");
    return;
  }
  if(adm.tab === "formations"){
    el.innerHTML = `<button type="button" class="btn add" data-new="1">+ Nouvelle formation ou parcours</button>` + d.formations.map(f => {
      const n = d.profils.filter(p => p.parcours[f.id]).length;
      return `<button type="button" class="adm-item" data-sel="${esc(f.id)}" aria-pressed="${adm.sel===f.id}"><b>${esc(f.nom)}</b><small>${esc(f.duree)} · ${Object.keys(f.modules).length} modules · ${n} profils</small></button>`;
    }).join("");
    return;
  }
  let html = `<button type="button" class="btn add" data-new="1">+ Nouveau sous-profil</button>`;
  domCats(d).forEach(c => {
    const l = d.profils.filter(p => p.categories.includes(c)); if(!l.length) return;
    html += `<div class="adm-cat">${esc(c)}</div>` + l.map(p => `<button type="button" class="adm-item" data-sel="${esc(p.id)}" aria-pressed="${adm.sel===p.id}"><b>${esc(p.nom)}</b><small>${Object.keys(p.parcours).length} parcours${p.categories.length > 1 ? ` · ${p.categories.length} catégories` : ""}</small></button>`).join("");
  });
  el.innerHTML = html;
}

$("admDom").addEventListener("change", e => { adm.dom = e.target.value; adm.sel = null; renderAdmin(true); });
$("admTabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if(!b) return; adm.tab = b.dataset.tab; adm.sel = adm.tab === "domaine" ? adm.dom : null; renderAdmin(true); });
$("admNewDom").addEventListener("click", () => { adm.tab = "domaine"; adm.sel = "new"; renderAdmin(false); renderAdmForm(); });
$("admList").addEventListener("click", e => {
  const n = e.target.closest("[data-new]"); if(n){ adm.sel = "new"; renderAdmList(); renderAdmForm(); return; }
  const b = e.target.closest("[data-sel]"); if(!b) return; adm.sel = b.dataset.sel; renderAdmList(); renderAdmForm();
});

const field = (label, html, full) => `<label class="field${full?" full":""}">${label}${html}</label>`;
const inp = (id, val, ph) => `<input class="inp" id="${id}" value="${esc(val)}"${ph?` placeholder="${esc(ph)}"`:""}>`;
const ta = (id, val, ph, cls) => `<textarea class="inp${cls?" "+cls:""}" id="${id}"${ph?` placeholder="${esc(ph)}"`:""}>${esc(val)}</textarea>`;
const formActions = (canDelete) => `<div class="actions"><button type="button" class="btn primary" data-act="save">Enregistrer</button><button type="button" class="btn" data-act="cancel">Annuler</button>${canDelete?`<button type="button" class="btn danger" data-act="del">Supprimer</button>`:""}<span class="msg" id="fmsg" role="status"></span></div><div id="fconfirm"></div>`;
const setMsg = (t, ok) => { const m = $("fmsg"); if(m){ m.textContent = t; m.className = "msg " + (ok ? "ok" : "err"); } };

function renderAdmForm(){
  const el = $("admForm"), d = admDom();
  el.onclick = null; el.onchange = null;
  if(adm.tab === "domaine" || adm.sel === "new" && adm.tab === "domaine"){ return formDomaine(el); }
  if(!d){ el.innerHTML = ""; return; }
  if(!adm.sel){ el.innerHTML = `<div class="state">Choisissez un élément dans la liste, ou créez-en un nouveau.</div>`; return; }
  if(adm.tab === "formations") return formFormation(el, d);
  if(adm.tab === "categories") return formCategorie(el, d);
  return formProfil(el, d);
}

/* ----- Formulaire domaine ----- */
function formDomaine(el){
  const isNew = adm.sel === "new", r = isNew ? {} : (rawD(adm.dom) || {});
  el.innerHTML = `<div class="form"><h2>${isNew ? "Nouveau domaine" : "Domaine : " + esc(r.nom || adm.dom)}</h2>
    <div class="fgrid">
      ${field("Nom du domaine *", inp("fNom", r.nom || "", "ex. Bureautique"))}
      ${field("Ordre d'affichage", inp("fOrdre", r.ordre ?? "", "1, 2, 3…"))}
      ${field("Financement", ta("fFin", r.financement || "", "ex. Financement possible à partir de 2 jours de formation."), true)}
      ${field("Certification", ta("fCert", r.certification || "", "ex. RS7643 : épreuve de 90 min à distance."), true)}
      ${field("Ordre des lignes de modules (séparés par des virgules)", inp("fMods", (r.ordreModules || []).join(", "), "ex. M1, M2, M3"), true)}
    </div>
    ${formActions(!isNew)}</div>`;
  el.querySelector(".actions").addEventListener("click", async e => {
    const a = e.target.closest("[data-act]")?.dataset.act; if(!a) return;
    if(a === "cancel"){ if(isNew){ adm.tab = "profils"; adm.sel = null; } renderAdmin(true); return; }
    if(a === "del"){
      const d = admDom();
      if(d && (d.formations.length || d.profils.length)){ setMsg("Supprimez d'abord les formations, parcours et profils de ce domaine."); return; }
      return askConfirm(`Supprimer le domaine « ${r.nom} » ?`, async () => { await db.doc("domaines/" + adm.dom).delete(); adm.dom = ""; adm.tab = "profils"; adm.sel = null; toast("Domaine supprimé"); });
    }
    const nom = $("fNom").value.trim(); if(!nom) return setMsg("Le nom du domaine est obligatoire.");
    const id = isNew ? slug(nom) : adm.dom;
    if(isNew && rawD(id)) return setMsg("Un domaine porte déjà ce nom.");
    const ordre = Number($("fOrdre").value) || (isNew ? (RAW.domaines.length + 1) : (r.ordre ?? 99));
    const data = { nom, financement: $("fFin").value.trim(), certification: $("fCert").value.trim(),
      ordreModules: $("fMods").value.split(",").map(s => s.trim()).filter(Boolean), ordre };
    if(Array.isArray(r.categories)) data.categories = r.categories;
    if(r.motsClesCategories) data.motsClesCategories = r.motsClesCategories;
    await write(() => db.doc("domaines/" + id).set(data), "Domaine enregistré", () => { adm.dom = id; adm.sel = id; adm.tab = "domaine"; });
  });
}

/* ----- Formulaire formation ou parcours ----- */
function formFormation(el, d){
  const isNew = adm.sel === "new", r = isNew ? { modules: [] } : (rawF(adm.sel) || { modules: [] });
  const mods = Array.isArray(r.modules) && r.modules.length ? r.modules : [{ code: "Formation", titre: "" }];
  const used = isNew ? [] : d.profils.filter(p => p.parcours[adm.sel]);
  const domCur = r.domaine || d.id;
  const quoi = isNew ? "Nouvelle formation ou parcours" : (mods.length > 1 ? "Parcours : " : "Formation : ") + esc(r.nom);
  el.innerHTML = `<div class="form"><h2>${quoi}</h2>
    <div class="fgrid">
      ${field("Nom de la formation ou du parcours *", inp("fNom", r.nom || "", "ex. Photoshop initiation"))}
      ${field("Domaine de rattachement *", `<select class="inp" id="fDomF">${DOMAINES.map(x => `<option value="${esc(x.id)}"${x.id===domCur?" selected":""}>${esc(x.nom)}</option>`).join("")}</select>`)}
      ${field("Intitulé (sous-titre)", inp("fInt", r.intitule || ""), true)}
      ${field("Durée", inp("fDuree", r.duree || "", "ex. 2 jours"))}
      ${field("Certification (facultatif)", inp("fCertF", r.certification || "", "ex. Tosa, ICDL"))}
      ${field("Coût de la certification, pour le total CPF d'un parcours (€)", inp("fCertPrix", r.tarifCertification ?? "", "ex. 330"))}
      ${field("Référence interne (facultatif)", inp("fRef", r.reference || "", "ex. PAO-1.2 Photo Init"))}
      ${field("Ordre d'affichage", inp("fOrdre", r.ordre ?? ""))}
    </div>
    <div class="fsec"><h3>Modules</h3><p class="fhint">Formation seule : un seul module, avec le code « Formation ». Parcours : un module par code (M1, M2, M2.3…). Ouvrez « Dates, tarifs, positionnement, CPF » sous chaque module pour les compléter. Ces informations sont reportées automatiquement dans les autres parcours qui contiennent le même module (même titre).</p>
      <div id="modLines">${mods.map(modLine).join("")}</div>
      <div><button type="button" class="btn add small" id="addMod">+ Ajouter un module</button></div></div>
    ${!isNew ? `<p class="ro-note">Proposé dans ${used.length} profil${used.length>1?"s":""}.</p>` : ""}
    ${formActions(!isNew)}</div>`;
  $("addMod").onclick = () => $("modLines").insertAdjacentHTML("beforeend", modLine({ code: "", titre: "" }));
  $("modLines").addEventListener("click", e => { if(e.target.closest("[data-rm]")) e.target.closest(".modline").remove(); });
  el.querySelector(".actions").addEventListener("click", async e => {
    const a = e.target.closest("[data-act]")?.dataset.act; if(!a) return;
    if(a === "cancel"){ adm.sel = null; renderAdmin(true); return; }
    if(a === "del") return askConfirm(`Supprimer « ${r.nom} » ?${used.length ? ` Elle sera retirée de ${used.length} profil${used.length>1?"s":""}.` : ""}`, async () => {
      for(const p of used){ const rp = rawP(p.id); await db.doc("profils/" + p.id).update({ parcours: (rp.parcours || []).filter(x => x.formation !== adm.sel) }); }
      for(const rp of (RAW.profils || []).filter(x => (x.complements || []).some(c => c.formation === adm.sel))){ await db.doc("profils/" + rp.id).update({ complements: rp.complements.filter(c => c.formation !== adm.sel) }); }
      await db.doc("formations/" + adm.sel).delete(); adm.sel = null; toast("Supprimé");
    });
    const nom = $("fNom").value.trim(); if(!nom) return setMsg("Le nom est obligatoire.");
    const cible = $("fDomF").value, dc = DOMAINES.find(x => x.id === cible);
    if(!dc) return setMsg("Choisissez le domaine de rattachement.");
    const erreurs = [];
    const modules = [...document.querySelectorAll("#modLines .modline")].map(l => {
      const q = c => l.querySelector(c), m = { code: q(".mc").value.trim(), titre: q(".mtit").value.trim() };
      const u = q(".mlien").value.trim(); if(u) m.lien = u;
      const sessions = q(".mses").value.split("\n").map(t => t.trim()).filter(Boolean).map(t => { const x = lireSession(t); if(!x) erreurs.push(`« ${t} » (${m.code || "module"})`); return x; }).filter(Boolean);
      if(sessions.length) m.sessions = sessions;
      const tarif = Number(q(".mtar").value.replace(/[^\d.,]/g, "").replace(",", ".")), tp = Number(q(".mtp").value.replace(/[^\d.,]/g, "").replace(",", "."));
      if(tarif > 0) m.tarif = tarif;
      if(tp > 0) m.tarifParcours = tp;
      [["positionnement", ".mpos"], ["positionnementLien", ".mposl"], ["cpf", ".mcpf"]].forEach(([k, c]) => { const v = q(c).value.trim(); if(v) m[k] = v; });
      return m;
    }).filter(m => m.code);
    if(erreurs.length) return setMsg("Date illisible : " + erreurs.slice(0, 2).join(" ; ") + ". Écrivez le jour, le mois et l'année, ex. « 18-19 et 25-26 janvier 2027 ».");
    if(!modules.length) return setMsg("Ajoutez au moins un module.");
    if(new Set(modules.map(m => m.code)).size !== modules.length) return setMsg("Deux modules ont le même code.");
    const bad = modules.find(m => m.tarif && m.tarifParcours && m.tarifParcours >= m.tarif);
    if(bad) return setMsg(`Module ${bad.code} : le tarif parcours doit être inférieur au tarif normal.`);
    const id = isNew ? cible + "-" + slug(nom) : adm.sel;
    if(isNew && rawF(id)) return setMsg("Une formation porte déjà ce nom dans ce domaine.");
    const change = !isNew && cible !== (r.domaine || d.id);
    const data = { domaine: cible, nom, intitule: $("fInt").value.trim(), duree: $("fDuree").value.trim(), certification: $("fCertF").value.trim(), modules,
      ordre: Number($("fOrdre").value) || (isNew || change ? dc.formations.length + 1 : (r.ordre ?? 99)) };
    const ref = $("fRef").value.trim(); if(ref) data.reference = ref;
    const cp = Number($("fCertPrix").value.replace(/[^\d.,]/g, "").replace(",", ".")); if(cp > 0) data.tarifCertification = cp;
    let reportes = 0, ok = false;
    await write(async () => {
      await db.doc("formations/" + id).set(data);
      const rd = rawD(cible), om = (rd && rd.ordreModules) || [], add = modules.map(m => m.code).filter(c => !om.includes(c));
      if(add.length) await db.doc("domaines/" + cible).update({ ordreModules: om.concat(add) });
      /* changement de domaine : un parcours de profil doit rester dans le domaine du profil */
      if(change) for(const p of used){ const rp = rawP(p.id); await db.doc("profils/" + p.id).update({ parcours: (rp.parcours || []).filter(x => x.formation !== id) }); }
      /* report des dates, tarifs, positionnement et CPF dans les autres parcours contenant le même module */
      for(const o of (RAW.formations || []).filter(x => x.id !== id && Array.isArray(x.modules))){
        let touche = false;
        const mm = o.modules.map(om => {
          const src = modules.find(m => m.titre && norm(m.titre) === norm(om.titre || ""));
          if(!src) return om;
          const n = Object.assign({}, om); INFO_KEYS.forEach(k => { if(src[k] !== undefined) n[k] = src[k]; else delete n[k]; });
          if(JSON.stringify(n) !== JSON.stringify(om)){ touche = true; return n; }
          return om;
        });
        if(touche){ await db.doc("formations/" + o.id).update({ modules: mm }); reportes++; }
      }
    }, "Enregistré", () => { ok = true; adm.sel = id; if(change){ adm.dom = cible; } });
    if(ok && reportes) toast(`Enregistré · reporté dans ${reportes} autre${reportes>1?"s":""} parcours`);
    if(ok && change && used.length) toast(`Enregistré · retiré de ${used.length} profil${used.length>1?"s":""} de l'ancien domaine`);
  });
}
const modLine = m => `<div class="modline"><input class="inp mc" value="${esc(m.code)}" placeholder="Code" aria-label="Code du module"><input class="inp mtit" value="${esc(m.titre)}" placeholder="Titre du module" aria-label="Titre du module"><button type="button" class="btn small danger" data-rm="1">Retirer</button><input class="inp mlien" value="${esc(m.lien || "")}" placeholder="Lien vers la fiche (https://…)" aria-label="Lien vers la fiche du module">
  <details class="mextra"><summary>Dates, tarifs, positionnement, CPF${(m.sessions||[]).length ? ` · ${aVenir(m).length} date${aVenir(m).length>1?"s":""} à venir` : ""}</summary><div class="fgrid">
    ${field("Dates (une session par ligne, avec l'année)", `<textarea class="inp mses" placeholder="ex. 18-19 et 25-26 janvier 2027&#10;15 avril 2027">${esc((m.sessions || []).map(x => x.texte).join("\n"))}</textarea>`, true)}
    ${field("Tarif (€)", `<input class="inp mtar" inputmode="decimal" value="${esc(m.tarif ?? "")}" placeholder="ex. 780">`)}
    ${field("Tarif dans un parcours (€) — affiché seulement dans un parcours", `<input class="inp mtp" inputmode="decimal" value="${esc(m.tarifParcours ?? "")}" placeholder="ex. 700">`)}
    ${field("Positionnement si pas de niveau 1 (nom du questionnaire)", `<input class="inp mpos" value="${esc(m.positionnement || "")}" placeholder="Laisser vide si aucun">`)}
    ${field("Lien du questionnaire de positionnement", `<input class="inp mposl" value="${esc(m.positionnementLien || "")}" placeholder="https://forms…">`)}
    ${field("Éligibilité CPF", `<input class="inp mcpf" value="${esc(m.cpf || "")}" placeholder="ex. Oui (certification Tosa) ; Non ; Oui, dans un parcours de 4 jours minimum">`, true)}
  </div></details></div>`;

/* ----- Formulaire catégorie de profils ----- */
function formCategorie(el, d){
  const isNew = adm.sel === "new", nomAct = isNew ? "" : adm.sel, toutes = domCats(d);
  const dedans = isNew ? [] : d.profils.filter(p => p.categories.includes(nomAct)), dehors = d.profils.filter(p => !dedans.includes(p));
  const rd = rawD(d.id) || {};
  el.innerHTML = `<div class="form"><h2>${isNew ? "Nouvelle catégorie" : "Catégorie : " + esc(nomAct)}</h2>
    <div class="fgrid">${field("Nom de la catégorie *", inp("fCatNom", nomAct, "ex. Commerce et artisanat"), true)}
      ${field("Mots-clés pour la recherche <small class=\"fhint\">— valent pour tous les sous-profils de la catégorie</small>", ta("fCatMots", ((rd.motsClesCategories || {})[nomAct]) || "", "ex. TPE, PME, gérant, patron, chef d'entreprise"), true)}</div>
    ${isNew ? "" : `<div class="actions" style="border:0;padding:0"><button type="button" class="btn small" data-move="-1">Monter dans la liste</button><button type="button" class="btn small" data-move="1">Descendre dans la liste</button><span class="fhint">Position ${toutes.indexOf(nomAct) + 1} sur ${toutes.length}</span></div>
    <div class="fsec"><h3>Sous-profils de cette catégorie (${dedans.length})</h3>
      <p class="fhint">Pour chaque sous-profil : « Ajouter aussi à… » le met dans une autre catégorie en plus de celle-ci ; « Déplacer vers… » le change de catégorie ; « Retirer d'ici » l'enlève de cette catégorie (possible seulement s'il est aussi ailleurs).</p>
      ${dedans.map(p => `<div class="catrow" data-pid="${esc(p.id)}"><b>${esc(p.nom)}</b><small>${p.categories.filter(c => c !== nomAct).map(esc).join(", ") || "seulement ici"}</small>
        <span class="catacts">
          <select class="inp catplus" aria-label="Ajouter aussi à"><option value="">Ajouter aussi à…</option>${toutes.filter(c => !p.categories.includes(c)).map(c => `<option>${esc(c)}</option>`).join("")}</select>
          <select class="inp catmv" aria-label="Déplacer vers"><option value="">Déplacer vers…</option>${toutes.filter(c => c !== nomAct).map(c => `<option>${esc(c)}</option>`).join("")}</select>
          <button type="button" class="btn small danger" data-out="1"${p.categories.length > 1 ? "" : ` disabled title="Seule catégorie de ce sous-profil : déplacez-le plutôt"`}>Retirer d'ici</button>
          <button type="button" class="btn small" data-edit="1">Ouvrir</button></span></div>`).join("") || `<p class="none">Aucun sous-profil pour l'instant.</p>`}
      <div class="catadd"><select class="inp" id="catAddSel"><option value="">Ajouter un sous-profil existant…</option>${dehors.map(p => `<option value="${esc(p.id)}">${esc(p.nom)} (${esc(p.categories.join(", "))})</option>`).join("")}</select><button type="button" class="btn small" id="catAddBtn">Ajouter</button><button type="button" class="btn add small" id="catNewProf">+ Créer un sous-profil ici</button></div>
    </div>`}
    ${formActions(!isNew)}</div>`;
  const majProfil = async (p, cats) => { await db.doc("profils/" + p.id).update({ categorie: cats[0], categories: cats }); };
  const majOrdre = async (l, mots) => { const u = { categories: l }; if(mots) u.motsClesCategories = mots; await db.doc("domaines/" + d.id).update(u); };
  const motsAvec = (ancien, nouveau, texte) => { const m = Object.assign({}, rd.motsClesCategories || {}); if(ancien && ancien !== nouveau) delete m[ancien]; if(nouveau){ if(texte) m[nouveau] = texte; else delete m[nouveau]; } return m; };
  el.onclick = async e => {
    const mv = e.target.closest("[data-move]");
    if(mv){ const l = toutes.slice(), i = l.indexOf(nomAct), j = i + Number(mv.dataset.move); if(j < 0 || j >= l.length) return; [l[i], l[j]] = [l[j], l[i]]; return write(() => majOrdre(l), "Ordre enregistré", () => {}); }
    const row = e.target.closest(".catrow"), p = row && d.profils.find(x => x.id === row.dataset.pid);
    if(row && e.target.closest("[data-out]")) return write(() => majProfil(p, p.categories.filter(c => c !== nomAct)), "Retiré de la catégorie", () => {});
    if(row && e.target.closest("[data-edit]")){ adm.tab = "profils"; adm.sel = p.id; renderAdmin(true); return; }
    if(e.target.id === "catAddBtn"){ const id = $("catAddSel").value, q = d.profils.find(x => x.id === id); if(!q) return setMsg("Choisissez un sous-profil."); return write(() => majProfil(q, q.categories.concat(nomAct)), "Sous-profil ajouté", () => {}); }
    if(e.target.id === "catNewProf"){ adm.tab = "profils"; adm.sel = "new"; adm.cat = nomAct; renderAdmin(false); renderAdmForm(); return; }
  };
  el.onchange = e => {
    const s = e.target.closest(".catmv, .catplus"); if(!s || !s.value) return;
    const p = d.profils.find(x => x.id === s.closest(".catrow").dataset.pid);
    if(s.classList.contains("catplus")) return write(() => majProfil(p, p.categories.concat(s.value)), `Ajouté aussi à « ${s.value} »`, () => {});
    write(() => majProfil(p, p.categories.map(c => c === nomAct ? s.value : c).filter((c, i, a) => a.indexOf(c) === i)), "Sous-profil déplacé", () => {});
  };
  el.querySelectorAll(".actions").forEach(a => a.addEventListener("click", async e => {
    const act = e.target.closest("[data-act]")?.dataset.act; if(!act) return;
    if(act === "cancel"){ adm.sel = null; renderAdmin(true); return; }
    if(act === "del"){
      if(dedans.length) return setMsg("Déplacez ou retirez d'abord les sous-profils de cette catégorie.");
      return askConfirm(`Supprimer la catégorie « ${nomAct} » ?`, async () => { await majOrdre(toutes.filter(c => c !== nomAct), motsAvec(nomAct, "", "")); adm.sel = null; toast("Catégorie supprimée"); });
    }
    const nom = $("fCatNom").value.trim(); if(!nom) return setMsg("Le nom est obligatoire.");
    if(nom !== nomAct && toutes.includes(nom)) return setMsg("Une catégorie porte déjà ce nom dans ce domaine.");
    const mots = $("fCatMots").value.trim();
    if(isNew) return write(() => majOrdre(toutes.concat(nom), motsAvec("", nom, mots)), "Catégorie créée", () => { adm.sel = nom; });
    if(nom === nomAct) return write(() => majOrdre(toutes, motsAvec(nomAct, nomAct, mots)), "Catégorie enregistrée", () => {});
    await write(async () => {
      for(const p of dedans) await majProfil(p, p.categories.map(c => c === nomAct ? nom : c));
      await majOrdre(toutes.map(c => c === nomAct ? nom : c), motsAvec(nomAct, nom, mots));
    }, "Catégorie renommée", () => { adm.sel = nom; });
  }));
}

    parcours.forEach(x => { const f = d.formations.find(f => f.id === x.formation); if(!f) return;
      if(!x.pourquoi) manque.push(`« Pourquoi » pour ${f.nom}`);
      Object.keys(f.modules).forEach(m => { if(!x.reponses[m] && !reponses[m]) manque.push(`${m} pour ${f.nom}`); }); });

    const complements = [...document.querySelectorAll("#cpRows .cprow")].map(row => ({ formation: row.querySelector("select").value, pourquoi: row.querySelector("input").value.trim() })).filter(c => c.formation);
    const id = isNew ? d.id + "-" + slug(nom) : adm.sel;
    if(isNew && rawP(id)) return setMsg("Un profil porte déjà ce nom dans ce domaine.");
    const maxOrdre = Math.max(0, ...d.profils.map(p => (rawP(p.id) || {}).ordre || 0));

    const data = { domaine: d.id, categorie, categories, motsCles, nom, besoin: $("fBesoin").value.trim(), reponses, parcours, complements,

}

function cpRow(d, c){
  const autres = DOMAINES.filter(x => x.id !== d.id);

function readRow(row){
  const reponses = {};

function askConfirm(text, run){
  $("fconfirm").innerHTML = `<div class="confirm"><span>${esc(text)}</span><button type="button" class="btn danger" id="cYes">Confirmer la suppression</button><button type="button" class="btn" id="cNo">Annuler</button></div>`;
  $("cNo").onclick = () => $("fconfirm").innerHTML = "";
  $("cYes").onclick = () => write(run, null, () => {}).then(() => renderAdmin(true));
}
async function write(fn, okText, after){
  const btns = document.querySelectorAll("#admForm button"); btns.forEach(b => b.disabled = true);
  try{ await fn(); if(after) after(); if(okText){ toast(okText); renderAdmin(true); setMsg(okText, true); } }
  catch(err){
    btns.forEach(b => b.disabled = false);
    const c = err && err.code;
    setMsg(c === "invalid_argument" ? "Enregistrement refusé : vous n'avez pas les droits de modification." :
           c === "quota_exceeded" ? "La base est pleine : supprimez des éléments inutiles." :
           "Enregistrement impossible pour le moment. Réessayez dans un instant.");
  }
}

/* =====================================================================
   PROPOSITION : cases à cocher sur les modules, récapitulatif chiffré, document Word
   ===================================================================== */
const PLAFOND_CPF = 1500, PARTICIPATION_CPF = 150;
const prop = { items: [], exonere: false, ouvert: false };
try{ const x = JSON.parse(localStorage.getItem("proposition-v1") || "null"); if(x && Array.isArray(x.items)){ prop.items = x.items; prop.exonere = !!x.exonere; } }catch(e){}
const propSave = () => { try{ localStorage.setItem("proposition-v1", JSON.stringify({ items: prop.items, exonere: prop.exonere })); }catch(e){} };
const rawFm = (fid, code) => { const f = (RAW.formations || []).find(x => x.id === fid); return f ? { f, m: (f.modules || []).find(y => y.code === code) } : null; };
const propKey = m => norm(m.titre || "");
/* nombre de jours d'une session écrite en texte */
function joursDe(t){
  const s = norm(t || "").replace(/(\d+)\s*(?:er)?\s*au\s*(\d+)/g, (x, a, b) => { const r = []; for(let i = +a; i <= +b && r.length < 31; i++) r.push(i); return r.join(" "); })
    .replace(/(\d+)\s*(?:er)?\s*-\s*(\d+)/g, (x, a, b) => { const r = []; for(let i = +a; i <= +b && r.length < 31; i++) r.push(i); return r.join(" "); });
  let n = 0, pend = 0;
  (s.match(/\d+|[a-z]+/g) || []).forEach(k => { if(/^\d{1,2}$/.test(k)) pend++; else if(MOISN[k]){ n += pend; pend = 0; } });
  return n;
}
/* une ligne de la proposition, avec son prix selon CPF ou hors CPF */
function propLigne(it){
  const x = rawFm(it.fid, it.code); if(!x || !x.m) return null;
  const { f, m } = x, d = (RAW.domaines || []).find(y => y.id === f.domaine) || {}, parcours = (f.modules || []).length > 1;
  const sess = (m.sessions || []).find(s => s.texte === it.session) || null;
  const prixCpf = parcours && Number(m.tarifParcours) > 0 ? Number(m.tarifParcours) : Number(m.tarif) || 0;
  const prix = it.type === "cpf" ? prixCpf : Number(m.tarif) || 0;
  const jours = sess ? joursDe(sess.texte) : (parcours ? 0 : parseInt(f.duree, 10) || 0);
  return { it, f, m, d, parcours, sess, prix, jours,
    certKey: parcours ? "d:" + f.domaine : "f:" + f.id,
    certNom: parcours ? (String(d.certification || "").split(":")[0].trim() || "Certification " + (d.nom || "")) : "Certification " + String(f.certification || "").replace(/\s*\(.*\)\s*$/, ""),
    certPrix: Number(f.tarifCertification) || 0 };
}
function propCalcul(){
  const lignes = prop.items.map(propLigne).filter(Boolean);
  const cpf = lignes.filter(l => l.it.type === "cpf"), hors = lignes.filter(l => l.it.type !== "cpf");
  const certs = []; cpf.forEach(l => { if(l.certPrix && !certs.some(c => c.key === l.certKey)) certs.push({ key: l.certKey, nom: l.certNom, prix: l.certPrix }); });
  /* un dossier CPF par certification : plafond et participation s'appliquent à chaque dossier */
  const dossiers = []; cpf.forEach(l => { let d = dossiers.find(x => x.key === l.certKey); if(!d){ d = { key: l.certKey, lignes: [], cert: certs.find(c => c.key === l.certKey) }; dossiers.push(d); } d.lignes.push(l); });
  dossiers.forEach(d => { d.total = d.lignes.reduce((t, l) => t + l.prix, 0) + (d.cert ? d.cert.prix : 0); d.prise = Math.min(d.total, PLAFOND_CPF); d.depass = d.total - d.prise; });
  const totalCpf = dossiers.reduce((t, d) => t + d.total, 0), priseEnCharge = dossiers.reduce((t, d) => t + d.prise, 0), depassement = totalCpf - priseEnCharge;
  const totalHors = hors.reduce((t, l) => t + l.prix, 0);
  const participation = prop.exonere ? 0 : PARTICIPATION_CPF * dossiers.length;
  const charge = totalHors + depassement + participation, jours = lignes.reduce((t, l) => t + l.jours, 0);
  return { lignes, cpf, hors, certs, dossiers, totalCpf, priseEnCharge, depassement, totalHors, participation, charge, jours, parJour: jours ? Math.round(charge / jours) : 0 };
}
/* case « Ajouter à la proposition » sous un module */
function propCtl(fid, code){
  const x = rawFm(fid, code); if(!x || !x.m) return "";
  const k = propKey(x.m), it = prop.items.find(i => i.key === k), s = aVenir(x.m);
  return `<div class="fo-prop"><label><input type="checkbox" data-pf="${esc(fid)}" data-pc="${esc(code)}"${it ? " checked" : ""}> Ajouter à la proposition</label>${s.length ? `<select class="fo-psess" data-pf="${esc(fid)}" data-pc="${esc(code)}" aria-label="Session">${s.map(z => `<option${(it ? it.session === z.texte : false) ? " selected" : ""}>${esc(z.texte)}</option>`).join("")}</select>` : ""}</div>`;
}
function propToggle(fid, code, on, session){
  const x = rawFm(fid, code); if(!x || !x.m) return;
  const k = propKey(x.m);
  prop.items = prop.items.filter(i => i.key !== k);
  if(on) prop.items.push({ key: k, fid, code, session: session || ((aVenir(x.m)[0] || {}).texte || ""), type: /^oui/i.test(String(x.m.cpf || "")) ? "cpf" : "hors" });
  propSave(); renderProp(); syncPropCtl();
}
function syncPropCtl(){
  document.querySelectorAll("input[data-pf]").forEach(c => { const x = rawFm(c.dataset.pf, c.dataset.pc); c.checked = !!(x && x.m && prop.items.some(i => i.key === propKey(x.m))); });
}
document.addEventListener("change", e => {
  const c = e.target.closest("input[data-pf]");
  if(c){ const sel = c.closest(".fo-prop").querySelector("select"); return propToggle(c.dataset.pf, c.dataset.pc, c.checked, sel ? sel.value : ""); }
  const s = e.target.closest("select.fo-psess");
  if(s){ const x = rawFm(s.dataset.pf, s.dataset.pc), it = x && x.m && prop.items.find(i => i.key === propKey(x.m)); if(it){ it.session = s.value; propSave(); renderProp(); } return; }
  const t = e.target.closest("#propPanel select[data-type]"), ss = e.target.closest("#propPanel select[data-sess]");
  if(t){ prop.items[+t.dataset.type].type = t.value; propSave(); renderProp(); return; }
  if(ss){ prop.items[+ss.dataset.sess].session = ss.value; propSave(); renderProp(); renderDetail(); return; }
  if(e.target.id === "propExo"){ prop.exonere = e.target.checked; propSave(); renderProp(); }
});
/* barre du bas + panneau récapitulatif */
function renderProp(){
  let bar = $("propBar");
  if(!bar){ bar = document.createElement("div"); bar.id = "propBar"; document.body.appendChild(bar); }
  if(!prop.items.length || state.view !== "consult"){ bar.hidden = true; document.body.style.paddingBottom = ""; return; }
  bar.hidden = false;
  const r = propCalcul(), n = r.lignes.length;
  const ligne = (l, i) => `<tr><td>${esc(l.d.nom || "")}</td><td>${esc(l.m.titre)}</td>
    <td>${(aVenir(l.m).length ? `<select data-sess="${i}">${aVenir(l.m).map(z => `<option${z.texte === l.it.session ? " selected" : ""}>${esc(z.texte)}</option>`).join("")}</select>` : `<span class="none">Pas de date</span>`)}</td>
    <td><select data-type="${i}"><option value="cpf"${l.it.type === "cpf" ? " selected" : ""}>CPF</option><option value="hors"${l.it.type !== "cpf" ? " selected" : ""}>Hors CPF</option></select></td>
    <td class="num">${eur(l.prix)}</td><td><button type="button" class="btn small danger" data-rmp="${i}" aria-label="Retirer">×</button></td></tr>`;
  const tot = (lab, v, cls) => `<tr class="${cls || ""}"><td colspan="4">${lab}</td><td class="num">${v}</td><td></td></tr>`;
  bar.innerHTML = `<div class="pb-row"><b>Proposition</b><span>${n} formation${n>1?"s":""}${r.jours ? ` · ${r.jours} jour${r.jours>1?"s":""}` : ""}</span>${r.totalCpf ? `<span>Dossier CPF ${eur(r.totalCpf)}</span>` : ""}<span class="pb-charge">À charge ${eur(r.charge)}</span>
      <button type="button" class="btn small" id="propOpen">${prop.ouvert ? "Masquer le détail" : "Voir le détail"}</button><button type="button" class="btn primary small" id="propWord">Générer le document Word</button></div>
    ${prop.ouvert ? `<div id="propPanel"><table class="pt"><thead><tr><th>Domaine</th><th>Formation</th><th>Date</th><th>Financement</th><th class="num">Tarif</th><th></th></tr></thead><tbody>
      ${r.lignes.map((l, i) => ligne(l, prop.items.indexOf(l.it))).join("")}
      ${r.certs.map(c => tot(esc(c.nom), eur(c.prix))).join("")}
      ${r.totalCpf ? tot(`<b>Total ${r.dossiers.length > 1 ? `des ${r.dossiers.length} dossiers CPF` : "dossier CPF"}</b>`, `<b>${eur(r.totalCpf)}</b>`, "st") + tot(`Prise en charge CPF (plafond ${eur(PLAFOND_CPF)}${r.dossiers.length > 1 ? " par dossier" : ""})`, eur(r.priseEnCharge)) + (r.depassement ? tot("Dépassement du plafond, à votre charge", eur(r.depassement)) : "") : ""}
      ${r.totalHors ? tot("Total formation hors CPF", eur(r.totalHors), "st") : ""}
      ${r.totalCpf ? tot(`Participation forfaitaire CPF${r.dossiers.length > 1 ? ` (${eur(PARTICIPATION_CPF)} × ${r.dossiers.length} dossiers)` : ""} <label class="exo"><input type="checkbox" id="propExo"${prop.exonere ? " checked" : ""}> exonéré(e)</label>`, prop.exonere ? "0 €" : eur(r.participation)) : ""}
      ${tot("<b>Total à votre charge</b>", `<b>${eur(r.charge)}</b>`, "tt")}
      ${r.jours ? tot("Nombre de jours · coût par jour à votre charge", `${r.jours} j · ${eur(r.parJour)}`) : ""}
      </tbody></table>
      <div class="pb-acts"><button type="button" class="btn small" id="propCopy">Copier le tableau</button><button type="button" class="btn small danger" id="propClear">Vider la proposition</button><span class="msg" id="propMsg" role="status"></span></div></div>` : ""}`;
  document.body.style.paddingBottom = (bar.offsetHeight + 16) + "px"; /* le contenu n'est jamais caché sous la barre */
}
document.addEventListener("click", async e => {
  if(e.target.id === "propOpen"){ prop.ouvert = !prop.ouvert; renderProp(); return; }
  if(e.target.id === "propClear"){ prop.items = []; prop.ouvert = false; propSave(); renderProp(); syncPropCtl(); return; }
  const rm = e.target.closest("[data-rmp]"); if(rm){ prop.items.splice(+rm.dataset.rmp, 1); propSave(); renderProp(); syncPropCtl(); return; }
  if(e.target.id === "propCopy"){ try{ await navigator.clipboard.writeText(propTexte()); $("propMsg").textContent = "Tableau copié : collez-le dans Word."; }catch(err){ $("propMsg").textContent = "Copie impossible ici."; } return; }
  if(e.target.id === "propWord"){ propWord(); return; }
});
function propTexte(){
  const r = propCalcul(), L = [["Domaine", "Formation", "Dates", "Financement", "Tarif"].join("\t")];
  r.lignes.forEach(l => L.push([l.d.nom || "", l.m.titre, l.it.session || "", l.it.type === "cpf" ? "CPF" : "Hors CPF", eur(l.prix)].join("\t")));
  r.certs.forEach(c => L.push(["", c.nom, "", "CPF", eur(c.prix)].join("\t")));
  if(r.totalCpf) L.push(["", "Total dossier CPF", "", "", eur(r.totalCpf)].join("\t"), ["", "Prise en charge CPF (plafond " + eur(PLAFOND_CPF) + ")", "", "", eur(r.priseEnCharge)].join("\t"));
  if(r.depassement) L.push(["", "Dépassement du plafond", "", "", eur(r.depassement)].join("\t"));
  if(r.totalHors) L.push(["", "Total formation hors CPF", "", "", eur(r.totalHors)].join("\t"));
  if(r.totalCpf) L.push(["", "Participation forfaitaire CPF" + (r.dossiers.length > 1 ? " (" + r.dossiers.length + " dossiers)" : ""), "", "", prop.exonere ? "exonéré(e)" : eur(r.participation)].join("\t"));
  L.push(["", "Total à votre charge", "", "", eur(r.charge)].join("\t"));
  if(r.jours) L.push(["", "Nombre de jours", "", "", String(r.jours)].join("\t"), ["", "Coût par jour à votre charge", "", "", eur(r.parJour)].join("\t"));
  return L.join("\n");
}
/* ----- document Word (bibliothèque docx chargée au premier usage) ----- */
let docxLib = null;
function chargerDocx(){
  if(window.docx) return Promise.resolve(window.docx);
  if(docxLib) return docxLib;
  docxLib = new Promise((ok, ko) => { const s = document.createElement("script"); s.src = "docx.iife.js"; s.onload = () => window.docx ? ok(window.docx) : ko(); s.onerror = ko; document.head.appendChild(s); });
  return docxLib;
}
async function propWord(){
  let D;
  try{ D = await chargerDocx(); }catch(e){ prop.ouvert = true; renderProp(); $("propMsg").textContent = "Le module Word n'a pas pu se charger. Utilisez « Copier le tableau »."; return; }
  const r = propCalcul(), avecHors = r.hors.length > 0, avecCpf = r.cpf.length > 0;
  const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell, WidthType, ExternalHyperlink, AlignmentType, BorderStyle, ShadingType, PageOrientation } = D;
  const BLEU = "84CCEC", BLEU_CLAIR = "DAE9F7", VERT = "B7D3C8", TXT = "1F3864";
  const run = (t, o) => new TextRun(Object.assign({ text: String(t), font: "Calibri", size: 20, color: TXT }, o || {}));
  const para = (c, o) => new Paragraph(Object.assign({ children: Array.isArray(c) ? c : [c] }, o || {}));
  const cols = avecHors && avecCpf ? [1500, 3800, 2000, 1400, 1400] : [1700, 4400, 2100, 1900]; /* largeur utile A4 : 10 100 */
  const total = cols.reduce((a, b) => a + b, 0);
  const cell = (children, o) => new TableCell(Object.assign({ children: Array.isArray(children) ? children : [children], margins: { top: 60, bottom: 60, left: 90, right: 90 } }, o || {}));
  const shade = c => ({ shading: { type: ShadingType.CLEAR, color: "auto", fill: c } });
  const head = new TableRow({ tableHeader: true, children: [
    cell(para(run("Domaine", { bold: true }), { alignment: AlignmentType.CENTER }), shade(BLEU)),
    cell(para(run("Lien vers les programmes", { bold: true }), { alignment: AlignmentType.CENTER }), shade(BLEU)),
    cell([para(run("Dates", { bold: true }), { alignment: AlignmentType.CENTER }), para(run("(d'autres dates possibles sur les programmes)", { size: 16 }), { alignment: AlignmentType.CENTER })], shade(BLEU)) ]
    .concat(avecHors ? [cell(para(run("Tarifs hors CPF", { bold: true }), { alignment: AlignmentType.CENTER }), shade(BLEU))] : [])
    .concat(avecCpf ? [cell(para(run("Tarifs préférentiels CPF", { bold: true }), { alignment: AlignmentType.CENTER }), shade(BLEU))] : []) });
  const prixCells = l => (avecHors ? [cell(para(run(l && l.it.type !== "cpf" ? eur(l.prix) : ""), { alignment: AlignmentType.CENTER }))] : [])
    .concat(avecCpf ? [cell(para(run(l && l.it.type === "cpf" ? eur(l.prix) : ""), { alignment: AlignmentType.CENTER }), shade(VERT))] : []);
  const lignes = r.lignes.map(l => {
    const u = safeUrl(l.m.lien);
    return new TableRow({ children: [
      cell(para(run(l.d.nom || "", { bold: true }))),
      cell(para(u ? new ExternalHyperlink({ link: u, children: [run(l.m.titre, { style: "Hyperlink", underline: {}, color: "2E74B5" })] }) : run(l.m.titre))),
      cell(para(run(l.it.session || "à définir", { bold: true, color: "2E74B5" })), shade(BLEU_CLAIR)) ].concat(prixCells(l)) });
  });
  const span = cols.length - 1;
  const ligneTot = (lab, val, fill, gras) => new TableRow({ children: [
    cell(para(run(lab, { bold: !!gras }), { alignment: AlignmentType.RIGHT }), Object.assign({ columnSpan: span }, fill ? shade(fill) : {})),
    cell(para(run(val, { bold: !!gras }), { alignment: AlignmentType.CENTER }), fill ? shade(fill) : {}) ] });
  const tots = [];
  r.certs.forEach(c => tots.push(ligneTot(c.nom + " *", eur(c.prix))));
  const nd = r.dossiers.length;
  if(avecCpf){ tots.push(ligneTot(nd > 1 ? `Total des ${nd} dossiers CPF` : "Total dossier CPF", eur(r.totalCpf), BLEU, true), ligneTot(`Prise en charge CPF (plafond ${eur(PLAFOND_CPF)}${nd > 1 ? " par dossier" : ""}, dans la limite de vos droits)`, eur(r.priseEnCharge), VERT)); if(r.depassement) tots.push(ligneTot("Dépassement du plafond CPF, à votre charge", eur(r.depassement))); }
  if(avecHors) tots.push(ligneTot("Total formation hors CPF", eur(r.totalHors), BLEU_CLAIR, true));
  if(avecCpf) tots.push(ligneTot(`Participation forfaitaire obligatoire CPF${nd > 1 ? ` (${eur(PARTICIPATION_CPF)} × ${nd} dossiers)` : ""} **`, prop.exonere ? "Exonéré(e)" : eur(r.participation)));
  tots.push(ligneTot("Total à votre charge", eur(r.charge), BLEU, true));
  if(r.jours){ tots.push(ligneTot("Nombre de jours de formation", String(r.jours), BLEU_CLAIR, true), ligneTot("Coût par jour à votre charge", eur(r.parJour))); }
  const bord = { style: BorderStyle.SINGLE, size: 6, color: "1F3864" };
  const table = new Table({ width: { size: total, type: WidthType.DXA }, columnWidths: cols, rows: [head].concat(lignes, tots),
    borders: { top: bord, bottom: bord, left: bord, right: bord, insideHorizontal: { style: BorderStyle.SINGLE, size: 4, color: "8EAADB" }, insideVertical: { style: BorderStyle.SINGLE, size: 4, color: "8EAADB" } } });
  const champ = lab => para([run(lab + " : ", { bold: true }), run("……………………………………………………………")], { spacing: { after: 80 } });
  const note = (t, gras) => para(run(t, { size: 16, bold: !!gras }), { spacing: { after: 40 } });
  const doc = new Document({ styles: { default: { document: { run: { font: "Calibri", size: 20 } } } }, sections: [{
    properties: { page: { size: { orientation: PageOrientation.PORTRAIT, width: 11906, height: 16838 }, margin: { top: 900, bottom: 900, left: 900, right: 900 } } },
    children: [
      para(run(avecCpf && avecHors ? "Proposition de parcours de formation (CPF et hors CPF)" : avecCpf ? "Proposition de parcours de formation financé par le CPF" : "Proposition de formation", { bold: true, size: 28 }), { spacing: { after: 200 } }),
      champ("Nom et prénom"), champ("Entreprise"), champ("Conseiller(ère) formation"), champ("Date de la proposition"), champ("Droits CPF disponibles"),
      para(run(""), { spacing: { after: 120 } }),
      table,
      para(run(""), { spacing: { after: 160 } }),
      avecCpf ? note("* Pourquoi une certification ? Le CPF ne finance que des formations préparant à une certification enregistrée auprès de France Compétences. Le passage de la certification est donc une condition du financement, et non une option : c'est elle qui rend le parcours éligible.") : note(""),
      avecCpf ? note("** La participation forfaitaire obligatoire", true) : note(""),
      avecCpf ? note("Depuis le 2 avril 2026 (décret n° 2026-234 du 30 mars 2026), toute personne qui mobilise son CPF doit verser une participation forfaitaire de 150 €, quel que soit le montant de ses droits. Elle est réglée directement sur la plateforme Mon Compte Formation au moment de la validation de l'inscription. Vous en êtes exonéré(e) si vous êtes demandeur d'emploi, ou si votre employeur complète votre financement par un abondement.") : note(""),
      avecCpf ? note(`Plafond : pour les formations menant à une certification du Répertoire spécifique, le CPF prend en charge au maximum ${eur(PLAFOND_CPF)} (décret n° 2026-127 du 24 février 2026). Montants en vigueur en 2026, susceptibles d'évoluer.`) : note("")
    ] }] });
  const blob = await Packer.toBlob(doc), nom = "Proposition-formation-" + new Date().toISOString().slice(0, 10) + ".docx";
  /* version Claude : enregistrement par la capacité « downloads » ; site GitHub : téléchargement classique */
  let dl = null; try{ dl = (typeof claude !== "undefined" && claude.use) ? await claude.use("downloads") : null; }catch(e){ dl = null; }
  if(dl){
    try{ await dl.save({ filename: nom, data: blob }); }
    catch(err){ prop.ouvert = true; renderProp(); $("propMsg").textContent = err && err.code === "declined" ? "Enregistrement annulé." : "Enregistrement impossible ici : utilisez « Copier le tableau »."; }
    return;
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nom;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

/* ---------- Démarrage ---------- */
function onData(){
  if(!ready()) return;
  buildModel();
  if(state.view === "consult") renderConsult(); else { renderAdmin(adm.tab === "categories"); }
  renderProp();
}
function useStatic(){ /* contenu lu dans contenu.js, pas de back office */
  canAdmin = false; $("views").hidden = true; $("admin").hidden = true;
  db = "statique"; RAW.domaines = CONTENU.domaines || []; RAW.formations = CONTENU.formations || []; RAW.profils = CONTENU.profils || []; onData();
}

/* ---------- Supabase : lecture publique, écriture pour les éditeurs connectés ---------- */
let SB = null;
async function bootSupabase(cfg){
  if(!window.supabase || !window.supabase.createClient) throw new Error("bibliothèque Supabase indisponible");
  SB = window.supabase.createClient(cfg.url, cfg.key);
  const load = async c => {
    const { data, error } = await SB.from(c).select("id,data").limit(5000);
    if(error) throw error;
    RAW[c] = (data || []).map(r => Object.assign({ id: r.id }, r.data || {}));
  };
  await Promise.all(["domaines", "formations", "profils"].map(load));
  const reload = async c => { await load(c); onData(); };
  const fail = () => { throw { code: "invalid_argument" }; };
  db = { doc: path => { const [c, id] = path.split("/"); return {
    set: async d => { const { error } = await SB.from(c).upsert({ id, data: d, updated_at: new Date().toISOString() }); if(error) fail(); await reload(c); },
    update: async d => { const cur = (RAW[c] || []).find(x => x.id === id); if(!cur) fail(); const base = Object.assign({}, cur); delete base.id;
      const { error } = await SB.from(c).upsert({ id, data: Object.assign(base, d), updated_at: new Date().toISOString() }); if(error) fail(); await reload(c); },
    delete: async () => { const { error } = await SB.from(c).delete().eq("id", id); if(error) fail(); await reload(c); }
  }; } };
  onData();
  $("loginBtn").hidden = false;
  await refreshAuth();
  SB.auth.onAuthStateChange(() => { setTimeout(refreshAuth, 0); });
}
async function refreshAuth(){
  const { data } = await SB.auth.getSession();
  const session = data && data.session;
  let ok = false;
  if(session){ const r = await SB.from("editeurs").select("email").limit(1); ok = !r.error && r.data && r.data.length > 0; }
  canAdmin = ok;
  $("loginBtn").textContent = session ? "Déconnexion" : "Connexion";
  $("views").hidden = !ok;
  if(session && !ok){ $("notice").textContent = "Ce compte n'a pas le droit de modifier le contenu."; $("notice").hidden = false; }
  else if($("notice").textContent.startsWith("Ce compte")) $("notice").hidden = true;
  if(!ok && state.view === "admin") document.querySelector('.vbtn[data-view="consult"]').click();
}
$("loginBtn").addEventListener("click", async () => {
  if(!SB) return;
  const { data } = await SB.auth.getSession();
  if(data && data.session){ await SB.auth.signOut(); toast("Déconnectée"); return; }
  $("loginForm").hidden = false; $("lEmail").focus();
});
$("lCancel").addEventListener("click", () => { $("loginForm").hidden = true; $("lMsg").textContent = ""; });
$("loginForm").addEventListener("submit", async e => {
  e.preventDefault(); if(!SB) return;
  $("lMsg").textContent = "Connexion…"; $("lMsg").className = "msg";
  const { error } = await SB.auth.signInWithPassword({ email: $("lEmail").value.trim(), password: $("lPass").value });
  if(error){ $("lMsg").textContent = "E-mail ou mot de passe incorrect."; $("lMsg").className = "msg err"; return; }
  $("lPass").value = ""; $("loginForm").hidden = true; $("lMsg").textContent = ""; toast("Connectée");
});

(async () => {
  if(window.SUPABASE_CONFIG){ /* version GitHub reliée à Supabase */
    try{ await bootSupabase(window.SUPABASE_CONFIG); return; }
    catch(e){
      if(window.CONTENU){ $("notice").textContent = "La base en ligne ne répond pas : affichage de la copie de secours du contenu. La gestion est indisponible pour le moment."; $("notice").hidden = false; useStatic(); return; }
      db = null; renderDetail(); return;
    }
  }
  if(window.CONTENU){ useStatic(); return; }
  try{ db = (typeof claude !== "undefined" && claude.use) ? await claude.use("db") : null; }catch(e){ db = null; }
  try{ user = (typeof claude !== "undefined" && claude.use) ? await claude.use("user") : null; }catch(e){ user = null; }
  if(!db){ renderDetail(); return; }
  ["domaines","formations","profils"].forEach(c => {
    db.collection(c).limit(1000).onSnapshot(snap => {
      RAW[c] = snap.docs.filter(x => x.exists).map(x => Object.assign({ id: x.id }, x.data()));
      onData();
    }, () => { if(!RAW[c]) RAW[c] = []; onData(); });
  });
  canAdmin = user ? await user.canEdit() : false;
  $("views").hidden = !canAdmin;
})();
renderDetail();
</script>
