/* ----- Formulaire catégorie de profils ----- */
function formCategorie(el, d){
  const isNew = adm.sel === "new", nomAct = isNew ? "" : adm.sel, toutes = domCats(d);
  const dedans = isNew ? [] : d.profils.filter(p => p.categories.includes(nomAct)), dehors = d.profils.filter(p => !dedans.includes(p));
  const rd = rawD(d.id) || {};
  el.innerHTML = `<div class="form"><h2>${isNew ? "Nouvelle catégorie" : "Catégorie : " + esc(nomAct)}</h2>
    <div class="fgrid">${field("Nom de la catégorie *", inp("fCatNom", nomAct, "ex. Commerce et artisanat"), true)}
      ${field("Mots-clés pour la recherche <small class=\"fhint\">— valent pour tous les sous-profils de la catégorie</small>", ta("fCatMots", ((rd.motsClesCategories || {})[nomAct]) || "", "ex. TPE, PME, gérant, patron, chef d'entreprise"), true)}</div>
    ${isNew ? "" : `<div class="actions" style="border:0;padding:0"><button type="button" class="btn small" data-move="-1">Monter dans la liste</button><button type="button" class="btn small" data-move="1">Descendre dans la liste</button><span class="fhint">Position ${toutes.indexOf(nomAct) + 1} sur ${toutes.length}</span></div>
    <div class="fsec"><h3>Sous-profils de cette catégorie (${dedans.length})</h3>
      <p class="fhint">Pour chaque sous-profil : « Ajouter aussi à… » le met dans une autre catégorie en plus de celle-ci ; « Déplacer vers… » le change de catégorie ; « Retirer d'ici » l'enlève de cette catégorie (possible seulement s'il est aussi ailleurs).</p>
      ${dedans.map(p => `<div class="catrow" data-pid="${esc(p.id)}"><b>${esc(p.nom)}</b><small>${p.categories.filter(c => c !== nomAct).map(esc).join(", ") || "seulement ici"}</small>
        <span class="catacts">
          <select class="inp catplus" aria-label="Ajouter aussi à"><option value="">Ajouter aussi à…</option>${toutes.filter(c => !p.categories.includes(c)).map(c => `<option>${esc(c)}</option>`).join("")}</select>
          <select class="inp catmv" aria-label="Déplacer vers"><option value="">Déplacer vers…</option>${toutes.filter(c => c !== nomAct).map(c => `<option>${esc(c)}</option>`).join("")}</select>
          <button type="button" class="btn small danger" data-out="1"${p.categories.length > 1 ? "" : ` disabled title="Seule catégorie de ce sous-profil : déplacez-le plutôt"`}>Retirer d'ici</button>
          <button type="button" class="btn small" data-edit="1">Ouvrir</button></span></div>`).join("") || `<p class="none">Aucun sous-profil pour l'instant.</p>`}
      <div class="catadd"><select class="inp" id="catAddSel"><option value="">Ajouter un sous-profil existant…</option>${dehors.map(p => `<option value="${esc(p.id)}">${esc(p.nom)} (${esc(p.categories.join(", "))})</option>`).join("")}</select><button type="button" class="btn small" id="catAddBtn">Ajouter</button><button type="button" class="btn add small" id="catNewProf">+ Créer un sous-profil ici</button></div>
    </div>`}
    ${formActions(!isNew)}</div>`;
  const majProfil = async (p, cats) => { await db.doc("profils/" + p.id).update({ categorie: cats[0], categories: cats }); };
  const majOrdre = async (l, mots) => { const u = { categories: l }; if(mots) u.motsClesCategories = mots; await db.doc("domaines/" + d.id).update(u); };
  const motsAvec = (ancien, nouveau, texte) => { const m = Object.assign({}, rd.motsClesCategories || {}); if(ancien && ancien !== nouveau) delete m[ancien]; if(nouveau){ if(texte) m[nouveau] = texte; else delete m[nouveau]; } return m; };
  el.onclick = async e => {
    const mv = e.target.closest("[data-move]");
    if(mv){ const l = toutes.slice(), i = l.indexOf(nomAct), j = i + Number(mv.dataset.move); if(j < 0 || j >= l.length) return; [l[i], l[j]] = [l[j], l[i]]; return write(() => majOrdre(l), "Ordre enregistré", () => {}); }
    const row = e.target.closest(".catrow"), p = row && d.profils.find(x => x.id === row.dataset.pid);
    if(row && e.target.closest("[data-out]")) return write(() => majProfil(p, p.categories.filter(c => c !== nomAct)), "Retiré de la catégorie", () => {});
    if(row && e.target.closest("[data-edit]")){ adm.tab = "profils"; adm.sel = p.id; renderAdmin(true); return; }
    if(e.target.id === "catAddBtn"){ const id = $("catAddSel").value, q = d.profils.find(x => x.id === id); if(!q) return setMsg("Choisissez un sous-profil."); return write(() => majProfil(q, q.categories.concat(nomAct)), "Sous-profil ajouté", () => {}); }
    if(e.target.id === "catNewProf"){ adm.tab = "profils"; adm.sel = "new"; adm.cat = nomAct; renderAdmin(false); renderAdmForm(); return; }
  };
  el.onchange = e => {
    const s = e.target.closest(".catmv, .catplus"); if(!s || !s.value) return;
    const p = d.profils.find(x => x.id === s.closest(".catrow").dataset.pid);
    if(s.classList.contains("catplus")) return write(() => majProfil(p, p.categories.concat(s.value)), `Ajouté aussi à « ${s.value} »`, () => {});
    write(() => majProfil(p, p.categories.map(c => c === nomAct ? s.value : c).filter((c, i, a) => a.indexOf(c) === i)), "Sous-profil déplacé", () => {});
  };
  el.querySelectorAll(".actions").forEach(a => a.addEventListener("click", async e => {
    const act = e.target.closest("[data-act]")?.dataset.act; if(!act) return;
    if(act === "cancel"){ adm.sel = null; renderAdmin(true); return; }
    if(act === "del"){
      if(dedans.length) return setMsg("Déplacez ou retirez d'abord les sous-profils de cette catégorie.");
      return askConfirm(`Supprimer la catégorie « ${nomAct} » ?`, async () => { await majOrdre(toutes.filter(c => c !== nomAct), motsAvec(nomAct, "", "")); adm.sel = null; toast("Catégorie supprimée"); });
    }
    const nom = $("fCatNom").value.trim(); if(!nom) return setMsg("Le nom est obligatoire.");
    if(nom !== nomAct && toutes.includes(nom)) return setMsg("Une catégorie porte déjà ce nom dans ce domaine.");
    const mots = $("fCatMots").value.trim();
    if(isNew) return write(() => majOrdre(toutes.concat(nom), motsAvec("", nom, mots)), "Catégorie créée", () => { adm.sel = nom; });
    if(nom === nomAct) return write(() => majOrdre(toutes, motsAvec(nomAct, nomAct, mots)), "Catégorie enregistrée", () => {});
    await write(async () => {
      for(const p of dedans) await majProfil(p, p.categories.map(c => c === nomAct ? nom : c));
      await majOrdre(toutes.map(c => c === nomAct ? nom : c), motsAvec(nomAct, nom, mots));
    }, "Catégorie renommée", () => { adm.sel = nom; });
  }));
}

        <input class="inp" id="fCatNew" placeholder="ou nouvelle catégorie : saisir son nom"></div>
      <div class="field full ia-line"><button type="button" class="ia-btn" data-ia="besoin" title="Proposer le besoin, son argumentaire détaillé et des mots-clés à partir du nom et des catégories (les champs déjà remplis servent de base)">✨ Rédiger le besoin et les mots-clés avec l'IA</button></div>
      ${field("Besoin <small class=\"fhint\">— une phrase, affichée d'emblée</small>", ta("fBesoin", r.besoin || ""), true)}
      <details class="mextra full"${r.besoinDetail ? "" : ""}><summary>Argumentaire détaillé du besoin (replié sur la fiche)</summary><div class="fgrid">
        ${field("Situation", ta("fBSit", (r.besoinDetail || {}).situation || "", "ex. Gère seul(e) toute son activité…"), true)}
        ${field("Difficulté", ta("fBDif", (r.besoinDetail || {}).difficulte || "", "ex. Manque de temps pour l'administratif…"), true)}
        ${field("Attente", ta("fBAtt", (r.besoinDetail || {}).attente || "", "ex. Déléguer une partie de ces tâches…"), true)}
      </div></details>
      ${field("Mots-clés pour la recherche <small class=\"fhint\">— séparés par des virgules : synonymes, métiers voisins, besoins exprimés (invisibles pour le conseiller)</small>", ta("fMotsCles", r.motsCles || "", "ex. boulanger, pâtissier, traiteur, attirer des clients"), true)}
      ${!isNew && METIERS_PROFILS[r.id] ? `<p class="fhint full mp-hint"><b>Métiers déjà reconnus automatiquement :</b> ${esc(METIERS_PROFILS[r.id])}. Ajoutez dans les mots-clés ceux qui manqueraient.</p>` : ""}
    </div>

      ${d.ordreModules.map(m => `<div class="modrow"><span class="code">${esc(m)}</span><div class="ia-wrap"><textarea class="inp com" data-m="${esc(m)}" aria-label="Argument module commun ${esc(m)}">${esc((r.reponses||{})[m] || "")}</textarea><button type="button" class="ia-btn ia-mini" data-ia="champ" data-kind="com" title="Rédiger ou améliorer ce texte avec l'IA">✨</button></div></div>`).join("")}

  $("addCp").onclick = () => $("cpRows").insertAdjacentHTML("beforeend", cpRow(d, { formation: "", pourquoi: "" }));
  $("cpRows").addEventListener("click", e => { if(e.target.closest("[data-rm]")) e.target.closest(".cprow").remove(); });
  const renum = () => [...document.querySelectorAll("#pcRows .pcrow")].forEach((row, i) => row.querySelector(".rank").textContent = "#" + (i + 1));
  $("addPc").onclick = () => { const free = d.formations.find(f => ![...document.querySelectorAll("#pcRows select")].some(s => s.value === f.id)); $("pcRows").insertAdjacentHTML("beforeend", pcRow(d, { formation: free ? free.id : (d.formations[0]||{}).id, pourquoi: "", reponses: {} }, 0)); renum(); };

    const row = e.target.closest(".pcrow"); if(!row) return;
    if(e.target.closest("[data-rm]")){ row.remove(); renum(); }
    if(e.target.closest("[data-up]") && row.previousElementSibling){ row.parentNode.insertBefore(row, row.previousElementSibling); renum(); }
    if(e.target.closest("[data-down]") && row.nextElementSibling){ row.parentNode.insertBefore(row.nextElementSibling, row); renum(); }
  });

    const row = e.target.closest(".pcrow"), kept = readRow(row);
    row.outerHTML = pcRow(d, { formation: e.target.value, pourquoi: kept.pourquoi, argumentaire: kept.argumentaire, reponses: kept.reponses }, 0); renum();
  });
  el.querySelector(".actions").addEventListener("click", async e => {
    const a = e.target.closest("[data-act]")?.dataset.act; if(!a) return;
    if(a === "cancel"){ adm.sel = null; renderAdmin(true); return; }

    if(new Set(parcours.map(x => x.formation)).size !== parcours.length) return setMsg("Le même parcours apparaît deux fois.");
    const manque = [];
    parcours.forEach(x => { const f = d.formations.find(f => f.id === x.formation); if(!f) return;
      if(!x.pourquoi) manque.push(`« Pourquoi » pour ${f.nom}`);
      Object.keys(f.modules).forEach(m => { if(!x.reponses[m] && !reponses[m]) manque.push(`${m} pour ${f.nom}`); }); });
    if(manque.length) return setMsg("À compléter : " + manque.slice(0, 4).join(" ; ") + (manque.length > 4 ? "…" : ""));
    const complements = [...document.querySelectorAll("#cpRows .cprow")].map(row => ({ formation: row.querySelector("select").value, pourquoi: row.querySelector("input").value.trim() })).filter(c => c.formation);
    const id = isNew ? d.id + "-" + slug(nom) : adm.sel;
    if(isNew && rawP(id)) return setMsg("Un profil porte déjà ce nom dans ce domaine.");
    const maxOrdre = Math.max(0, ...d.profils.map(p => (rawP(p.id) || {}).ordre || 0));
    const motsCles = $("fMotsCles").value.trim();
    const data = { domaine: d.id, categorie, categories, motsCles, nom, besoin: $("fBesoin").value.trim(), reponses, parcours, complements,

      ordre: Number($("fOrdre").value) || (isNew ? maxOrdre + 1 : (r.ordre ?? 99)) };
    await write(() => db.doc("profils/" + id).set(data), "Profil enregistré", () => { adm.sel = id; });
  });
}
function pcRow(d, x, i){
  const f = d.formations.find(f => f.id === x.formation);
  return `<div class="pcrow"><div class="pchead"><span class="rank">#${i+1}</span>
      <select class="pcf" aria-label="Parcours">${d.formations.map(o => `<option value="${esc(o.id)}"${o.id===x.formation?" selected":""}>${esc(o.nom)}</option>`).join("")}</select>
      <button type="button" class="btn small" data-up="1">Monter</button><button type="button" class="btn small" data-down="1">Descendre</button><button type="button" class="btn small danger" data-rm="1">Retirer</button><button type="button" class="ia-btn" data-ia="pc" title="Rédiger le pourquoi, l'argumentaire détaillé et l'argument de chaque module pour ce sous-profil">✨ Rédiger avec l'IA</button></div>
    <div class="modrow"><span class="rh rh-pq">Pourquoi</span><div class="ia-wrap inl"><input class="inp pcw" value="${esc(x.pourquoi || "")}" placeholder="ex. Si sa clientèle est locale. (une ligne, affichée d'emblée)"><button type="button" class="ia-btn ia-mini" data-ia="champ" data-kind="pourquoi" title="Rédiger ou améliorer ce texte avec l'IA">✨</button></div></div>
    <div class="modrow"><span class="rh rh-arg">Argumentaire détaillé</span><div class="ia-wrap"><textarea class="inp pca" placeholder="Replié sur la fiche : ce que chaque module apporte, le résultat concret. Laisser vide si inutile.">${esc(x.argumentaire || "")}</textarea><button type="button" class="ia-btn ia-mini" data-ia="champ" data-kind="argumentaire" title="Rédiger ou améliorer ce texte avec l'IA">✨</button></div></div>
    ${f ? `<div class="arg-sous">Arguments parcours <span>— propres à ce parcours ; vide = l'argument module commun s'affiche</span></div>` + Object.keys(f.modules).map(m => `<div class="modrow"><span class="code">${esc(m)}</span><div class="ia-wrap"><textarea class="inp pcm" data-m="${esc(m)}" placeholder="Vide : l'argument module commun ${esc(m)} s'affiche">${esc((x.reponses||{})[m] || "")}</textarea><button type="button" class="ia-btn ia-mini" data-ia="champ" data-kind="pcm" title="Rédiger ou améliorer ce texte avec l'IA">✨</button></div></div>`).join("") : ""}
  </div>`;
}
function cpRow(d, c){
  const autres = DOMAINES.filter(x => x.id !== d.id);
  return `<div class="cprow"><select aria-label="Formation complémentaire"><option value="">Choisir une formation…</option>${autres.map(x => `<optgroup label="${esc(x.nom)}">${x.formations.map(f => `<option value="${esc(f.id)}"${f.id===c.formation?" selected":""}>${esc(f.nom)}</option>`).join("")}</optgroup>`).join("")}</select><input class="inp" value="${esc(c.pourquoi || "")}" placeholder="Pourquoi la proposer" aria-label="Pourquoi la proposer"><button type="button" class="ia-btn" data-ia="cp" title="Rédiger le pourquoi avec l'IA">✨ IA</button><button type="button" class="btn small danger" data-rm="1">Retirer</button></div>`;
}
function readRow(row){
  const reponses = {};
  row.querySelectorAll("textarea.pcm").forEach(t => { if(t.value.trim()) reponses[t.dataset.m] = t.value.trim(); });
  const o = { formation: row.querySelector("select.pcf").value, pourquoi: row.querySelector(".pcw").value.trim(), reponses };
  const a = row.querySelector(".pca"); if(a && a.value.trim()) o.argumentaire = a.value.trim();
  return o;
}

function askConfirm(text, run, label, okText){
  $("fconfirm").innerHTML = `<div class="confirm"><span>${esc(text)}</span><button type="button" class="btn ${label ? "primary" : "danger"}" id="cYes">${esc(label || "Confirmer la suppression")}</button><button type="button" class="btn" id="cNo">Annuler</button></div>`;
  $("cNo").onclick = () => $("fconfirm").innerHTML = "";
  $("cYes").onclick = () => write(run, okText || null, () => {}).then(() => { if(!okText) renderAdmin(true); });
}
async function write(fn, okText, after){
  const btns = document.querySelectorAll("#admForm button"); btns.forEach(b => b.disabled = true);
  try{ await fn(); if(after) after(); if(okText){ toast(okText); renderAdmin(true); setMsg(okText, true); } }
  catch(err){
    btns.forEach(b => b.disabled = false);
    const c = err && err.code;
    setMsg(c === "invalid_argument" ? "Enregistrement refusé : vous n'avez pas les droits de modification." :
           c === "quota_exceeded" ? "La base est pleine : supprimez des éléments inutiles." :
           "Enregistrement impossible pour le moment. Réessayez dans un instant.");
  }
}

let PLAFOND_CPF = 1500, PARTICIPATION_CPF = 150; /* modifiables dans Gestion › Modèles d'e-mail › Mentions CPF */
const prop = { items: [], exonere: false, ouvert: false, mail: false };
/* la proposition dure le temps de l'onglet (sessionStorage) : on repart d'une page vide à chaque ouverture */
try{ localStorage.removeItem("proposition-v1"); }catch(e){}
try{ const x = JSON.parse(sessionStorage.getItem("proposition-v1") || "null"); if(x && Array.isArray(x.items)){ prop.items = x.items; prop.exonere = !!x.exonere; } }catch(e){}

const propKey = m => norm(m.titre || "");
const itemKey = (fid, code) => fid + "|" + code; /* une case = un module dans une formation ou un parcours précis */
/* nombre de jours d'une session écrite en texte */
function joursDe(t){
  const s = norm(t || "").replace(/(\d+)\s*(?:er)?\s*au\s*(\d+)/g, (x, a, b) => { const r = []; for(let i = +a; i <= +b && r.length < 31; i++) r.push(i); return r.join(" "); })
    .replace(/(\d+)\s*(?:er)?\s*-\s*(\d+)/g, (x, a, b) => { const r = []; for(let i = +a; i <= +b && r.length < 31; i++) r.push(i); return r.join(" "); });
  let n = 0, pend = 0;
  (s.match(/\d+|[a-z]+/g) || []).forEach(k => { if(/^\d{1,2}$/.test(k)) pend++; else if(MOISN[k]){ n += pend; pend = 0; } });
  return n;
}

function propContexte(it){ return rawFm(it.fid, it.code); } /* le module retenu est celui du parcours où il a été coché */

function propJoursTotal(){ return prop.items.reduce((t, it) => { const x = propContexte(it); if(!x || !x.m) return t;
  const s = (x.m.sessions || []).find(y => y.texte === it.session) || aVenir(x.m)[0]; return t + (s ? joursDe(s.texte) : 0); }, 0); }

  const alt = cpfOk(m.cpf) ? null : cpfAlt(m.titre); /* éligible CPF avec sa propre certification */
  if(!it.manuel) it.type = (cpfOk(m.cpf) || alt) ? "cpf" : "hors"; /* toutes les certifications comptées ; retirables dans le détail */
  if(it.type === "cpf" && !cpfOk(m.cpf) && !alt) it.type = "hors";

  /* tarif préférentiel (« en parcours ») : seulement quand la proposition compte au moins 2 formations ou modules
     (parcours ou non) ; une seule case cochée = tarif plein, même pour un module de parcours */
  /* « en parcours, ou dès N jours » (Gestion) : parcours complet retenu, ou au moins N jours de formation dans la proposition ;
     sans N : dès 2 formations ou modules (règle d'origine) */
  const nPJ = Number(m.prefJours) || 0;

function propCalcul(){

  Object.values(parCle).forEach(g => { const min = Math.max(...g.map(l => l.minJ || 0)); if(!min) return;

}

function propTexte(){

  r.certs.forEach(c => L.push(["", c.nom, "", "CPF", eur(c.prix)].join("\t")));
  if(r.totalCpf) L.push(["", "Total dossier CPF", "", "", eur(r.totalCpf)].join("\t"), ["", "Prise en charge CPF (plafond " + eur(PLAFOND_CPF) + ")", "", "", eur(r.priseEnCharge)].join("\t"));

  flushP(); flush(); return out.join("");
}

let SB = null;
async function bootSupabase(cfg){
  if(!window.supabase || !window.supabase.createClient) throw new Error("bibliothèque Supabase indisponible");
  SB = window.supabase.createClient(cfg.url, cfg.key);
  const load = async c => {
    const { data, error } = await SB.from(c).select("id,data").limit(5000);
    if(error) throw error;
    RAW[c] = (data || []).map(r => Object.assign({ id: r.id }, r.data || {}));
  };
  await Promise.all(["domaines", "formations", "profils"].map(load));
  const reload = async c => { await load(c); onData(); };
  const fail = () => { throw { code: "invalid_argument" }; };
  db = { doc: path => { const [c, id] = path.split("/"); return {
    set: async d => { const { error } = await SB.from(c).upsert({ id, data: d, updated_at: new Date().toISOString() }); if(error) fail(); await reload(c); },
    update: async d => { const cur = (RAW[c] || []).find(x => x.id === id); if(!cur) fail(); const base = Object.assign({}, cur); delete base.id;
      const { error } = await SB.from(c).upsert({ id, data: Object.assign(base, d), updated_at: new Date().toISOString() }); if(error) fail(); await reload(c); },
    delete: async () => { const { error } = await SB.from(c).delete().eq("id", id); if(error) fail(); await reload(c); }
  }; } };
  onData();
  $("loginBtn").hidden = false;
  await refreshAuth();
  SB.auth.onAuthStateChange(() => { setTimeout(refreshAuth, 0); });
}
async function refreshAuth(){
  const { data } = await SB.auth.getSession();
  const session = data && data.session;
  let ok = false, lit = false;
  if(session){
    const r = await SB.from("editeurs").select("email").limit(1); ok = !r.error && r.data && r.data.length > 0;
    const c = ok ? null : await SB.from("conseilleres").select("email").limit(1); lit = ok || (!!c && !c.error && c.data && c.data.length > 0);
  }
  canAdmin = ok; canRead = lit; if(ok && adm.tab === "comptes") chargerComptes();
  if(ok) setTimeout(iaSbTester, 0);

  $("views").hidden = !ok;
  if(session && !lit){ $("notice").textContent = "Ce compte n'est pas encore autorisé : demandez à être ajouté(e) à la liste des conseillères."; $("notice").hidden = false; }
  else if($("notice").textContent.startsWith("Ce compte")) $("notice").hidden = true;
  if(!ok && (state.view === "admin" || state.view === "pilot")) document.querySelector('.vbtn[data-view="consult"]').click();
}

      iaRemplir(b, [[$("fBesoin"), r.besoin], [$("fBSit"), r.situation], [$("fBDif"), r.difficulte], [$("fBAtt"), r.attente], [$("fMotsCles"), r.motsCles]]);
      const det = $("fBSit") && $("fBSit").closest("details"); if(det) det.open = true;
    }
    toast("Suggestion de l'IA : relisez, puis Enregistrer");
  }catch(err){ toast(err && err.code === "rate_limited" ? "IA très sollicitée : réessayez dans un instant." : (err && err.message) || "L'IA n'a pas pu répondre."); }
  finally{ b.disabled = false; b.innerHTML = lib; }
});

/* prototype : parcours complet en un clic, ou module(s) au choix */
function syncChoix(){
  document.querySelectorAll("[data-actout]").forEach(b => { const f = rawF(b.dataset.actout); if(!f) return; const codes = (f.modules || []).map(m => m.code);
    const n = codes.filter(c => prop.items.some(i => i.key === itemKey(f.id, c))).length;
    b.classList.toggle("on", n === codes.length);
    const pt = document.querySelector(`[data-acpart="${CSS.escape(f.id)}"]`); if(pt) pt.textContent = n && n < codes.length ? `${n} module${n > 1 ? "s" : ""} sur ${codes.length} choisi${n > 1 ? "s" : ""}` : ""; });
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-actout]"); if(!b) return; e.preventDefault(); e.stopPropagation();
  const f = rawF(b.dataset.actout), codes = (f.modules || []).map(m => m.code), tous = codes.every(c => prop.items.some(i => i.key === itemKey(f.id, c)));
  codes.forEach(c => propToggle(f.id, c, !tous)); syncChoix();
}, true);
document.addEventListener("change", () => setTimeout(syncChoix, 0));
new MutationObserver(() => syncChoix()).observe(document.getElementById("detail"), { childList: true });

/* ===== Pilotage › Liste : filtres et notes ===== */
let pilFilTimer = null;
document.addEventListener("change", e => { const t = e.target.closest && e.target.closest("#pilot [data-pfil]"); if(!t || t.dataset.pfil === "q") return; PIL.f[t.dataset.pfil] = t.value || (t.dataset.pfil === "periode" ? "avenir" : ""); renderPilot(); });
document.addEventListener("input", e => { const t = e.target.closest && e.target.closest('#pilot [data-pfil="q"]'); if(!t) return; clearTimeout(pilFilTimer);
  pilFilTimer = setTimeout(() => { PIL.f.q = t.value.trim(); renderPilot(); const z = document.querySelector('#pilot [data-pfil="q"]'); if(z){ z.focus(); z.selectionStart = z.selectionEnd = z.value.length; } }, 300); });
document.addEventListener("click", e => {
  const c = e.target.closest("#pilot [data-pfchip]"); if(c){ PIL.f[c.dataset.pfchip] = !PIL.f[c.dataset.pfchip]; renderPilot(); return; }
  if(e.target.closest("#pilot [data-pfreset]")){ PIL.f = { periode: "avenir" }; renderPilot(); return; }
  const h = e.target.closest("#pilot [data-pthf]"); if(h){ e.stopPropagation(); const z = document.querySelector(`#pilot [data-pfil="${h.dataset.pthf}"]`); if(z){ z.scrollIntoView({ block: "nearest" }); z.focus(); try{ z.showPicker && z.showPicker(); }catch(_){ } } return; }
  const n = e.target.closest("#pilot [data-pnote]"); if(n){ e.stopPropagation(); pilNoteOuvrir(n); return; }
  const pop = document.getElementById("pilNote"); if(pop && !e.target.closest("#pilNote")) pop.remove();
});
function pilNoteOuvrir(btn){
  document.getElementById("pilNote")?.remove();
  const [id, k] = btn.dataset.pnote.split("|"), cle = "note_" + k, r = btn.getBoundingClientRect();
  const p = document.createElement("div"); p.id = "pilNote"; p.className = "pl-notepop";
  p.innerHTML = `<b>Note · ${k.startsWith("p") ? "pré-réservation " + k.slice(1) : "inscrits " + k}</b><textarea rows="3" placeholder="ex. 2 personnes de la société X, en attente du devis">${esc(pilVal(id, cle) || "")}</textarea><div><button type="button" class="btn small primary" data-pnok="1">Enregistrer</button>${pilVal(id, cle) ? `<button type="button" class="btn small" data-pnsup="1">Supprimer</button>` : ""}</div>`;
  p.style.left = Math.max(8, Math.min(window.innerWidth - 280, r.left + window.scrollX - 120)) + "px"; p.style.top = (r.bottom + window.scrollY + 6) + "px";
  document.body.appendChild(p); const ta = p.querySelector("textarea"); ta.focus();
  const fin = v => { PIL.edits[id] = Object.assign(PIL.edits[id] || {}, { [cle]: v }); pilSave(id); p.remove(); renderPilot(); };
  p.addEventListener("click", ev => { if(ev.target.dataset.pnok) fin(ta.value.trim()); if(ev.target.dataset.pnsup) fin(""); });
}
/* report des saisies du Pilotage quand une date ou un titre de module change dans la Gestion */
async function pilReporter(ancienne, nouvelle){
  if(!Array.isArray(RAW.pilotage) || !ancienne || !Array.isArray(ancienne.modules)) return 0;
  const sid = (titre, texte) => { const j = joursSession(texte || ""); return j.length ? norm(titre || "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60) + "__" + j[0] : ""; };
  let n = 0;
  for(const m of (nouvelle.modules || [])){
    const om = ancienne.modules.find(x => x.code === m.code) || ancienne.modules.find(x => norm(x.titre || "") === norm(m.titre || "")); if(!om) continue;
    const avant = (om.sessions || []).map(x => sid(om.titre, x.texte)).filter(Boolean), apres = (m.sessions || []).map(x => sid(m.titre, x.texte)).filter(Boolean);
    const partis = avant.filter(x => !apres.includes(x)), arrives = apres.filter(x => !avant.includes(x));
    if(!partis.length || partis.length !== arrives.length) continue; /* date ajoutée ou retirée : rien à reporter */
    for(let i = 0; i < partis.length; i++){
      const src = (RAW.pilotage || []).find(x => x.id === partis[i]), dst = (RAW.pilotage || []).find(x => x.id === arrives[i]);
      if(!src || dst) continue; const data = Object.assign({}, src); delete data.id;
      await db.doc("pilotage/" + arrives[i]).set(data); await db.doc("pilotage/" + partis[i]).delete(); n++;
    }
  }
  return n;
}
